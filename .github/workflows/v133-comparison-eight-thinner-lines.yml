name: v0.22.133 comparison update

on:
  push:
    branches:
      - release/v0.22.133-comparison-eight-thinner-lines

permissions:
  contents: write

jobs:
  update-and-test:
    if: github.event.head_commit.message != 'v0.22.133 allow eight fundraiser comparisons and thin chart lines'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.22.133-comparison-eight-thinner-lines
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.22.133 changes
        run: python .github/v133_comparison_update.py
      - name: Syntax check
        run: node --check assets/js/one-sheet-reports.js
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-reports.js reports.html version.json tests/comparison-eight-thinner-lines-v133.test.mjs tests/historical-labels-season-filter-v132.test.mjs tests/historical-refinements-v131.test.mjs tests/library-load-performance.test.mjs tests/report-visual-historical-context-v130.test.mjs tests/one-sheet-report-refinements.test.mjs tests/one-sheet-reports.test.mjs tests/one-sheet-analysis-hardening.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "v0.22.133 allow eight fundraiser comparisons and thin chart lines"
          git push origin HEAD:release/v0.22.133-comparison-eight-thinner-lines
