name: Emergency import scheduler source repair

on:
  push:
    paths:
      - '.github/workflows/emergency-import-scheduler-hotfix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair importer and scheduler source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # 1) Only human-confirmed manual matches may seed cross-session match memory.
          data_path = Path('assets/js/data.js')
          data = data_path.read_text(encoding='utf-8')
          data = replace_once(
              data,
              ".in('match_method', ['manual_library', 'saved_title_rule'])",
              ".eq('match_method', 'manual_library')",
              'manual-only match-memory query'
          )
          data = replace_once(
              data,
              "return (allRows || []).filter((row) => ['manual_library', 'saved_title_rule'].includes(String(row?.match_method || '').trim().toLowerCase()));",
              "return (allRows || []).filter((row) => String(row?.match_method || '').trim().toLowerCase() === 'manual_library');",
              'manual-only match-memory fallback'
          )
          data_path.write_text(data, encoding='utf-8')

          imports_path = Path('assets/js/ui-imports.js')
          imports = imports_path.read_text(encoding='utf-8')

          imports = replace_once(
              imports,
              "    const localRules = utils.storageGet(IMPORT_MATCH_RULES_STORAGE_KEY, []);",
              "    const localRules = (utils.storageGet(IMPORT_MATCH_RULES_STORAGE_KEY, []) || [])\n      .filter((rule) => !String(rule?.id || '').startsWith('history:'));",
              'drop cached historical auto-rules before rebuilding memory'
          )
          imports = replace_once(
              imports,
              "      if (!['manual_library', 'saved_title_rule'].includes(method)) return;",
              "      if (method !== 'manual_library') return;",
              'manual-only historical alias source'
          )

          alias_block = """    const aliasRule = findAliasRuleForRow({ station, imported_program_title: importedTitle, nola_code: importedCode });
    if (aliasRule) {
      const target = (state.rawRows || []).find((row) => String(derive.programId(row) || '').trim() === String(aliasRule.targetProgramId || '').trim()) || null;
      if (target) {
        const scopeLabel = aliasRule.matchScope === 'title' ? 'saved import-title rule' : 'saved import-title/NOLA rule';
        return { program: target, matchMethod: 'saved_title_rule', matchReason: `Matched from a ${scopeLabel}.` };
      }
    }
"""
          if imports.count(alias_block) != 1:
              raise SystemExit(f'alias priority block: expected exactly one match, found {imports.count(alias_block)}')
          imports = imports.replace(alias_block, '', 1)
          safe_anchor = """    if (specificNola && broadImportedTitle(importedTitle)) {
      return { program: null, matchMethod: 'unmatched', matchReason: `NOLA ${importedLibraryNola} did not match a pledge-library NOLA after normalization. The imported title “${importedTitle}” is too broad for safe fuzzy title matching.` };
    }
"""
          if imports.count(safe_anchor) != 1:
              raise SystemExit(f'alias fallback anchor: expected exactly one match, found {imports.count(safe_anchor)}')
          imports = imports.replace(safe_anchor, safe_anchor + alias_block, 1)

          imports = replace_once(
              imports,
              "scheduleSummary = await App.schedulingUi.buildSchedulesFromImportedReports({ rows: importableRows, rebuild: false, activateFirst: true });",
              "scheduleSummary = await App.schedulingUi.buildSchedulesFromImportedReports({ rows: importableRows, rebuild: false, activateFirst: true, replaceImportedDates: true });",
              'make current report dates authoritative'
          )
          imports_path.write_text(imports, encoding='utf-8')

          # 2) Remove hidden all-history schedule mutation. Explicit repair remains available.
          sched_path = Path('assets/js/ui-scheduling.js')
          sched = sched_path.read_text(encoding='utf-8')
          heal_start = sched.find('  async function healImportedSchedulesIfNeeded() {')
          heal_end = sched.find('\n\n  function scheduleWarmupDelay', heal_start)
          if heal_start < 0 or heal_end < 0:
              raise SystemExit('automatic schedule heal function region not found')
          sched = sched[:heal_start] + sched[heal_end+2:]

          heal_call = """    void healImportedSchedulesIfNeeded()
      .then(() => {
        ensureCurrentScheduleApplied();
        if (state.activeWorkspace === 'scheduling') renderAll();
      })
      .catch((error) => {
        console.warn('Imported schedule auto-heal failed.', error);
      });
"""
          if sched.count(heal_call) != 1:
              raise SystemExit(f'automatic schedule heal call: expected exactly one match, found {sched.count(heal_call)}')
          sched = sched.replace(heal_call, '', 1)

          old_signature = "  function mergeImportedRowsIntoSchedules(rows = [], { rebuild = false, activateFirst = true, dirtySchedules = [], allowDuplicateMerges = true, allowCreateMissing = true, allowRefreshPlacements = true, allowTitleUpdates = false } = {}) {"
          new_signature = "  function mergeImportedRowsIntoSchedules(rows = [], { rebuild = false, activateFirst = true, dirtySchedules = [], allowDuplicateMerges = true, allowCreateMissing = true, allowRefreshPlacements = true, allowTitleUpdates = false, replaceImportedDates = false } = {}) {"
          sched = replace_once(sched, old_signature, new_signature, 'merge option signature')

          old_refresh = """      const preservedLiveBreaks = collectLiveBreakPreserveMap(schedule, group.key);
      const shouldRefreshPlacements = Boolean(allowRefreshPlacements || createdThisSchedule || duplicateSchedules.length || rebuild);
"""
          new_refresh = """      const preservedLiveBreaks = collectLiveBreakPreserveMap(schedule, group.key);
      const authoritativeImportedDates = replaceImportedDates
        ? new Set((group.rows || []).map((entry) => utils.normalizeText(entry?.dateKey || importedRowDateKey(entry?.row || {}))).filter(Boolean))
        : new Set();
      const shouldRefreshPlacements = Boolean(allowRefreshPlacements || createdThisSchedule || duplicateSchedules.length || rebuild);
"""
          sched = replace_once(sched, old_refresh, new_refresh, 'authoritative current-report dates')

          old_filter = """          schedule.placements = (schedule.placements || []).filter((placement) => {
            if (!placement?.importedFromReport) return true;
            const sameImportedKey = utils.normalizeText(placement?.importedFundraiserKey) === utils.normalizeText(group.key);
"""
          new_filter = """          schedule.placements = (schedule.placements || []).filter((placement) => {
            if (!placement?.importedFromReport) return true;
            if (replaceImportedDates && authoritativeImportedDates.has(utils.normalizeText(placement?.dateKey))) return false;
            const sameImportedKey = utils.normalizeText(placement?.importedFundraiserKey) === utils.normalizeText(group.key);
"""
          sched = replace_once(sched, old_filter, new_filter, 'remove stale imported placements on current report dates')

          old_pass = """      allowDuplicateMerges: options.allowDuplicateMerges !== false,
      allowCreateMissing: options.allowCreateMissing !== false,
      allowRefreshPlacements: options.allowRefreshPlacements !== false,
      allowTitleUpdates: Boolean(options.allowTitleUpdates)
"""
          new_pass = """      allowDuplicateMerges: options.allowDuplicateMerges !== false,
      allowCreateMissing: options.allowCreateMissing !== false,
      allowRefreshPlacements: options.allowRefreshPlacements !== false,
      allowTitleUpdates: Boolean(options.allowTitleUpdates),
      replaceImportedDates: Boolean(options.replaceImportedDates)
"""
          sched = replace_once(sched, old_pass, new_pass, 'pass current-report authority option')
          sched_path.write_text(sched, encoding='utf-8')

          version_path = Path('version.json')
          version = json.loads(version_path.read_text(encoding='utf-8'))
          if version.get('appVersion') != '0.22.60':
              raise SystemExit(f"Expected version 0.22.60, found {version.get('appVersion')!r}")
          version['appVersion'] = '0.22.61'
          version['releasedAt'] = '2026-08-12'
          version_path.write_text(json.dumps(version, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Validate regression repair
        shell: bash
        run: |
          node --check assets/js/data.js
          node --check assets/js/ui-imports.js
          node --check assets/js/ui-scheduling.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json

          data = Path('assets/js/data.js').read_text(encoding='utf-8')
          imports = Path('assets/js/ui-imports.js').read_text(encoding='utf-8')
          sched = Path('assets/js/ui-scheduling.js').read_text(encoding='utf-8')
          version = json.loads(Path('version.json').read_text(encoding='utf-8'))

          assert version.get('appVersion') == '0.22.61'
          assert "['manual_library', 'saved_title_rule']" not in data[data.index('async function fetchImportedMatchMemoryRows'):data.index('async function fetchUnlinkedImportedAirings')]
          assert "if (method !== 'manual_library') return;" in imports
          assert ".filter((rule) => !String(rule?.id || '').startsWith('history:'))" in imports
          assert 'replaceImportedDates: true' in imports
          assert 'function healImportedSchedulesIfNeeded' not in sched
          assert 'healImportedSchedulesIfNeeded()' not in sched
          assert 'replaceImportedDates = false' in sched
          assert 'authoritativeImportedDates.has' in sched
          assert 'replaceImportedDates: Boolean(options.replaceImportedDates)' in sched

          fn_start = imports.index('function findProgramForImport')
          fn_end = imports.index('function normalizeAiringRow', fn_start)
          fn = imports[fn_start:fn_end]
          positions = {
              'program_id': fn.index("if (reportOnlyCode && libraryLookup.byProgramId"),
              'nola': fn.index("if (nolaKey && libraryLookup.byNola.has"),
              'title': fn.index("if (titleKey && libraryLookup.byUniqueTitle.has"),
              'clean_title': fn.index("if (compactTitleKey && libraryLookup.byUniqueCompactTitle?.has"),
              'alias': fn.index('const aliasRule = findAliasRuleForRow'),
              'fuzzy': fn.index('const fuzzy = findFuzzyTitleMatch')
          }
          assert all(v >= 0 for v in positions.values()), positions
          assert positions['program_id'] < positions['alias']
          assert positions['nola'] < positions['alias']
          assert positions['title'] < positions['alias']
          assert positions['clean_title'] < positions['alias']
          assert positions['alias'] < positions['fuzzy']
          print('Validated import evidence priority:', positions)
          PY

      - name: Commit source repair and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/emergency-import-scheduler-hotfix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add assets/js/data.js assets/js/ui-imports.js assets/js/ui-scheduling.js version.json .github/workflows/emergency-import-scheduler-hotfix.yml
          git commit -m "Prevent unrelated imported rows from contaminating schedules"
          git push origin HEAD:main
