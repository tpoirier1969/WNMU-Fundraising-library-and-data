name: Manual schedule result entry

on:
  push:
    paths:
      - ".github/workflows/manual-schedule-results.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply manual result implementation
        run: python tools/manual_schedule_results.py

      - name: Validate source
        shell: bash
        run: |
          node --check assets/js/dom.js
          node --check assets/js/ui-scheduling.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json
          shell = Path('app-shell.html').read_text(encoding='utf-8')
          dom = Path('assets/js/dom.js').read_text(encoding='utf-8')
          sched = Path('assets/js/ui-scheduling.js').read_text(encoding='utf-8')
          styles = Path('assets/styles.css').read_text(encoding='utf-8')
          version = json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert version.get('appVersion') == '0.22.71'
          assert 'schedule-manual-result-panel' in shell
          assert 'scheduleManualResultPanel' in dom
          assert 'manualResultRecorded' in sched
          assert 'saveManualResultToSelectedPlacement' in sched
          assert 'placementHasRecordedResult' in sched
          assert 'scheduleManualBroadcastTotal' in sched
          assert 'schedulePledgesTotal' in sched
          assert 'manual-data' in sched
          assert 'schedule-placement.manual-data' in styles
          PY

      - name: Commit originals and remove temporary harness
        shell: bash
        run: |
          rm -f tools/manual_schedule_results.py .github/workflows/manual-schedule-results.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Add manual pledge result entry"
          git push origin HEAD:main
