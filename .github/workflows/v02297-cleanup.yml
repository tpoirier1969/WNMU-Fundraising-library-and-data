name: v0.22.97 schedule safety cleanup

on:
  push:
    branches:
      - cleanup-v02297

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup to source and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('assets/js/ui-scheduling.js')
          source = source_path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              "function mergeImportedRowsIntoSchedules(rows = [], { rebuild = false, activateFirst = true, dirtySchedules = [], allowDuplicateMerges = false, allowCreateMissing = true, allowRefreshPlacements = true, allowTitleUpdates = false, destructiveApproval = false } = {}) {",
              "function mergeImportedRowsIntoSchedules(rows = [], { activateFirst = true, dirtySchedules = [], allowDuplicateMerges = false, allowCreateMissing = true, allowRefreshPlacements = true, allowTitleUpdates = false, destructiveApproval = false } = {}) {",
              'merge signature'
          )
          replace_once(
              "    const safeAllowDuplicateMerges = Boolean(allowDuplicateMerges && destructiveApproval);\n    const safeRebuild = Boolean(rebuild && destructiveApproval);",
              "    const safeAllowDuplicateMerges = Boolean(allowDuplicateMerges && destructiveApproval);",
              'remove rebuild gate'
          )
          replace_once(
              "    const removedScheduleIds = [];\n    let firstScheduleId = '';",
              "    const removedScheduleIds = [];\n    const removedScheduleReplacements = {};\n    let firstScheduleId = '';",
              'replacement map declaration'
          )
          replace_once(
              "      duplicateSchedules.forEach((duplicate) => {\n        mergeImportedSchedulePlacements(schedule, duplicate, group.key);\n        removedScheduleIds.push(duplicate.id);\n      });\n      if (duplicateSchedules.length) {\n        mergedDuplicateSchedules += duplicateSchedules.length;\n        state.schedules = (state.schedules || []).filter((item) => !removedScheduleIds.includes(item.id));\n        if (removedScheduleIds.includes(state.activeScheduleId)) state.activeScheduleId = schedule.id;\n      }",
              "      duplicateSchedules.forEach((duplicate) => {\n        mergeImportedSchedulePlacements(schedule, duplicate, group.key);\n        removedScheduleIds.push(duplicate.id);\n        removedScheduleReplacements[duplicate.id] = schedule.id;\n      });\n      if (duplicateSchedules.length) {\n        // Stage duplicate schedule-row removal only. The duplicate remains in local state\n        // until its backing record is actually deleted, so a Supabase failure cannot\n        // make the browser pretend a still-existing remote fundraiser disappeared.\n        mergedDuplicateSchedules += duplicateSchedules.length;\n      }",
              'stage duplicate removal'
          )
          replace_once(
              "      const shouldRefreshPlacements = Boolean(allowRefreshPlacements || createdThisSchedule || duplicateSchedules.length || safeRebuild);",
              "      const shouldRefreshPlacements = Boolean(allowRefreshPlacements || createdThisSchedule || duplicateSchedules.length);",
              'non-destructive refresh gate'
          )
          replace_once(
              "      removedScheduleIds: [...new Set(removedScheduleIds.filter(Boolean))],\n      fundraiserCount:",
              "      removedScheduleIds: [...new Set(removedScheduleIds.filter(Boolean))],\n      removedScheduleReplacements: { ...removedScheduleReplacements },\n      fundraiserCount:",
              'return replacement map'
          )

          delete_pattern = re.compile(r"  async function deleteMergedImportedScheduleRecords\(scheduleIds = \[\], \{ explicitApproval = false \} = \{\}\) \{.*?\n  \}\n\n\n  function closeScheduleRepairOptionsPanel", re.S)
          delete_replacement = '''  async function deleteMergedImportedScheduleRecords(scheduleIds = [], { explicitApproval = false, replacementScheduleIds = {} } = {}) {
    if (!explicitApproval) {
      console.warn('Blocked imported schedule deletion because explicit manual approval was not supplied.');
      return 0;
    }
    const wanted = [...new Set((Array.isArray(scheduleIds) ? scheduleIds : []).map((id) => utils.normalizeText(id)).filter(Boolean))];
    if (!wanted.length) return 0;

    const removedIds = [];
    const remoteDelete = state.scheduleStoreMode === 'remote' && state.client;
    if (remoteDelete) {
      for (const scheduleId of wanted) {
        try {
          await App.data.deleteScheduleRemote(scheduleId);
          removedIds.push(scheduleId);
        } catch (error) {
          console.warn('Remote duplicate imported fundraiser delete failed.', scheduleId, error);
          state.scheduleStoreMode = 'local';
          state.scheduleSyncMessage = `Remote duplicate cleanup failed. The failed duplicate remains visible in this browser. ${error.message || ''}`.trim();
          break;
        }
      }
    } else {
      removedIds.push(...wanted);
    }

    if (removedIds.length) {
      const removedSet = new Set(removedIds);
      const activeId = utils.normalizeText(state.activeScheduleId || '');
      const replacementId = removedSet.has(activeId)
        ? utils.normalizeText(replacementScheduleIds?.[activeId] || '')
        : '';
      state.schedules = (state.schedules || []).filter((item) => !removedSet.has(utils.normalizeText(item?.id || '')));
      if (removedSet.has(activeId)) {
        const replacement = (state.schedules || []).find((item) => utils.normalizeText(item?.id || '') === replacementId);
        state.activeScheduleId = replacement?.id || state.schedules?.[0]?.id || '';
      }
    }
    utils.storageSet(constants.SCHEDULE_STORAGE_KEY, state.schedules);
    return removedIds.length;
  }


  function closeScheduleRepairOptionsPanel'''
          source, count = delete_pattern.subn(delete_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'delete helper replacement: expected 1, found {count}')

          confirm_pattern = re.compile(r"  function confirmImportedScheduleDestructiveRepair\(analysis = \{\}, options = \{\}\) \{.*?\n  \}\n\n  async function openScheduleRepairOptions", re.S)
          confirm_replacement = '''  function confirmImportedScheduleDestructiveRepair(analysis = {}, options = {}) {
    if (!options.merge) return true;
    const duplicateGroups = (analysis.groupSummaries || []).filter((group) => group.duplicateIds?.length);
    const preview = duplicateGroups.slice(0, 6).map((group) => {
      const range = group.startDate && group.endDate && group.startDate !== group.endDate
        ? `${group.startDate} through ${group.endDate}`
        : (group.startDate || group.endDate || 'date range unavailable');
      return `${group.title || group.scheduleTitle || 'Fundraiser'} (${range}): ${utils.formatCount(group.duplicateIds.length)} duplicate schedule row${group.duplicateIds.length === 1 ? '' : 's'} could be removed after its imported placements are merged.`;
    });
    const more = duplicateGroups.length > preview.length
      ? `And ${utils.formatCount(duplicateGroups.length - preview.length)} more duplicate fundraiser group${duplicateGroups.length - preview.length === 1 ? '' : 's'}.`
      : '';
    const lines = [
      'MANUAL SCHEDULE CHECK REQUIRED',
      '',
      'Imported fundraiser reports are the factual record of what actually aired, but they do not get permission to erase saved Scheduling work automatically.',
      '',
      `Merge is selected. ${utils.formatCount(analysis.mergeableSchedules || 0)} duplicate imported-only schedule row${Number(analysis.mergeableSchedules || 0) === 1 ? '' : 's'} may be removed only after its imported placements are copied into the retained schedule.`,
      ...preview,
      more,
      '',
      'Schedules containing manual/user-created blocks are not eligible for this automatic duplicate cleanup.',
      'Review the Scheduling calendar before authorizing this repair.',
      'Type APPLY SCHEDULE CHANGES to continue. Cancel or any other text makes no destructive schedule change.'
    ].filter(Boolean);
    const typed = window.prompt(lines.join('\\n'));
    return String(typed || '').trim().toUpperCase() === 'APPLY SCHEDULE CHANGES';
  }

  async function openScheduleRepairOptions'''
          source, count = confirm_pattern.subn(confirm_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'confirmation replacement: expected 1, found {count}')

          replace_once(
              "${repairOptionRow({ key: 'refresh', label: 'Refresh imported placements and pledge totals', detail: `Rebuild imported placements/totals from existing imported airing rows. Does not rename existing schedules unless that option is selected.`, checked: false })}\n          <h4 style=\"margin:1rem 0 .35rem;\">Optional Cleanup</h4>\n          ${repairOptionRow({ key: 'rebuild', label: 'Rebuild imported placements', detail: 'More aggressive: removes imported placements in affected schedules and rebuilds them from imported airings. Manual/non-imported placements are kept.', checked: false, danger: true })}",
              "${repairOptionRow({ key: 'refresh', label: 'Refresh imported report evidence', detail: `Adds missing imported placements and refreshes matching report evidence/totals. It never deletes existing schedule blocks or replaces a conflicting scheduled title.`, checked: false })}\n          <h4 style=\"margin:1rem 0 .35rem;\">Optional Cleanup</h4>",
              'repair panel rebuild removal'
          )
          replace_once(
              "        allowRefreshPlacements: selected.has('refresh') || selected.has('rebuild'),\n        rebuild: selected.has('rebuild'),",
              "        allowRefreshPlacements: selected.has('refresh'),",
              'repair apply args'
          )
          replace_once(
              "    const destructiveRequested = Boolean(options.allowDuplicateMerges || options.rebuild);",
              "    const destructiveRequested = Boolean(options.allowDuplicateMerges);",
              'destructive request scope'
          )
          replace_once(
              "      const approved = confirmImportedScheduleDestructiveRepair(repairAnalysis, {\n        merge: Boolean(options.allowDuplicateMerges),\n        rebuild: Boolean(options.rebuild)\n      });",
              "      const approved = confirmImportedScheduleDestructiveRepair(repairAnalysis, {\n        merge: Boolean(options.allowDuplicateMerges)\n      });",
              'approval options'
          )
          replace_once(
              "      rebuild: Boolean(options.rebuild),\n      activateFirst:",
              "      activateFirst:",
              'merge invocation rebuild removal'
          )
          replace_once(
              "      summary.removedScheduleRecords = await deleteMergedImportedScheduleRecords(summary.removedScheduleIds, { explicitApproval: destructiveRequested });\n    }\n    renderAll();",
              "      summary.removedScheduleRecords = await deleteMergedImportedScheduleRecords(summary.removedScheduleIds, {\n        explicitApproval: destructiveRequested,\n        replacementScheduleIds: summary.removedScheduleReplacements || {}\n      });\n      summary.failedScheduleRecordDeletes = Math.max(0, summary.removedScheduleIds.length - summary.removedScheduleRecords);\n    } else {\n      summary.removedScheduleRecords = 0;\n      summary.failedScheduleRecordDeletes = 0;\n    }\n    renderAll();",
              'actual delete result accounting'
          )
          replace_once(
              "    if (summary.mergedDuplicateSchedules) noteBits.push(`${utils.formatCount(summary.mergedDuplicateSchedules)} duplicate imported fundraiser calendar${summary.mergedDuplicateSchedules === 1 ? '' : 's'} were merged.`);",
              "    if (summary.removedScheduleRecords) noteBits.push(`${utils.formatCount(summary.removedScheduleRecords)} duplicate imported fundraiser calendar row${summary.removedScheduleRecords === 1 ? '' : 's'} were merged and removed.`);\n    if (summary.failedScheduleRecordDeletes) noteBits.push(`${utils.formatCount(summary.failedScheduleRecordDeletes)} duplicate calendar row${summary.failedScheduleRecordDeletes === 1 ? '' : 's'} could not be removed and remain visible for review.`);",
              'completion notice accuracy'
          )
          replace_once(
              "        setNotice(`Applied selected schedule repairs (${selectedLabels}). ${utils.formatCount(summary.mergedDuplicateSchedules || 0)} duplicates merged, ${utils.formatCount(summary.schedulesCreated || 0)} schedules created, ${utils.formatCount(summary.placementsCreated || 0)} placements added. Existing titles were ${selected.has('titles') ? 'allowed to update' : 'preserved'}.`);",
              "        const removalNote = summary.failedScheduleRecordDeletes\n          ? `${utils.formatCount(summary.removedScheduleRecords || 0)} duplicate rows removed; ${utils.formatCount(summary.failedScheduleRecordDeletes)} remain because deletion failed.`\n          : `${utils.formatCount(summary.removedScheduleRecords || 0)} duplicate rows removed.`;\n        setNotice(`Applied selected schedule repairs (${selectedLabels}). ${removalNote} ${utils.formatCount(summary.schedulesCreated || 0)} schedules created, ${utils.formatCount(summary.placementsCreated || 0)} placements added. Existing titles were ${selected.has('titles') ? 'allowed to update' : 'preserved'}.`);",
              'repair panel result notice'
          )
          replace_once(
              "    els.scheduleBuildFromImportsButton?.addEventListener('click', () => { void openScheduleRepairOptions({ rebuildDefault: false }); });\n    els.scheduleRebuildFromImportsButton?.addEventListener('click', () => { void openScheduleRepairOptions({ rebuildDefault: true }); });",
              "    els.scheduleBuildFromImportsButton?.addEventListener('click', () => { void openScheduleRepairOptions(); });\n    els.scheduleRebuildFromImportsButton?.addEventListener('click', () => { void openScheduleRepairOptions(); });",
              'remove dead rebuild defaults'
          )

          source_path.write_text(source)

          test_text = r'''import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
import vm from 'node:vm';

const sourcePath = new URL('../assets/js/ui-scheduling.js', import.meta.url);
let source = fs.readFileSync(sourcePath, 'utf8');
const imports = fs.readFileSync(new URL('../assets/js/ui-imports.js', import.meta.url), 'utf8');
const exportMarker = '  App.schedulingUi = {\n';
assert.ok(source.includes(exportMarker), 'scheduling test export marker must exist');
source = source.replace(exportMarker, `  globalThis.__scheduleImportTestHooks = { mergeImportedRowsIntoSchedules, deleteMergedImportedScheduleRecords, confirmImportedScheduleDestructiveRepair };\n\n${exportMarker}`);

const stored = new Map();
let nextId = 1;
const state = {
  schedules: [],
  rawRows: [],
  baseRows: [],
  activeScheduleId: '',
  scheduleStoreMode: 'local',
  client: null,
  scheduleView: {},
  scheduleDraft: {},
  scheduleDetailCache: {},
  imports: {}
};
const utils = {
  normalizeText: (value) => String(value ?? '').trim(),
  normalizeLookupKey: (value) => String(value ?? '').trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(),
  nolaCodeKey: (value) => String(value ?? '').trim().toLowerCase().replace(/[^a-z0-9]+/g, ''),
  firstNonEmpty: (...values) => values.find((value) => value !== undefined && value !== null && value !== '') ?? '',
  makeId: (prefix = 'id') => `${prefix}-${nextId++}`,
  formatDate: (value) => String(value || ''),
  formatCount: (value) => String(Number(value || 0)),
  formatMoney: (value) => `$${Number(value || 0).toFixed(2)}`,
  minutesToLabel: (value) => String(value),
  dateKeyFromDate: (value) => {
    if (!value) return '';
    const date = value instanceof Date ? value : new Date(value);
    return Number.isNaN(date.getTime()) ? '' : date.toISOString().slice(0, 10);
  },
  plusDays: (dateKey, days) => {
    const date = new Date(`${dateKey}T12:00:00Z`);
    date.setUTCDate(date.getUTCDate() + Number(days || 0));
    return date.toISOString().slice(0, 10);
  },
  datesBetween: (start, end) => {
    const out = [];
    for (let key = start; key && key <= end; key = utils.plusDays(key, 1)) out.push(key);
    return out;
  },
  storageSet: (key, value) => stored.set(key, JSON.parse(JSON.stringify(value))),
  storageGet: (key, fallback) => stored.has(key) ? stored.get(key) : fallback,
  isNonSpecificRow: () => false,
  isNonSpecificTitle: () => false,
  isNonSpecificNola: () => false,
  compareText: (a, b) => String(a || '').localeCompare(String(b || '')),
  escapeHtml: (value) => String(value ?? '')
};
const derive = {
  programId: (row) => String(row?.id || row?.program_id || row?.pledge_program_id || ''),
  title: (row) => String(row?.title || row?.program_title || row?.imported_program_title || ''),
  nola: (row) => String(row?.nola_code || row?.nola || ''),
  runtimeMinutes: (row) => Number(row?.runtime_minutes || row?.program_minutes || 60) || 60,
  lengthBucket: (row) => Number(row?.length_bucket || 60) || 60,
  isActive: () => true,
  topicPrimary: () => '',
  rightsBegin: () => '',
  rightsEnd: () => '',
  distributor: () => '',
  actualRuntimeLabel: () => '—',
  avgPerFundraiser: () => 0,
  totalRaised: () => 0,
  premiumSummary: () => '',
  description: () => '',
  scheduleById: (id) => state.schedules.find((row) => row.id === id) || null
};
const data = {
  deleteScheduleRemote: async () => {},
  fetchImportedAirings: async () => []
};
const context = {
  window: {
    PledgeLib: {
      state,
      constants: {
        DEFAULT_DAY_START_HOUR: 7,
        DEFAULT_DAY_END_HOUR: 25,
        DEFAULT_DAY_START_MINUTES: 420,
        DEFAULT_DAY_END_MINUTES: 1500,
        DEFAULT_SLOT_MINUTES: 30,
        MIN_VISIBLE_HOUR: 0,
        MAX_VISIBLE_HOUR: 30,
        SCHEDULE_STORAGE_KEY: 'test-schedules'
      },
      utils,
      derive,
      data,
      programFilters: {},
      dom: { els: {}, setNotice: () => {} },
      programLinks: { render: () => '' },
      auth: { canEdit: () => true },
      app: {}
    },
    prompt: () => null,
    setTimeout,
    clearTimeout
  },
  document: {
    getElementById: () => null,
    querySelector: () => null,
    querySelectorAll: () => [],
    addEventListener: () => {},
    body: { classList: { add: () => {}, remove: () => {} }, appendChild: () => {} },
    createElement: () => ({ innerHTML: '', addEventListener: () => {}, querySelector: () => null, querySelectorAll: () => [] })
  },
  console,
  Date,
  Map,
  Set,
  Promise,
  Number,
  String,
  Boolean,
  Math,
  Intl,
  URLSearchParams,
  setTimeout,
  clearTimeout
};
context.globalThis = context;
vm.runInNewContext(source, context, { filename: 'ui-scheduling.js' });
const hooks = context.__scheduleImportTestHooks;

function resetState() {
  state.schedules = [];
  state.rawRows = [];
  state.baseRows = [];
  state.activeScheduleId = '';
  state.scheduleStoreMode = 'local';
  state.client = null;
  state.scheduleSyncMessage = '';
  stored.clear();
  data.deleteScheduleRemote = async () => {};
}

function libraryRow(id, title) {
  return { id, title, runtime_minutes: 60 };
}

function importedRow({ hash = 'r1', time = '20:00', title = 'Reported Program', programId = 'p1', dollars = 100 } = {}) {
  return {
    row_hash: hash,
    air_date: '2026-08-08',
    air_time: time,
    imported_program_title: title,
    program_title: title,
    program_id: programId,
    source_file_name: 'August.csv',
    dollars,
    pledge_count: 1
  };
}

function targetSchedule(placements = []) {
  return {
    id: 'target',
    title: 'August 2026',
    startDate: '2026-08-08',
    endDate: '2026-08-08',
    goalDollars: 1000,
    placements,
    meta: {}
  };
}

function importedDuplicate(id = 'dup') {
  return {
    id,
    title: 'Imported pledge Aug 8',
    startDate: '2026-08-08',
    endDate: '2026-08-08',
    placements: [{
      id: `${id}-old`,
      importedFromReport: true,
      programId: 'p1',
      programTitle: 'Reported Program',
      dateKey: '2026-08-08',
      startMinutes: 1200,
      endMinutes: 1260,
      sourceName: 'August.csv',
      sourceAiringHash: `${id}-oldhash`
    }],
    meta: { autoCreatedFromReports: true, importedFromReports: true }
  };
}

test('ordinary Results Import remains explicitly non-mutating', () => {
  assert.match(imports, /Results Import never creates, merges, repairs, or changes fundraiser schedules\./);
  assert.match(imports, /allowDuplicateMerges:\s*false/);
  assert.match(imports, /allowRefreshPlacements:\s*false/);
});

test('typed approval accepts only the exact destructive merge phrase', () => {
  context.window.prompt = () => 'nope';
  assert.equal(hooks.confirmImportedScheduleDestructiveRepair({ mergeableSchedules: 1, groupSummaries: [] }, { merge: true }), false);
  context.window.prompt = () => 'APPLY SCHEDULE CHANGES';
  assert.equal(hooks.confirmImportedScheduleDestructiveRepair({ mergeableSchedules: 1, groupSummaries: [] }, { merge: true }), true);
  assert.equal(hooks.confirmImportedScheduleDestructiveRepair({}, { merge: false }), true);
});

test('duplicate merge flag cannot stage deletion without propagated approval', () => {
  resetState();
  state.rawRows = [libraryRow('p1', 'Reported Program')];
  state.schedules = [targetSchedule(), importedDuplicate()];
  const summary = hooks.mergeImportedRowsIntoSchedules([importedRow()], {
    activateFirst: false,
    allowDuplicateMerges: true,
    destructiveApproval: false,
    allowCreateMissing: false,
    allowRefreshPlacements: false
  });
  assert.deepEqual(Array.from(summary.removedScheduleIds), []);
  assert.deepEqual(Array.from(state.schedules, (row) => row.id), ['target', 'dup']);
});

test('approved duplicate merge stages deletion but keeps the row visible until deletion succeeds', () => {
  resetState();
  state.rawRows = [libraryRow('p1', 'Reported Program')];
  state.schedules = [targetSchedule(), importedDuplicate()];
  const summary = hooks.mergeImportedRowsIntoSchedules([importedRow()], {
    activateFirst: false,
    allowDuplicateMerges: true,
    destructiveApproval: true,
    allowCreateMissing: false,
    allowRefreshPlacements: false
  });
  assert.deepEqual(Array.from(summary.removedScheduleIds), ['dup']);
  assert.equal(summary.removedScheduleReplacements.dup, 'target');
  assert.deepEqual(Array.from(state.schedules, (row) => row.id), ['target', 'dup']);
});

test('low-level deletion refuses to remove a schedule without explicit approval', async () => {
  resetState();
  state.schedules = [targetSchedule(), importedDuplicate()];
  const removed = await hooks.deleteMergedImportedScheduleRecords(['dup']);
  assert.equal(removed, 0);
  assert.deepEqual(Array.from(state.schedules, (row) => row.id), ['target', 'dup']);
});

test('approved local duplicate deletion removes only the approved row and activates its retained replacement', async () => {
  resetState();
  state.schedules = [targetSchedule(), importedDuplicate()];
  state.activeScheduleId = 'dup';
  const removed = await hooks.deleteMergedImportedScheduleRecords(['dup'], {
    explicitApproval: true,
    replacementScheduleIds: { dup: 'target' }
  });
  assert.equal(removed, 1);
  assert.deepEqual(Array.from(state.schedules, (row) => row.id), ['target']);
  assert.equal(state.activeScheduleId, 'target');
});

test('remote delete failure reports zero and leaves the duplicate schedule visible', async () => {
  resetState();
  state.schedules = [targetSchedule(), importedDuplicate()];
  state.scheduleStoreMode = 'remote';
  state.client = {};
  data.deleteScheduleRemote = async () => { throw new Error('simulated outage'); };
  const removed = await hooks.deleteMergedImportedScheduleRecords(['dup'], {
    explicitApproval: true,
    replacementScheduleIds: { dup: 'target' }
  });
  assert.equal(removed, 0);
  assert.deepEqual(Array.from(state.schedules, (row) => row.id), ['target', 'dup']);
  assert.equal(state.scheduleStoreMode, 'local');
  assert.match(state.scheduleSyncMessage, /failed duplicate remains visible/i);
});

test('partial remote delete removes only records confirmed deleted before a failure', async () => {
  resetState();
  state.schedules = [targetSchedule(), importedDuplicate('d1'), importedDuplicate('d2')];
  state.scheduleStoreMode = 'remote';
  state.client = {};
  data.deleteScheduleRemote = async (id) => { if (id === 'd2') throw new Error('second delete failed'); };
  const removed = await hooks.deleteMergedImportedScheduleRecords(['d1', 'd2'], {
    explicitApproval: true,
    replacementScheduleIds: { d1: 'target', d2: 'target' }
  });
  assert.equal(removed, 1);
  assert.deepEqual(Array.from(state.schedules, (row) => row.id), ['target', 'd2']);
});

test('report title conflict preserves the existing scheduled program', () => {
  resetState();
  state.rawRows = [libraryRow('p1', 'Planned Program'), libraryRow('p2', 'Reported Program')];
  const planned = {
    id: 'planned',
    importedFromReport: false,
    programId: 'p1',
    programTitle: 'Planned Program',
    dateKey: '2026-08-08',
    startMinutes: 1200,
    endMinutes: 1260
  };
  state.schedules = [targetSchedule([planned])];
  const summary = hooks.mergeImportedRowsIntoSchedules([importedRow({ programId: 'p2' })], {
    activateFirst: false,
    allowDuplicateMerges: false,
    destructiveApproval: false,
    allowCreateMissing: false,
    allowRefreshPlacements: true
  });
  assert.equal(summary.scheduleConflicts, 1);
  assert.equal(state.schedules[0].placements.length, 1);
  assert.equal(state.schedules[0].placements[0].programTitle, 'Planned Program');
});

test('refresh adds non-conflicting imported evidence without deleting existing schedule blocks', () => {
  resetState();
  state.rawRows = [libraryRow('p1', 'Planned Program'), libraryRow('p2', 'Reported Program')];
  const planned = {
    id: 'planned',
    importedFromReport: false,
    programId: 'p1',
    programTitle: 'Planned Program',
    dateKey: '2026-08-08',
    startMinutes: 1200,
    endMinutes: 1260
  };
  state.schedules = [targetSchedule([planned])];
  const summary = hooks.mergeImportedRowsIntoSchedules([importedRow({ programId: 'p2', time: '21:00' })], {
    activateFirst: false,
    allowDuplicateMerges: false,
    destructiveApproval: false,
    allowCreateMissing: false,
    allowRefreshPlacements: true
  });
  assert.equal(summary.removedScheduleIds.length, 0);
  assert.equal(state.schedules[0].placements.length, 2);
  assert.equal(state.schedules[0].placements[0].programTitle, 'Planned Program');
