name: Repair v0.22.123 updater

on:
  push:
    branches:
      - release/v0.22.123-season-rate-logic

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair updater and push
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/regression-tests.yml')
          s=p.read_text()
          old="replace_count(reports, 'stroke-width=\"3\"${style.dash ? ` stroke-dasharray=\"${style.dash}\"` : \\'\\'}', 'stroke-width=\"${style.width}\"${style.dash ? ` stroke-dasharray=\"${style.dash}\"` : \\'\\'}', 2)"
          new="one(reports, 'stroke=\"${style.stroke}\" stroke-width=\"3\"${style.dash ? ` stroke-dasharray=\"${style.dash}\"` : \\'\\'}', 'stroke=\"${style.stroke}\" stroke-width=\"${style.width}\"${style.dash ? ` stroke-dasharray=\"${style.dash}\"` : \\'\\'}')\n          one(reports, 'stroke=\"${style.stroke}\" stroke-width=\"3\" stroke-linejoin=\"round\"', 'stroke=\"${style.stroke}\" stroke-width=\"${style.width}\" stroke-linejoin=\"round\"')"
          if old not in s: raise SystemExit('target updater line not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/regression-tests.yml
          git commit -m "Repair temporary v0.22.123 updater"
          git push origin HEAD:release/v0.22.123-season-rate-logic
