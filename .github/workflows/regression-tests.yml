name: Regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - release/v0.22.126-unmatched-start-time-audit

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct temporary updater version handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/tmp_v022126_update.py')
          s = p.read_text()
          old = """for path in [
              'reports.html',
              'tests/library-load-performance.test.mjs',
              'tests/one-sheet-report-refinements.test.mjs',
              'tests/one-sheet-reports.test.mjs',
              'version.json',
          ]:
              replace_all(path, '0.22.125', '0.22.126', f'version bump {path}')
          """
          new = """for path in [
              'reports.html',
              'tests/library-load-performance.test.mjs',
              'version.json',
          ]:
              replace_all(path, '0.22.125', '0.22.126', f'version bump {path}')
          for path in [
              'tests/one-sheet-report-refinements.test.mjs',
              'tests/one-sheet-reports.test.mjs',
          ]:
              replace_all(path, r'0\\.22\\.125', r'0\\.22\\.126', f'escaped version bump {path}')
          """
          if old not in s:
              raise SystemExit('temporary updater version block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply v0.22.126 source changes
        run: python .github/tmp_v022126_update.py
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit clean v0.22.126 release branch
        run: |
          git checkout origin/main -- .github/workflows/regression-tests.yml
          rm -f .github/tmp_v022126_update.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit unmatched imports and protect start-time rankings (v0.22.126)"
          git push origin HEAD:release/v0.22.126-unmatched-start-time-audit
