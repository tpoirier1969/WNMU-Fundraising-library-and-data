name: Regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - release/v0.22.121-day-tooltip-scope

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.22.121 day-tooltip correction
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              data = p.read_text()
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(data.replace(old, new, 1))

          def replace_version(path):
              p = Path(path)
              data = p.read_text()
              changed = data.replace('0.22.120', '0.22.121').replace(r'0\.22\.120', r'0\.22\.121')
              if changed == data:
                  raise SystemExit(f'{path}: no v0.22.120 version marker found')
              p.write_text(changed)

          reports = 'assets/js/one-sheet-reports.js'
          old_tooltip = """          return {
            title: analysis.schedule.title,
            detail: `${formatDate(day.date)} · ${entry.label.title} · ${money(day.dollars)} Broadcast · Regional ${weatherLine(day)}`,
            lines: programResultsForFundraiserDay(analysis, day).map((item) => item.known
              ? `${item.title} — ${money(item.dollars)}`
              : `${item.title} — result unavailable`)
          };"""
          new_tooltip = """          return {
            title: `${formatDate(day.date)} · ${entry.label.title}`,
            detail: `${analysis.schedule.title} · ${money(day.dollars)} Broadcast · Regional ${weatherLine(day)}`,
            lines: programResultsForFundraiserDay(analysis, day).map((item) => item.known
              ? `${item.title} — ${money(item.dollars)}`
              : `${item.title} — result unavailable`)
          };"""
          replace_once(reports, old_tooltip, new_tooltip)

          refinements = 'tests/one-sheet-report-refinements.test.mjs'
          anchor = "assert.match(reports, /function programResultsForFundraiserDay/);\n"
          addition = """assert.match(reports, /function programResultsForFundraiserDay/);
assert.match(reports, /A\\.text\\(row\\.dateKey\\) === dateKey/, 'comparison tooltip program rows must be filtered to the exact plotted calendar day');
assert.match(reports, /title: `\\$\\{formatDate\\(day\\.date\\)\\} · \\$\\{entry\\.label\\.title\\}`/, 'comparison tooltip heading must identify the single plotted date and fundraiser-day position');
assert.match(reports, /detail: `\\$\\{analysis\\.schedule\\.title\\} · \\$\\{money\\(day\\.dollars\\)\\} Broadcast/, 'fundraiser range belongs in tooltip context, not the single-day heading');
"""
          replace_once(refinements, anchor, addition)

          hardening = 'tests/one-sheet-analysis-hardening.test.mjs'
          hardening_anchor = "const reportSource = fs.readFileSync(new URL('../assets/js/one-sheet-reports.js', import.meta.url), 'utf8');\n"
          hardening_test = """{
  const schedule = {
    id: 'tooltip-day-scope', title: 'Aug 16, 2019–Aug 29, 2019', startDate: '2019-08-16', endDate: '2019-08-29',
    placements: [
      { dateKey: '2019-08-22', startMinutes: 1200, lengthMinutes: 60, programId: 'thu', programTitle: 'Planned Thursday Title' },
      { dateKey: '2019-08-23', startMinutes: 1200, lengthMinutes: 60, programId: 'fri', programTitle: 'Planned Friday Title' }
    ], onlineTracked: false, mailTracked: false
  };
  const airings = [
    { row_hash: 'thu-row', air_date: '2019-08-22', air_time: '20:00', program_id: 'thu', imported_program_title: 'Actual Thursday Title', dollars: 2701, pledge_count: 10 },
    { row_hash: 'fri-row', air_date: '2019-08-23', air_time: '20:00', program_id: 'fri', imported_program_title: 'Actual Friday Title', dollars: 999, pledge_count: 3 }
  ];
  const analysis = A.analyzeSchedule(schedule, airings, A.buildLibraryIndexes([
    { id: 'thu', title: 'Thursday Library Title', length_bucket_minutes: 60 },
    { id: 'fri', title: 'Friday Library Title', length_bucket_minutes: 60 }
  ]));
  const thursdayRows = analysis.placementRows.filter((row) => row.dateKey === '2019-08-22');
  assert.deepEqual(Array.from(thursdayRows, (row) => row.title), ['Actual Thursday Title'], 'the plotted Thursday must use the actual imported Thursday title');
  assert.equal(thursdayRows.some((row) => row.title === 'Actual Friday Title'), false, 'adjacent fundraiser-day titles must never leak into the Thursday popup');
  assert.equal(thursdayRows.reduce((sum, row) => sum + Number(row.dollars || 0), 0), 2701, 'the program lines for the plotted Thursday must reconcile to that day’s Broadcast point');
}

const reportSource = fs.readFileSync(new URL('../assets/js/one-sheet-reports.js', import.meta.url), 'utf8');
"""
          replace_once(hardening, hardening_anchor, hardening_test)

          for path in [
              'version.json',
              'reports.html',
              'tests/library-load-performance.test.mjs',
              'tests/one-sheet-report-refinements.test.mjs',
              'tests/one-sheet-reports.test.mjs'
          ]:
              replace_version(path)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-reports.js tests/one-sheet-analysis-hardening.test.mjs tests/one-sheet-report-refinements.test.mjs version.json reports.html tests/library-load-performance.test.mjs tests/one-sheet-reports.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Scope comparison tooltips to exact fundraiser day (v0.22.121)"
            git push origin HEAD:release/v0.22.121-day-tooltip-scope
          fi
      - name: Run regression tests
        run: node --test tests/*.test.mjs
