name: Regression tests

on:
  push:
    branches:
      - release/v0.22.124-short-fundraiser-alignment

permissions:
  contents: write

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply short-fundraiser alignment fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          analysis_path = Path('assets/js/one-sheet-analysis.js')
          source = analysis_path.read_text()
          old = """  function firstSaturdayAnchor(analysis = {}) {
            const importedDates = (analysis.importedRows || []).map(importedDateKey).filter(Boolean);
            const placementDates = (analysis.placementRows || []).map((row) => row.dateKey).filter(Boolean);
            const candidates = [...new Set(importedDates.length ? importedDates : placementDates)].sort();
            const saturday = candidates.map(parseDate).find((date) => date && date.getDay() === 6);
            if (saturday) return saturday;
            const start = parseDate(analysis.schedule?.startDate);
            if (!start) return null;
            const next = new Date(start);
            while (next.getDay() !== 6) next.setDate(next.getDate() + 1);
            return next;
          }
          """
          new = """  function firstSaturdayAnchor(analysis = {}) {
            const importedDates = (analysis.importedRows || []).map(importedDateKey).filter(Boolean);
            const placementDates = (analysis.placementRows || []).map((row) => row.dateKey).filter(Boolean);
            const candidates = [...new Set(importedDates.length ? importedDates : placementDates)].sort();
            const saturday = candidates.map(parseDate).find((date) => date && date.getDay() === 6);
            if (saturday) return saturday;
            const start = parseDate(analysis.schedule?.startDate);
            if (!start) return null;
            const end = parseDate(analysis.schedule?.endDate || analysis.schedule?.startDate);
            const next = new Date(start);
            while (next.getDay() !== 6) next.setDate(next.getDate() + 1);
            if (!end || next <= end) return next;
            const previous = new Date(start);
            while (previous.getDay() !== 6) previous.setDate(previous.getDate() - 1);
            return previous;
          }
          """
          if old not in source:
              raise SystemExit('firstSaturdayAnchor source block did not match expected v0.22.123 code')
          analysis_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/one-sheet-analysis-hardening.test.mjs')
          tests = test_path.read_text()
          marker = """{
            const april = {
          """
          regression = """{
            const sundayOnly = {
              schedule: { id: 'aug-2021', title: 'Aug 15, 2021 - Aug 15, 2021', startDate: '2021-08-15', endDate: '2021-08-15' },
              importedRows: [{ air_date: '2021-08-15' }],
              placementRows: [{
                dateKey: '2021-08-15', countsTowardScheduleMinutes: false, minutes: 60,
                known: true, durationMissing: false, dollars: 4321, pledges: 12,
                startMinutes: 1080, endMinutes: 1140
              }]
            };
            const anchor = A.firstSaturdayAnchor(sundayOnly);
            assert.equal(anchor?.getFullYear(), 2021);
            assert.equal(anchor?.getMonth(), 7);
            assert.equal(anchor?.getDate(), 14, 'a fundraiser with no Saturday in its saved range anchors to the preceding Saturday');
            assert.equal(A.fundraiserDayOffset(sundayOnly, { dateKey: '2021-08-15' }), 1, 'Sunday-only fundraiser must align as 1st Sunday, not be discarded as Day -6');
            const aligned = A.alignedDailyRows([sundayOnly]);
            assert.equal(aligned.length, 1);
            assert.equal(aligned[0].offset, 1);
            assert.equal(aligned[0].label.title, '1st Sunday');
            assert.equal(aligned[0].days[0].dollars, 4321, 'Sunday-only fundraiser daily dollars must survive alignment');
          }

          """
          if marker not in tests:
              raise SystemExit('hardening test insertion marker not found')
          test_path.write_text(tests.replace(marker, regression + marker, 1))

          version_targets = [Path('version.json'), Path('reports.html'), *Path('tests').glob('*.mjs')]
          changed_version_files = []
          for path in version_targets:
              text = path.read_text()
              if '0.22.123' in text:
                  path.write_text(text.replace('0.22.123', '0.22.124'))
                  changed_version_files.append(str(path))
          if 'version.json' not in changed_version_files:
              raise SystemExit('version.json did not contain expected 0.22.123 version')

          workflow_path = Path('.github/workflows/regression-tests.yml')
          workflow_path.write_text("""name: Regression tests

          on:
            pull_request:
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            node-tests:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out repository
                  uses: actions/checkout@v4
                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Run regression tests
                  run: node --test tests/*.test.mjs
          """)
          print('Version-updated files:', ', '.join(changed_version_files))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-analysis.js tests/one-sheet-analysis-hardening.test.mjs version.json reports.html tests .github/workflows/regression-tests.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Fix short fundraiser day alignment (v0.22.124)"
          git push
      - name: Run regression tests
        run: node --test tests/*.test.mjs
