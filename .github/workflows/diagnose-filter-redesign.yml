name: Diagnose analytics filter redesign

on:
  push:
    paths:
      - ".github/workflows/diagnose-filter-redesign.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run patch and capture diagnostics
        shell: bash
        run: |
          set +e
          python - <<'PY' > PATCH_DIAGNOSTIC.txt 2>&1
          from pathlib import Path
          p = Path('.github/scripts/apply_analytics_filter_redesign.py')
          s = p.read_text(encoding='utf-8')
          anchor = "replace_once(\n    \"      if (question.useYear !== false && state.year !== 'all' && String(record.year) !== String(state.year)) return false;\",\n    \"      if (question.useYear !== false && !yearFilterMatches(record.year)) return false;\",\n    'filtered record year matching'\n)\n"
          if "'live comparison year matching'" not in s:
              addition = anchor + "replace_once(\n    \"    if (state.year !== 'all' && String(record.year) !== String(state.year)) return false;\",\n    \"    if (!yearFilterMatches(record.year)) return false;\",\n    'live comparison year matching'\n)\nreplace_once(\n    \"    if (selectedTopics.length && !selectedTopics.includes(record.topic)) return false;\\n    if (state.season !== 'all' && record.season !== state.season) return false;\",\n    \"    if (selectedTopics.length && !selectedTopics.includes(record.topic)) return false;\\n    if (state.secondaryTopicFilter !== 'all' && (record.secondaryTopic || '') !== state.secondaryTopicFilter) return false;\\n    if (state.season !== 'all' && record.season !== state.season) return false;\",\n    'live comparison secondary topic filter'\n)\nreplace_once(\n    \"    if (state.advancedWeekpart !== 'all' && record.weekpart !== state.advancedWeekpart) return false;\\n    return true;\\n  }\\n\\n  function liveCandidateBaseKey\",\n    \"    if (state.advancedWeekpart !== 'all' && record.weekpart !== state.advancedWeekpart) return false;\\n    if (!durationFilterMatches(record)) return false;\\n    return true;\\n  }\\n\\n  function liveCandidateBaseKey\",\n    'live comparison duration filter'\n)\n"
              if anchor not in s:
                  raise SystemExit('PREPATCH: could not locate year-conversion anchor')
              p.write_text(s.replace(anchor, addition, 1), encoding='utf-8')
          print('PREPATCH OK')
          PY
          PRE=$?
          if [ "$PRE" -eq 0 ]; then
            python .github/scripts/apply_analytics_filter_redesign.py >> PATCH_DIAGNOSTIC.txt 2>&1
            PATCH=$?
          else
            PATCH=99
          fi
          echo "prepatch_status=$PRE" >> PATCH_DIAGNOSTIC.txt
          echo "patch_status=$PATCH" >> PATCH_DIAGNOSTIC.txt
          echo "head=$(git rev-parse HEAD)" >> PATCH_DIAGNOSTIC.txt
          echo "version=$(cat version.json)" >> PATCH_DIAGNOSTIC.txt
          git status --short >> PATCH_DIAGNOSTIC.txt
          exit 0

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add PATCH_DIAGNOSTIC.txt
          git commit -m "Record analytics redesign diagnostic"
          git push origin HEAD:main
