test('Performance Analytics uses fundraiser-balanced rate rows and internal duration data', () => {
  assert.match(analytics, /function fundraiserRateSummary\(/);
  assert.match(analytics, /rowsStartTimes\(\)[\s\S]*fundraiserRateSummary/);
