name: v0.22.127 analytics updater

on:
  push:
    branches:
      - release/v0.22.127-analytics-consistency

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply analytics consistency changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          version_path = root / 'version.json'
          version = json.loads(version_path.read_text())
          if version.get('appVersion') == '0.22.127':
              print('v0.22.127 already applied; nothing to do.')
              raise SystemExit(0)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, repl, label, flags=re.S):
              new, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 regex replacement, found {count}')
              return new

          # ------------------------------------------------------------------
          # Performance Analytics
          # ------------------------------------------------------------------
          p = root / 'assets/js/ui-analytics.js'
          s = p.read_text()

          s = replace_once(
              s,
              "  const START_TIME_MIN_TITLES = 3;\n",
              "  const START_TIME_MIN_TITLES = 3;\n  const DURATION_MISMATCH_TOLERANCE_MINUTES = 10;\n",
              'duration mismatch tolerance constant'
          )

          s = replace_once(
              s,
              "  function resolveLibraryByNola(indexes, nola = '', title = '') {\n",
              "  function normalizeDistributor(value = '') {\n    const upper = text(value).toUpperCase();\n    if (!upper) return '';\n    return upper === 'EPS TV' ? 'EPS' : upper;\n  }\n\n  function libraryDurationMinutes(lib = {}) {\n    const seconds = Number(lib.actual_runtime_seconds || 0);\n    if (Number.isFinite(seconds) && seconds > 0) return seconds / 60;\n    const bucket = Number(lib.length_bucket_minutes || 0);\n    return Number.isFinite(bucket) && bucket > 0 ? bucket : null;\n  }\n\n  function resolveLibraryByNola(indexes, nola = '', title = '') {\n",
              'analytics metadata helpers'
          )

          s = regex_once(
              s,
              r"  function airingRecordsForSchedule\(schedule = \{\}, airingRecords = \[\]\) \{.*?\n  \}\n\n  function buildDriveSeasonRecords",
              """  function airingRecordsForSchedule(schedule = {}, airingRecords = []) {
    const start = text(schedule.startDate || '');
    const end = text(schedule.endDate || '');
    if (!(start && end)) return [];
    const exact = airingRecords.filter((record) =>
      text(record.row?.drive_start_date || '').slice(0, 10) === start
      && text(record.row?.drive_end_date || '').slice(0, 10) === end
    );
    if (exact.length) return exact;
    return airingRecords.filter((record) => {
      const key = text(record.dateKey || '');
      return Boolean(key && key >= start && key <= end);
    });
  }

  function buildDriveSeasonRecords""",
              'performance fundraiser ownership fallback'
          )

          s = replace_once(
              s,
              "        distributor: text(lib.distributor || row.distributor || ''),\n",
              "        distributor: normalizeDistributor(lib.distributor || row.distributor || ''),\n",
              'imported record distributor normalization'
          )

          s = replace_once(
              s,
              "      const record = {\n",
              "      const internalDurationMinutes = libraryDurationMinutes(lib);\n      const importedDurationMinutes = Number(row.program_minutes || 0) > 0 ? Number(row.program_minutes) : null;\n      const durationMismatch = Boolean(internalDurationMinutes && importedDurationMinutes\n        && Math.abs(internalDurationMinutes - importedDurationMinutes) > DURATION_MISMATCH_TOLERANCE_MINUTES);\n      const record = {\n",
              'internal duration derivation'
          )

          s = replace_once(
              s,
              "        durationMinutes: Number(row.program_minutes || 0) > 0 ? Number(row.program_minutes) : null,\n",
              "        durationMinutes: internalDurationMinutes || importedDurationMinutes,\n        importedDurationMinutes,\n        durationSource: internalDurationMinutes ? 'program-library' : (importedDurationMinutes ? 'imported-report-fallback' : 'unknown'),\n        durationMismatch,\n",
              'imported duration priority'
          )

          s = replace_once(
              s,
              "        record.scheduleMatched = true;\n        applyScheduleStartCorrection(record, scheduleMatch);\n",
              "        record.scheduleMatched = true;\n        record.scheduleId = scheduleMatch.scheduleId || '';\n        applyScheduleStartCorrection(record, scheduleMatch);\n        if (!(Number(record.durationMinutes) > 0)) {\n          const scheduleDuration = durationFromTimes(scheduleMatch.start, scheduleMatch.end);\n          if (scheduleDuration) {\n            record.durationMinutes = scheduleDuration;\n            record.durationSource = 'saved-schedule';\n          }\n        }\n",
              'schedule identity and duration fallback'
          )

          s = replace_once(
              s,
              "      const actualDurationMinutes = Number(firstNonEmpty(matched?.durationMinutes, scheduledDurationMinutes, null)) || durationFromTimes(actualStartMinutes, actualEndMinutes);\n",
              "      const libraryDuration = libraryDurationMinutes(lib);\n      const importedDuration = Number(matched?.durationMinutes || 0) > 0 ? Number(matched.durationMinutes) : null;\n      const actualDurationMinutes = Number(scheduledDurationMinutes) > 0\n        ? Number(scheduledDurationMinutes)\n        : (libraryDuration || importedDuration || durationFromTimes(actualStartMinutes, actualEndMinutes));\n",
              'schedule record duration priority'
          )

          s = replace_once(
              s,
              "        distributor: text(firstNonEmpty(matched?.distributor, lib.distributor, placement.distributor, '')),\n",
              "        distributor: normalizeDistributor(firstNonEmpty(lib.distributor, placement.distributor, matched?.distributor, '')),\n",
              'schedule distributor normalization'
          )

          s = replace_once(
              s,
              "    const baseColumns = 'id,title,nola_code,topic_primary,topic_secondary,distributor,rights_start,rights_end';\n",
              "    const baseColumns = 'id,title,nola_code,topic_primary,topic_secondary,distributor,rights_start,rights_end,length_bucket_minutes,actual_runtime_seconds';\n",
              'library duration columns'
          )

          fundraiser_summary = r'''

  function fundraiserRateSummary(title, records, minimums = {}) {
    const base = summarizeGroup(title, records);
    const groups = new Map();
    const titleGroups = new Map();
    const allRateTitles = new Set();

    records.forEach((record) => {
      const fundraiserKey = text(record.scheduleId || record.scheduleTitle || record.fundraiser || record.seasonYear || '');
      if (!fundraiserKey) return;
      if (!groups.has(fundraiserKey)) groups.set(fundraiserKey, { key: fundraiserKey, dollars: 0, minutes: 0, airings: 0, complete: true, titles: new Set() });
      const group = groups.get(fundraiserKey);
      const duration = Number(durationFromRecord(record));
      const identity = programIdentityKey(record);
      group.airings += 1;
      if (identity) group.titles.add(identity);
      if (!(duration > 0)) {
        group.complete = false;
        return;
      }
      group.dollars += Number(record.dollars || 0);
      group.minutes += duration;
      if (identity) {
        allRateTitles.add(identity);
        if (!titleGroups.has(identity)) titleGroups.set(identity, { key: identity, dollars: 0, minutes: 0, complete: true });
        const titleGroup = titleGroups.get(identity);
        titleGroup.dollars += Number(record.dollars || 0);
        titleGroup.minutes += duration;
      }
    });

    const complete = [...groups.values()].filter((group) => group.complete && group.airings > 0 && group.minutes > 0);
    const fundraiserRates = complete.map((group) => ({ key: group.key, rate: (group.dollars * 60) / group.minutes }));
    const rates = fundraiserRates.map((item) => item.rate);
    const rateAirings = complete.reduce((sum, group) => sum + group.airings, 0);
    const rateDollars = complete.reduce((sum, group) => sum + group.dollars, 0);
    const rateMinutes = complete.reduce((sum, group) => sum + group.minutes, 0);
    const titleRates = [...titleGroups.values()]
      .filter((group) => group.complete && group.minutes > 0)
      .map((group) => ({ key: group.key, rate: (group.dollars * 60) / group.minutes }));

    const minAirings = Number(minimums.minAirings ?? 3);
    const minFundraisers = Number(minimums.minFundraisers ?? 2);
    const minTitles = Number(minimums.minTitles ?? 1);
    return {
      ...base,
      median: medianValue(rates),
      avg: rates.length ? rates.reduce((sum, value) => sum + value, 0) / rates.length : 0,
      pooledRate: rateMinutes > 0 ? (rateDollars * 60) / rateMinutes : 0,
      rateAirings,
      fundraiserCount: complete.length,
      titleCount: allRateTitles.size,
      rateObservations: rates.length,
      fundraiserRates,
      titleRates,
      weak: !(rateAirings >= minAirings && complete.length >= minFundraisers && allRateTitles.size >= minTitles)
    };
  }
'''
          s = replace_once(s, "\n\n  function formatTimeFromMinutes(value) {\n", fundraiser_summary + "\n  function formatTimeFromMinutes(value) {\n", 'fundraiser rate summarizer')

          s = replace_once(
              s,
              "  function formatMetricValue(row) {\n    if (state.metric === 'median') return formatMoney(row.median || 0);\n    if (state.metric === 'total') return formatMoney(row.dollars || 0);\n    if (state.metric === 'pledges') return formatNumber(row.pledges || 0);\n    if (state.metric === 'broadcasts') return formatNumber(row.broadcasts || 0);\n    return formatMoney(row.avg || 0);\n  }\n\n  function metricLabel() {\n    if (state.metric === 'median') return 'Median / airing';\n    if (state.metric === 'total') return 'Total dollars';\n    if (state.metric === 'pledges') return 'Pledges';\n    if (state.metric === 'broadcasts') return 'Broadcasts';\n    return 'Avg / airing';\n  }\n",
              "  function rateMetricQuestion() {\n    return ['startTimes', 'topics', 'secondaryTopics'].includes(state.question);\n  }\n\n  function formatMetricValue(row) {\n    if (state.metric === 'median') return `${formatMoney(row.median || 0)}${rateMetricQuestion() ? '/hr' : ''}`;\n    if (state.metric === 'total') return formatMoney(row.dollars || 0);\n    if (state.metric === 'pledges') return formatNumber(row.pledges || 0);\n    if (state.metric === 'broadcasts') return formatNumber(row.broadcasts || 0);\n    return `${formatMoney(row.avg || 0)}${rateMetricQuestion() ? '/hr' : ''}`;\n  }\n\n  function metricLabel() {\n    if (state.metric === 'median') return rateMetricQuestion() ? 'Median fundraiser $/hr' : 'Median / airing';\n    if (state.metric === 'total') return 'Total dollars';\n    if (state.metric === 'pledges') return 'Pledges';\n    if (state.metric === 'broadcasts') return 'Broadcasts';\n    return rateMetricQuestion() ? 'Avg fundraiser $/hr' : 'Avg / airing';\n  }\n",
              'context-aware rate metrics'
          )

          comparison_helpers = r'''

  function compareRatePairs(left = [], right = []) {
    const leftMap = new Map(left.map((item) => [item.key, Number(item.rate)]));
    const rightMap = new Map(right.map((item) => [item.key, Number(item.rate)]));
    const shared = [...leftMap.keys()].filter((key) => rightMap.has(key));
    const differences = shared.map((key) => rightMap.get(key) - leftMap.get(key));
    let leftWins = 0;
    let rightWins = 0;
    let ties = 0;
    shared.forEach((key) => {
      const leftValue = leftMap.get(key);
      const rightValue = rightMap.get(key);
      if (Math.abs(leftValue - rightValue) < 0.01) ties += 1;
      else if (leftValue > rightValue) leftWins += 1;
      else rightWins += 1;
    });
    return { shared: shared.length, leftWins, rightWins, ties, medianDifference: medianValue(differences) };
  }

  function signedRate(value) {
    const numeric = Number(value || 0);
    if (Math.abs(numeric) < 0.5) return '$0/hr';
    return `${numeric > 0 ? '+' : ''}${formatMoney(numeric)}/hr`;
  }

  function startTimeDecisionText(rows = []) {
    const eight = rows.find((row) => Number(row.startMinutes) === 1200);
    const nine = rows.find((row) => Number(row.startMinutes) === 1260);
    if (!(eight && nine)) return '';
    const fundraisers = compareRatePairs(eight.fundraiserRates, nine.fundraiserRates);
    const titles = compareRatePairs(eight.titleRates, nine.titleRates);
    const fundraiserText = fundraisers.shared
      ? `${fundraisers.shared} shared fundraiser(s): 8:00 won ${fundraisers.leftWins}, 9:00 won ${fundraisers.rightWins}${fundraisers.ties ? `, ${fundraisers.ties} tied` : ''}; median 9-minus-8 difference ${signedRate(fundraisers.medianDifference)}.`
      : 'No shared fundraiser comparison is available under the current filters.';
    const titleText = titles.shared
      ? `${titles.shared} shared title(s): 8:00 won ${titles.leftWins}, 9:00 won ${titles.rightWins}${titles.ties ? `, ${titles.ties} tied` : ''}; median 9-minus-8 difference ${signedRate(titles.medianDifference)}.`
      : 'No same-title 8:00/9:00 comparison is available under the current filters.';
    return `<br><br><b>8:00 vs 9:00 decision check:</b> ${fundraiserText}<br><b>Same-title check:</b> ${titleText}`;
  }
'''
          s = replace_once(s, "\n  function startTimeRead(rows = []) {\n", comparison_helpers + "\n  function startTimeRead(rows = []) {\n", 'start-time comparison helpers')

          s = regex_once(
              s,
              r"  function startTimeRead\(rows = \[\]\) \{.*?\n  \}\n\n  function rowsStartTimes",
              """  function startTimeRead(rows = []) {
    if (!rows.length) return 'No start-time records match the current filters.';
    const useful = rows.filter((row) => !row.weak);
    if (!useful.length) {
      return `Start-time performance is grouped in <b>30-minute program-start buckets</b>. No current bucket meets the historical evidence threshold of <b>${START_TIME_MIN_AIRINGS} rate-valid airings across ${START_TIME_MIN_FUNDRAISERS} fundraisers and ${START_TIME_MIN_TITLES} distinct titles</b>. Sparse buckets remain visible only when weak evidence is shown.`;
    }
    const leader = useful[0];
    return `Start-time rows now use the same fundraiser-balanced $/pledge-hour method as Historical Analytics: each fundraiser contributes one slot-level rate observation. Pooled $/hr is shown separately so a tiny fundraiser exposure cannot masquerade as the whole story. These are <b>observed</b> results, not a causal declaration that the highest row is automatically the best scheduling choice.<br><br>Current rank: <b>${escapeHtml(metricLabel())}</b>. Highest observed qualified bucket: <b>${escapeHtml(leader.title)}</b> at <b>${formatMetricValue(leader)}</b>; pooled <b>${formatMoney(leader.pooledRate || 0)}/hr</b>, with <b>${formatNumber(leader.rateAirings || 0)}</b> rate-valid airing(s) across <b>${formatNumber(leader.fundraiserCount || 0)}</b> fundraiser(s) and <b>${formatNumber(leader.titleCount || 0)}</b> title(s).${startTimeDecisionText(useful)}`;
  }

  function rowsStartTimes""",
              'start-time explanatory text'
          )

          s = regex_once(
              s,
              r"  function rowsStartTimes\(\) \{.*?\n  \}\n\n  function rowsPrograms",
              """  function rowsStartTimes() {
    return applyEvidence([...groupBy(filteredRecordsFor('startTimes'), startTimeLabel)]
      .map(([title, records]) => {
        const row = fundraiserRateSummary(title, records, {
          minAirings: START_TIME_MIN_AIRINGS,
          minFundraisers: START_TIME_MIN_FUNDRAISERS,
          minTitles: START_TIME_MIN_TITLES
        });
        const starts = records.map((record) => Number(record.startMinutes)).filter((value) => Number.isFinite(value));
        row.startMinutes = starts.length ? Math.floor(Math.min(...starts) / 30) * 30 : null;
        return row;
      })
      .filter((row) => row.title !== 'Unknown start time')
      .sort((a, b) => metricValue(b) - metricValue(a) || startTimeSortKey(a) - startTimeSortKey(b)));
  }

  function rowsPrograms""",
              'start-time fundraiser-balanced rows'
          )

          s = regex_once(
              s,
              r"  function rowsTopics\(\) \{.*?\n  \}\n\n  function rowsSecondaryTopics",
              """  function rowsTopics() {
    return applyEvidence([...groupBy(filteredRecordsFor('topics'), (record) => record.topic)]
      .map(([title, records]) => fundraiserRateSummary(title, records, { minAirings: 3, minFundraisers: 2, minTitles: 1 }))
      .sort((a, b) => metricValue(b) - metricValue(a) || b.pooledRate - a.pooledRate || b.dollars - a.dollars));
  }

  function rowsSecondaryTopics""",
              'topic fundraiser-balanced rows'
          )

          s = regex_once(
              s,
              r"  function rowsSecondaryTopics\(\) \{.*?\n  \}\n\n  function rowsTopicOverview",
              """  function rowsSecondaryTopics() {
    return applyEvidence([...groupBy(filteredRecordsFor('secondaryTopics'), (record) => record.secondaryTopic || 'Unassigned secondary topic')]
      .map(([title, records]) => fundraiserRateSummary(title, records, { minAirings: 3, minFundraisers: 2, minTitles: 1 }))
      .filter((row) => row.title && row.title !== 'Unassigned secondary topic')
      .sort((a, b) => metricValue(b) - metricValue(a) || b.pooledRate - a.pooledRate || b.dollars - a.dollars));
  }

  function rowsTopicOverview""",
              'secondary topic fundraiser-balanced rows'
          )

          s = replace_once(
              s,
              "        const matches = records.filter((record) => record.season === season);\n        const dollars = matches.reduce((sum, record) => sum + record.dollars, 0);\n        return { season, broadcasts: matches.length, dollars, avg: matches.length ? dollars / matches.length : null, lift: null, isBaseline: false };\n",
              "        const matches = records.filter((record) => record.season === season);\n        const rate = fundraiserRateSummary(`${title} ${season}`, matches, { minAirings: 1, minFundraisers: 1, minTitles: 1 });\n        return { season, broadcasts: rate.rateAirings, dollars: rate.dollars, avg: rate.rateObservations ? rate.median : null, pooledRate: rate.pooledRate, fundraiserCount: rate.fundraiserCount, lift: null, isBaseline: false };\n",
              'seasonal topic fundraiser-balanced rates'
          )

          # Question copy and table columns for the three historical-style performance views.
          s = replace_once(
              s,
              "      summary: 'Broadcast proceeds by the actual imported start time when report evidence exists, while saved Scheduling placements preserve report-day $0s.',\n",
              "      summary: 'Observed start-time performance using fundraiser-balanced $/pledge-hour, pooled productivity, and direct 8:00 vs 9:00 checks.',\n",
              'start-time summary copy'
          )
          s = replace_once(
              s,
              "      tableNote: 'Imported fundraiser history is the factual source for completed airing date, time, title, and dollars. Saved Scheduling placements retain completed report-day $0s; unreported days remain pending. Historical evidence rules match the printed Historical Analytics report: at least 5 rate-valid airings across 3 fundraisers and 3 distinct titles. Missing-duration rows cannot qualify a start slot. Use Pledge season plus Primary/Secondary topic to test scheduling arguments.',\n",
              "      tableNote: 'Uses the same fundraiser-balanced $/pledge-hour method as Historical Analytics. Saved Scheduling placements provide start time and duration; imported reports provide completed dollars/pledges. At least 5 rate-valid airings across 3 fundraisers and 3 distinct titles are required.',\n",
              'start-time table note'
          )
          s = replace_once(
              s,
              "        ['Median / airing', (row) => formatMoney(row.median || 0), 'money emphasis', (row) => row.median || 0],\n        ['Avg / airing', (row) => formatMoney(row.avg || 0), 'money', (row) => row.avg || 0],\n        ['Total $', (row) => formatMoney(row.dollars), 'money', (row) => row.dollars],\n",
              "        ['Median fundraiser $/hr', (row) => `${formatMoney(row.median || 0)}/hr`, 'money emphasis', (row) => row.median || 0],\n        ['Avg fundraiser $/hr', (row) => `${formatMoney(row.avg || 0)}/hr`, 'money', (row) => row.avg || 0],\n        ['Pooled $/hr', (row) => `${formatMoney(row.pooledRate || 0)}/hr`, 'money', (row) => row.pooledRate || 0],\n        ['Total $', (row) => formatMoney(row.dollars), 'money', (row) => row.dollars],\n",
              'start-time table rate columns'
          )

          s = replace_once(
              s,
              "      summary: 'Topic strength by median dollars per airing, with average, outliers, and four-season coverage shown.',\n      graphTitle: 'Topics by typical dollars per airing',\n      tableTitle: 'Topic ranking',\n      tableNote: 'Season mix uses M/J/A/D counts, for example [M-3, J-1, A-0, D-5].',\n      rows: rowsTopics,\n",
              "      summary: 'Topic strength using the same fundraiser-balanced $/pledge-hour method as Historical Analytics.',\n      graphTitle: 'Topics by fundraiser-balanced $/pledge-hour',\n      tableTitle: 'Topic ranking',\n      tableNote: 'Each fundraiser contributes one topic-level $/pledge-hour observation. Pooled $/hr is shown beside the median so exposure size remains visible.',\n      source: 'schedule',\n      rows: rowsTopics,\n",
              'topic question methodology'
          )
          old_topic_cols = """        ['Topic', (row) => groupTitleDetailCell(row), 'analytics-left', (row) => row.title],
        ['Median / airing', (row) => formatMoney(row.median), 'money emphasis analytics-left', (row) => row.median],
        ['Avg / airing', (row) => formatMoney(row.avg), 'money analytics-left', (row) => row.avg],
        ['Distribution / outliers', (row) => groupOutlierDetailCell(row), 'analytics-left', (row) => row.zeroDominated ? Number(row.zeroCount || 0) : (row.outlierCount || 0)],
        ['Total $', (row) => formatMoney(row.dollars), 'money analytics-left', (row) => row.dollars],
        ['Broadcasts', (row) => formatNumber(row.broadcasts), 'num analytics-left', (row) => row.broadcasts],
        ['Season mix', (row) => escapeHtml(row.mix), 'analytics-left', (row) => row.seasons || 0]
"""
          new_topic_cols = """        ['Topic', (row) => groupTitleDetailCell(row), 'analytics-left', (row) => row.title],
        ['Median fundraiser $/hr', (row) => `${formatMoney(row.median)}/hr`, 'money emphasis analytics-left', (row) => row.median],
        ['Avg fundraiser $/hr', (row) => `${formatMoney(row.avg)}/hr`, 'money analytics-left', (row) => row.avg],
        ['Pooled $/hr', (row) => `${formatMoney(row.pooledRate || 0)}/hr`, 'money analytics-left', (row) => row.pooledRate || 0],
        ['Total $', (row) => formatMoney(row.dollars), 'money analytics-left', (row) => row.dollars],
        ['Rate airings', (row) => formatNumber(row.rateAirings || 0), 'num analytics-left', (row) => row.rateAirings || 0],
        ['Fundraisers', (row) => formatNumber(row.fundraiserCount || 0), 'num analytics-left', (row) => row.fundraiserCount || 0],
        ['Season mix', (row) => escapeHtml(row.mix), 'analytics-left', (row) => row.seasons || 0]
"""
          s = replace_once(s, old_topic_cols, new_topic_cols, 'topic rate columns')

          s = replace_once(
              s,
              "      summary: 'Subtopic strength inside the selected filters. Use Primary topic = Music for Music styles.',\n      graphTitle: 'Secondary topics by typical dollars per airing',\n      tableTitle: 'Secondary topic ranking',\n      tableNote: 'Choose Primary topic = Music and leave Secondary topic = All to compare Music subtopics against each other.',\n      rows: rowsSecondaryTopics,\n",
              "      summary: 'Subtopic strength using fundraiser-balanced $/pledge-hour inside the selected Primary Topic.',\n      graphTitle: 'Secondary topics by fundraiser-balanced $/pledge-hour',\n      tableTitle: 'Secondary topic ranking',\n      tableNote: 'Choose Primary topic = Music and leave Secondary topic = All to compare Music subtopics. Each fundraiser contributes one subtopic-level rate observation.',\n      source: 'schedule',\n      rows: rowsSecondaryTopics,\n",
              'secondary topic question methodology'
          )
          s = replace_once(s, old_topic_cols.replace("['Topic'", "['Secondary topic'"), new_topic_cols.replace("['Topic'", "['Secondary topic'"), 'secondary topic rate columns')

          s = replace_once(
              s,
              "      tableNote: 'Holiday-related titles are excluded. Each topic uses its own closest-to-median season as the 0% average, then March, June, August, and December show avg/airing, total dollars, and percent above or below that topic baseline.',\n      useSeason: false,\n      rows: rowsSeasonal,\n",
              "      tableNote: 'Holiday-related titles are excluded. Each topic uses fundraiser-balanced median $/pledge-hour within each season, then compares those season medians to the topic’s own baseline season.',\n      useSeason: false,\n      source: 'schedule',\n      rows: rowsSeasonal,\n",
              'seasonal question methodology'
          )

          s = replace_once(
              s,
              "    const baseColumns = 'id,title,nola_code,topic_primary,topic_secondary,distributor,rights_start,rights_end,length_bucket_minutes,actual_runtime_seconds';\n",
              "    const baseColumns = 'id,title,nola_code,topic_primary,topic_secondary,distributor,rights_start,rights_end,length_bucket_minutes,actual_runtime_seconds';\n",
              'library columns verification'
          )

          s = replace_once(
              s,
              "    const scheduleMatchedCount = state.records.filter((record) => record.scheduleMatched).length;\n",
              "    const scheduleMatchedCount = state.records.filter((record) => record.scheduleMatched).length;\n    const durationMismatchCount = state.records.filter((record) => record.durationMismatch).length;\n",
              'duration mismatch count'
          )
          s = replace_once(
              s,
