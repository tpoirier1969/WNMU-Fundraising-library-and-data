name: v0.22.127 analytics updater

on:
  push:
    branches:
      - release/v0.22.127-analytics-consistency

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source changes
        run: |
          python3 .github/v127_stage2b.py
          python3 .github/v127_stage2b_testfix.py
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add paired and same-title start-time evidence (v0.22.127)'
          git push origin HEAD:release/v0.22.127-analytics-consistency
