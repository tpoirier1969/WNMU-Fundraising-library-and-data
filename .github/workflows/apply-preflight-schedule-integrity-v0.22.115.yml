name: Apply v0.22.115 schedule integrity repair

on:
  push:
    branches:
      - fix/preflight-schedule-integrity-v0.22.115
    paths:
      - '.github/workflows/apply-preflight-schedule-integrity-v0.22.115.yml'
      - 'tools/apply_preflight_schedule_integrity_v022115.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preflight-schedule-integrity-v0.22.115
          fetch-depth: 0
      - name: Apply source changes
        run: |
          python -m py_compile tools/apply_preflight_schedule_integrity_v022115.py
          python tools/apply_preflight_schedule_integrity_v022115.py
          python - <<'PY'
          from pathlib import Path
          for name in ['tests/library-load-performance.test.mjs', 'tests/one-sheet-report-refinements.test.mjs']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('0.22.114', '0.22.115').replace(r'0\.22\.114', r'0\.22\.115')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check assets/js/one-sheet-analysis.js
          node --check assets/js/one-sheet-reports.js
          git diff --check
          node --test tests/*.test.mjs
      - name: Commit tested changes
        run: |
          rm -f tools/apply_preflight_schedule_integrity_v022115.py
          rm -f .github/workflows/apply-preflight-schedule-integrity-v0.22.115.yml
          rmdir tools 2>/dev/null || true
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Release v0.22.115 schedule integrity preflight and repair"
          git push origin HEAD:fix/preflight-schedule-integrity-v0.22.115
