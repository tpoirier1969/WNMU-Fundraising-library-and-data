    let libraryRows = Array.isArray(App.state?.rawRows) ? App.state.rawRows : [];
    if (!libraryRows.length) libraryRows = await fetchAll(App.constants?.BASE_TABLE || 'pledge_programs_v2', 'id,title,nola_code,topic_primary,topic_secondary');
    buildLibraryIndexes(libraryRows);
    state.analysisCache.clear();
    state.weatherByDate.clear();
    state.weatherRequested.clear();
    state.weatherLoading = false;
    state.weatherError = '';
    state.ready = true;
  }
