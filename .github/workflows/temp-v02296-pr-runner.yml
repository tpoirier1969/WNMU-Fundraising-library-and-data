name: Temporary v0.22.96 PR safety validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-import-schedule-deletion-safety-v02296
          fetch-depth: 0
      - name: Apply safety patch
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/v02296_patch.py > /tmp/v02296_patch.py
          python /tmp/v02296_patch.py
      - name: Validate
        shell: bash
        run: |
          node --check assets/js/ui-scheduling.js
          node --check assets/js/ui-imports.js
          node --test tests/schedule-import-safety.test.mjs
          node --test tests/fundraiser-comparison.test.mjs
          node --test tests/performance-analytics.test.mjs
      - name: Commit feature source
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add assets/js/ui-scheduling.js tests/schedule-import-safety.test.mjs version.json
          git commit -m "Require manual approval before imported schedule deletion"
          git push origin HEAD:fix-import-schedule-deletion-safety-v02296
