name: Audit version system
on:
  push:
    branches: [audit-version-system-20260812]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-version-system-20260812
          fetch-depth: 0
      - name: Repository-wide version audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CURRENT REVISION MANIFEST ==='
          cat version.json
          echo
          echo '=== ALL RUNTIME VERSION-RELATED REFERENCES ==='
          rg -n --hidden --glob '!.git/**' --glob '*.html' --glob '*.js' --glob '*.json' --glob '*.css' \
            -e 'APP_VERSION' \
            -e '__PLEDGE_APP_VERSION__' \
            -e 'version\.json' \
            -e 'VERSION_MANIFEST' \
            -e 'version-gate' \
            -e 'versionGate' \
            -e 'RemoteVersion' \
            -e 'remoteVersion' \
            -e 'serviceWorker' \
            -e 'caches\.' \
            -e '0\.22\.[0-9]+' \
            . || true
          echo
          echo '=== ALL HTML ENTRY POINTS AND SCRIPT SOURCES ==='
          python - <<'PY'
          from pathlib import Path
          import re
          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts: continue
              text = path.read_text(errors='replace')
              print(f'--- {path} ---')
              title = re.search(r'<title>(.*?)</title>', text, re.I|re.S)
              if title: print('TITLE:', re.sub(r'\s+',' ',title.group(1)).strip())
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
                  print('SCRIPT:', src)
              for href in re.findall(r'<link[^>]+href=["\']([^"\']+)', text, re.I):
                  if '.css' in href: print('CSS:', href)
          PY
          echo
          echo '=== FILES THAT ASSIGN OR MUTATE VERSION STATE ==='
          rg -n --hidden --glob '!.git/**' --glob '*.js' --glob '*.html' \
            -e 'APP_VERSION\s*[:=]' \
            -e 'constants\.APP_VERSION\s*=' \
            -e '__PLEDGE_APP_VERSION__\s*=' \
            -e 'remoteVersionInfo' \
            . || true
          echo
          echo '=== SERVICE WORKER / CACHE FILES ==='
          find . -type f \( -iname '*service*worker*' -o -iname 'sw.js' -o -iname 'manifest*.json' \) -print
          echo
          echo '=== CURRENT-VERSION LITERALS OUTSIDE version.json ==='
          current=$(python - <<'PY'
          import json
          print(json.load(open('version.json'))['appVersion'])
          PY
          )
          rg -n --hidden --glob '!.git/**' --glob '!version.json' --glob '*.html' --glob '*.js' --glob '*.json' --glob '*.css' "$current" . || true
