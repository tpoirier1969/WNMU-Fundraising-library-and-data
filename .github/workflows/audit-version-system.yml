name: Audit version system
on:
  push:
    branches: [audit-version-system-20260812]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-version-system-20260812
          fetch-depth: 0
      - name: Exhaustive repository version audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          manifest = json.loads(Path('version.json').read_text())
          current = str(manifest.get('appVersion','')).strip()
          print('=== CURRENT REVISION ===')
          print(current)

          text_exts = {'.html','.js','.json','.css','.md','.txt','.sql','.yml','.yaml'}
          files=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() not in text_exts: continue
              try: text=p.read_text(errors='replace')
              except Exception: continue
              files.append((p,text))

          patterns = {
            'EXACT 0.22.54': re.compile(r'0\.22\.54'),
            'ALL 0.22.x LITERALS': re.compile(r'0\.22\.\d+'),
            'APP_VERSION REFERENCES': re.compile(r'APP_VERSION'),
            'INJECTED VERSION REFERENCES': re.compile(r'__PLEDGE_APP_VERSION__'),
            'VERSION MANIFEST REFERENCES': re.compile(r'version\.json|VERSION_MANIFEST', re.I),
            'VERSION GATE REFERENCES': re.compile(r'version[-_]?gate|newer app version|update required', re.I),
            'REMOTE VERSION REFERENCES': re.compile(r'remoteVersion|RemoteVersion|remote_version'),
            'SERVICE WORKER REFERENCES': re.compile(r'serviceWorker|service-worker|sw\.js', re.I),
            'CACHE REFERENCES': re.compile(r'\bcaches\.|Cache-Control|cache\s*:', re.I),
          }

          for name,pat in patterns.items():
              print(f'\n=== {name} ===')
              count=0
              for p,text in files:
                  for lineno,line in enumerate(text.splitlines(),1):
                      if pat.search(line):
                          count+=1
                          print(f'{p}:{lineno}: {line[:700]}')
              print('MATCHES:',count)

          print('\n=== HTML ENTRY POINTS + ASSETS + LINKS ===')
          for p,text in files:
              if p.suffix.lower() != '.html': continue
              m=re.search(r'<title>(.*?)</title>',text,re.I|re.S)
              title=re.sub(r'\s+',' ',m.group(1)).strip() if m else ''
              print(f'ENTRY {p} | {title}')
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I): print('  SCRIPT',src)
              for href in re.findall(r'<a[^>]+href=["\']([^"\']+)',text,re.I): print('  LINK',href)

          print('\n=== CURRENT REVISION OUTSIDE version.json ===')
          for p,text in files:
              if p.as_posix()=='version.json': continue
              for lineno,line in enumerate(text.splitlines(),1):
                  if current and current in line:
                      print(f'{p}:{lineno}: {line[:700]}')

          print('\n=== VERSION STATE ASSIGNMENTS / MUTATIONS ===')
          assigners=[
              re.compile(r'APP_VERSION\s*[:=]'),
              re.compile(r'constants\.APP_VERSION\s*='),
              re.compile(r'__PLEDGE_APP_VERSION__\s*='),
              re.compile(r'remoteVersionInfo\s*[:=]'),
          ]
          for p,text in files:
              for lineno,line in enumerate(text.splitlines(),1):
                  if any(rx.search(line) for rx in assigners):
                      print(f'{p}:{lineno}: {line[:700]}')

          print('\n=== INTERNAL REFERENCES TO ALTERNATE ENTRY POINTS ===')
          alt = re.compile(r'(pledge-performance-lab|splitscreentext|trace40|WNMU-Pledge-Program-Library-v0\.18|app-shell\.html)',re.I)
          for p,text in files:
              if p.suffix.lower() not in {'.html','.js','.md','.txt'}: continue
              for lineno,line in enumerate(text.splitlines(),1):
                  if alt.search(line): print(f'{p}:{lineno}: {line[:700]}')

          print('\n=== POSSIBLE SCRIPT-BASED NAVIGATION / REDIRECTS ===')
          nav=re.compile(r'location\.(?:href|assign|replace)|window\.open|history\.(?:pushState|replaceState)',re.I)
          for p,text in files:
              if p.suffix.lower() not in {'.html','.js'}: continue
              for lineno,line in enumerate(text.splitlines(),1):
                  if nav.search(line): print(f'{p}:{lineno}: {line[:700]}')
          PY
