name: v0.22.128 updater

on:
  push:
    branches:
      - release/v0.22.128-presentation-data-cleanup

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compact label update
        run: python3 .github/v128_compact_labels.py
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/one-sheet-reports.js tests/compact-money-labels-v128.test.mjs
          git commit -m 'Preserve precision in compact chart labels (v0.22.128)'
          git push origin HEAD:release/v0.22.128-presentation-data-cleanup
