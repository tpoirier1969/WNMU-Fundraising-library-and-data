name: Apply preflight v0.22.111

on:
  push:
    branches:
      - feature/data-health-preflight-v022111
    paths:
      - tools/apply-preflight-v022111.py
      - .github/workflows/apply-preflight-v022111.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/data-health-preflight-v022111
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align temporary patch guards with v0.22.110 print CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-preflight-v022111.py')
          s = p.read_text()
          bad1 = '''replace_once(css, "  .report-topbar,.report-toolbar,.report-modal-backdrop{display:none!important}", "  .report-topbar,.report-toolbar,.report-modal-backdrop,.chart-hover-tooltip{display:none!important}")\n'''
          if bad1 not in s:
              raise SystemExit('expected temporary chart-tooltip print guard not found')
          s = s.replace(bad1, '', 1)
          old2 = '''replace_once(css, "  .fundraiser-kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}", "  .fundraiser-kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.preflight-metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.preflight-check{break-inside:avoid;padding:5px 6px}.preflight-check details>ul{display:block!important}")\n'''
          new2 = '''replace_once(css, ".fundraiser-kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}", ".fundraiser-kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.preflight-metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.preflight-check{break-inside:avoid;padding:5px 6px}.preflight-check details>ul{display:block!important}")\n'''
          if old2 not in s:
              raise SystemExit('expected temporary preflight print guard not found')
          p.write_text(s.replace(old2, new2, 1))
          PY
      - name: Apply guarded patch
        run: python tools/apply-preflight-v022111.py
      - name: Refresh renamed hover-helper test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/one-sheet-reports.test.mjs')
          s = p.read_text()
          old = "assert.match(reportSource, /function titlesForFundraiserDay/);"
          new = "assert.match(reportSource, /function programResultsForFundraiserDay/);"
          if old not in s:
              raise SystemExit('stale titlesForFundraiserDay assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit canonical preflight release
        run: |
          rm tools/apply-preflight-v022111.py .github/workflows/apply-preflight-v022111.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.22.111 Data Health preflight"
          git push origin HEAD:feature/data-health-preflight-v022111
