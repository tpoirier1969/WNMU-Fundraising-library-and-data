name: Finalize preflight canonical links v0.22.113

on:
  push:
    branches:
      - feature/preflight-canonical-links-v022113
    paths:
      - tools/fix-v022113-test-expectations.py
      - .github/workflows/finalize-preflight-canonical-links-v022113.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/preflight-canonical-links-v022113
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical patch
        run: python tools/apply-preflight-canonical-links-v022113.py
      - name: Update regression expectations
        run: python tools/fix-v022113-test-expectations.py
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit canonical release
        run: |
          rm tools/apply-preflight-canonical-links-v022113.py tools/fix-v022113-test-expectations.py
          rm .github/workflows/apply-preflight-canonical-links-v022113.yml .github/workflows/finalize-preflight-canonical-links-v022113.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.22.113 canonical Preflight imports and program links"
          git push origin HEAD:feature/preflight-canonical-links-v022113
