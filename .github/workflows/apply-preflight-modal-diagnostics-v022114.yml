name: Apply preflight modal diagnostics v0.22.114
on:
  push:
    branches:
      - feature/preflight-modal-diagnostics-v022114
    paths:
      - tools/apply-preflight-modal-diagnostics-v022114.py
      - .github/workflows/apply-preflight-modal-diagnostics-v022114.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/preflight-modal-diagnostics-v022114
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python tools/apply-preflight-modal-diagnostics-v022114.py
      - name: Remove obsolete new-tab assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/one-sheet-report-refinements.test.mjs')
          text = path.read_text()
          lines = text.splitlines()
          filtered = [line for line in lines if not ('assert.match(reports' in line and 'openProgram=' in line and 'encodeURIComponent' in line)]
          if len(filtered) != len(lines) - 1:
              raise SystemExit('expected exactly one obsolete openProgram assertion')
          path.write_text('\n'.join(filtered) + '\n')
          PY
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit canonical release
        run: |
          rm -f tools/apply-preflight-modal-diagnostics-v022114.py .github/workflows/apply-preflight-modal-diagnostics-v022114.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.22.114 in-place Preflight editor and mismatch diagnostics"
          git push origin HEAD:feature/preflight-modal-diagnostics-v022114
