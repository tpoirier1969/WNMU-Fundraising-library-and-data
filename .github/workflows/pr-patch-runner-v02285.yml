name: Temporary v0.22.85 PR patch runner

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fundraiser-analytics-v02285'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch when present
        run: |
          if [ ! -f .github/patch-v02285.py ]; then
            echo "Patch already applied."
            exit 0
          fi
          python .github/patch-v02285.py
          node --check assets/js/ui-fundraiser-comparison.js
          node --check assets/js/ui-scheduling.js
          node --check assets/js/ui-detail.js
          git diff --check
          grep -q "CERTIFIED_SUBTOPIC_TOPICS = new Set(\['music'\])" assets/js/ui-fundraiser-comparison.js
          grep -q "Selected median" assets/js/ui-fundraiser-comparison.js
          grep -q "Optional A/B diagnostic comparison" assets/js/ui-fundraiser-comparison.js
          grep -q "fundraising scheduled" assets/js/ui-scheduling.js
          grep -q "Historical fingerprint" assets/js/ui-detail.js
          grep -q '"appVersion":"0.22.85"' version.json
          rm -f .github/patch-v02285.py .github/workflows/fundraiser-analytics-v02285.yml
          git config user.name "Tod"
          git config user.email "tpoirier@nmu.edu"
          git add -A
          git commit -m "Refine fundraiser analytics and scheduling hours"
          git push origin HEAD:${{ github.head_ref }}
