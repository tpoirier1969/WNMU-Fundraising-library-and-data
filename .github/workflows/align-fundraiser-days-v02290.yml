name: Align fundraiser comparison days

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'align-fundraiser-days-v02290'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Align corresponding fundraiser days
        shell: bash
        run: |
          if [ ! -f .align-fundraiser-day-trigger ]; then
            echo "Alignment patch already applied."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('assets/js/ui-fundraiser-comparison.js')
          s = path.read_text()

          start = s.index('  function renderDailyContext(analyses = []) {')
          end = s.index('\n  function renderCalendarDay(', start)
          replacement = r'''  function firstSaturdayAnchor(analysis = {}) {
    const startDate = parseDate(analysis?.schedule?.startDate);
    const fallback = calendarDays(analysis)[0]?.date || null;
    const start = startDate || fallback;
    if (!start) return null;
    const anchor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const daysToSaturday = (6 - anchor.getDay() + 7) % 7;
    anchor.setDate(anchor.getDate() + daysToSaturday);
    return anchor;
  }

  function localDateSerial(date) {
    if (!(date instanceof Date) || Number.isNaN(date.getTime())) return null;
    return Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000;
  }

  function fundraiserDayOffset(analysis = {}, day = {}) {
    const anchor = firstSaturdayAnchor(analysis);
    const anchorSerial = localDateSerial(anchor);
    const daySerial = localDateSerial(day?.date || parseDate(day?.dateKey));
    if (!Number.isFinite(anchorSerial) || !Number.isFinite(daySerial)) return null;
    return Math.round(daySerial - anchorSerial);
  }

  function ordinal(value) {
    const n = Math.abs(Number(value || 0));
    const mod100 = n % 100;
    if (mod100 >= 11 && mod100 <= 13) return `${n}th`;
    if (n % 10 === 1) return `${n}st`;
    if (n % 10 === 2) return `${n}nd`;
    if (n % 10 === 3) return `${n}rd`;
    return `${n}th`;
  }

  function fundraiserDayLabel(offset) {
    const value = Number(offset);
    if (value === -1) return { title: 'Friday', detail: 'Day -1 · pre-Saturday start' };
    const weekdayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const weekdayIndex = ((6 + value) % 7 + 7) % 7;
    const weekday = weekdayNames[weekdayIndex];
    if (value >= 0) {
      const occurrence = Math.floor(value / 7) + 1;
      return { title: `${ordinal(occurrence)} ${weekday}`, detail: `Day ${value}` };
    }
    return { title: weekday, detail: `Day ${value}` };
  }

  function alignedDailyContextRows(analyses = []) {
    const maps = analyses.map((analysis) => {
      const map = new Map();
      calendarDays(analysis).forEach((day) => {
        const offset = fundraiserDayOffset(analysis, day);
        if (Number.isFinite(offset)) map.set(offset, day);
      });
      return map;
    });
    const offsets = [...new Set(maps.flatMap((map) => [...map.keys()]))].sort((a, b) => a - b);
    return offsets.map((offset) => ({ offset, days: maps.map((map) => map.get(offset) || null) }));
  }

  function renderDailyContextCard(day = null, analysis = {}) {
    if (!day) return '<article class="fc-day-context-card missing"><strong>No fundraising scheduled</strong><span>No corresponding fundraiser day is present in this saved schedule.</span></article>';
    const programming = dailyProgrammingSummary(day);
    const totalMinutes = Number(analysis.scheduledMinutes || 0);
    const totalDollars = Number(analysis.attributableDollars || 0);
    const hourShare = totalMinutes > 0 ? (Number(day.minutes || 0) / totalMinutes) * 100 : 0;
    const revenueShare = totalDollars > 0 ? (Number(day.dollars || 0) / totalDollars) * 100 : 0;
    return `<article class="fc-day-context-card"><header><div><strong>${escapeHtml(analysis.schedule.title)}</strong><span>${escapeHtml(day.dateLabel)}</span></div>${weatherMarkup(day.dateKey)}</header><div class="fc-day-context-metrics"><div><b>${escapeHtml(hoursLabel(day.minutes))}</b><span>fundraising</span></div><div><b>${escapeHtml(money(day.dollars))}</b><span>Broadcast</span></div><div><b>${escapeHtml(money(dollarsPerHour(day.dollars, day.minutes)))}</b><span>$/hr</span></div></div><div class="fc-day-context-share"><b>${Math.round(hourShare)}% hrs → ${Math.round(revenueShare)}% $</b><span>share of this fundraiser's attributable Broadcast results</span></div><div class="fc-day-context-programming"><strong>${escapeHtml(programming.topics || 'No topic detail')}</strong><span>${escapeHtml(programming.dayparts || 'No daypart detail')}</span><small>${escapeHtml(programming.titles || 'No program detail')}</small></div></article>`;
  }

  function renderDailyContext(analyses = []) {
    if (!analyses.length) return '';
    const rows = alignedDailyContextRows(analyses).map((row) => {
      const label = fundraiserDayLabel(row.offset);
      const cards = row.days.map((day, index) => renderDailyContextCard(day, analyses[index])).join('');
      return `<div class="fc-day-match-row"><div class="fc-day-match-label"><strong>${escapeHtml(label.title)}</strong><span>${escapeHtml(label.detail)}</span></div><div class="fc-day-match-grid" style="grid-template-columns:repeat(${analyses.length},minmax(260px,1fr))">${cards}</div></div>`;
    }).join('');
    return `<section class="fc-panel fc-day-context"><div class="fc-panel-head"><div><h3>Weather, income and programming by corresponding fundraiser day</h3><span>Days are aligned to the first Saturday of each fundraiser: first Saturday with first Saturday, first Sunday with first Sunday, and so on. A Friday immediately before the first Saturday is Day -1.</span></div></div>${rows || '<div class="fc-chart-empty">No scheduled fundraiser days.</div>'}<div class="fc-weather-source">WNMU dayparts: Morning 7:00–11:30 AM · Afternoon 12:00–4:30 PM · Early evening 5:00–7:30 PM · Prime 8:00–10:00 PM · Overnight 10:30 PM–6:30 AM. Historical weather: Open-Meteo five-location U.P. composite.</div></section>`;
  }
'''
          s = s[:start] + replacement + s[end:]

          css_start = s.index('.fc-day-context{display:grid;gap:10px}')
          css_end = s.index('.fc-finding-grid{', css_start)
          css = '''.fc-day-context{display:grid;gap:10px}.fc-day-match-row{display:grid;grid-template-columns:115px minmax(0,1fr);gap:9px;align-items:start;border-top:1px solid #e5edef;padding-top:10px}.fc-day-match-row:first-of-type{border-top:0;padding-top:0}.fc-day-match-label{display:grid;gap:1px;position:sticky;left:0;background:#fff;padding:6px 4px;z-index:1}.fc-day-match-label strong{color:#103a66}.fc-day-match-label span{font-size:.68rem;color:#6d8291}.fc-day-match-grid{display:grid;gap:9px;overflow-x:auto;padding-bottom:2px}.fc-day-context-card{border:1px solid #dbe7eb;border-radius:12px;background:#fbfdfe;padding:9px;display:grid;gap:7px;min-width:0}.fc-day-context-card.missing{align-content:center;min-height:135px;color:#7d909d;background:#f7f9fa}.fc-day-context-card.missing strong{color:#647986}.fc-day-context-card.missing span{font-size:.7rem}.fc-day-context-card>header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.fc-day-context-card>header>div{display:grid;gap:1px;min-width:0}.fc-day-context-card>header strong{color:#103a66;overflow-wrap:anywhere}.fc-day-context-card>header span{font-size:.68rem;color:#5f7383}.fc-day-context-card .fc-weather-line{max-width:55%;text-align:right;font-size:.64rem!important}.fc-day-context-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.fc-day-context-metrics>div{background:#eef7fb;border-radius:8px;padding:6px;display:grid;gap:1px}.fc-day-context-metrics b{color:#103a66;font-size:.84rem}.fc-day-context-metrics span{font-size:.62rem;text-transform:uppercase;font-weight:900;color:#6d8291}.fc-day-context-share{display:grid;gap:1px;background:#f4f8fa;border-radius:8px;padding:6px}.fc-day-context-share b{color:#103a66;font-size:.74rem}.fc-day-context-share span{font-size:.64rem;color:#657b89}.fc-day-context-programming{display:grid;gap:2px}.fc-day-context-programming strong{color:#103a66;font-size:.74rem}.fc-day-context-programming span,.fc-day-context-programming small{font-size:.65rem;color:#657b89;line-height:1.3}'''
          s = s[:css_start] + css + s[css_end:]
          path.write_text(s)

          test_path = Path('tests/fundraiser-comparison.test.mjs')
          t = test_path.read_text()
          old_export = 'globalThis.__comparisonTestHooks = { daypartLabel, overallRevenueDecomposition, comparisonChannelPolicy, comparableTotalForPolicy, topicRevenueDecomposition, subtopicRevenueDecomposition, placementResult };'
          new_export = 'globalThis.__comparisonTestHooks = { daypartLabel, overallRevenueDecomposition, comparisonChannelPolicy, comparableTotalForPolicy, topicRevenueDecomposition, subtopicRevenueDecomposition, placementResult, alignedDailyContextRows, fundraiserDayOffset, fundraiserDayLabel };'
          if old_export not in t:
              raise SystemExit('comparison test export marker not found')
          t = t.replace(old_export, new_export, 1)
          t += r'''

test('corresponding fundraiser days align to the first Saturday and preserve Friday as day -1', () => {
  const makeAnalysis = (startDate, dates) => ({
    schedule: { startDate },
    placementRows: dates.map((dateKey) => ({ dateKey, startMinutes: 420, title: 'Test program', topic: 'Test', secondary: 'Unspecified', daypart: 'Morning', minutes: 60, known: true, dollars: 100, pledges: 1 }))
  });
  const fridayStart = makeAnalysis('2026-08-07', ['2026-08-07', '2026-08-08', '2026-08-09', '2026-08-15']);
  const saturdayStart = makeAnalysis('2025-08-09', ['2025-08-09', '2025-08-10', '2025-08-16']);
  const rows = hooks.alignedDailyContextRows([fridayStart, saturdayStart]);
  assert.deepEqual(Array.from(rows, (row) => row.offset), [-1, 0, 1, 7]);
  assert.equal(rows.find((row) => row.offset === -1).days[0].dateKey, '2026-08-07');
  assert.equal(rows.find((row) => row.offset === -1).days[1], null);
  assert.equal(rows.find((row) => row.offset === 0).days[0].dateKey, '2026-08-08');
  assert.equal(rows.find((row) => row.offset === 0).days[1].dateKey, '2025-08-09');
  assert.equal(rows.find((row) => row.offset === 1).days[0].dateKey, '2026-08-09');
  assert.equal(rows.find((row) => row.offset === 1).days[1].dateKey, '2025-08-10');
  assert.equal(rows.find((row) => row.offset === 7).days[0].dateKey, '2026-08-15');
  assert.equal(rows.find((row) => row.offset === 7).days[1].dateKey, '2025-08-16');
  assert.equal(hooks.fundraiserDayLabel(-1).detail, 'Day -1 · pre-Saturday start');
  assert.equal(hooks.fundraiserDayLabel(0).title, '1st Saturday');
  assert.equal(hooks.fundraiserDayLabel(1).title, '1st Sunday');
  assert.equal(hooks.fundraiserDayLabel(7).title, '2nd Saturday');
});
'''
          test_path.write_text(t)

          version_path = Path('version.json')
          version = json.loads(version_path.read_text())
          version['appVersion'] = '0.22.90'
          version['releasedAt'] = '2026-08-21'
          version_path.write_text(json.dumps(version, separators=(',', ':')) + '\n')
          PY
          node --check assets/js/ui-fundraiser-comparison.js
          node --test tests/fundraiser-comparison.test.mjs
          git diff --check
          git rm .github/workflows/align-fundraiser-days-v02290.yml .align-fundraiser-day-trigger
          git add assets/js/ui-fundraiser-comparison.js tests/fundraiser-comparison.test.mjs version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align corresponding fundraiser comparison days"
          git push origin HEAD:${{ github.head_ref }}
