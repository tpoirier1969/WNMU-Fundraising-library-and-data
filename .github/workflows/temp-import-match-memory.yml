name: Temporary importer match-memory update

on:
  push:
    branches: [feature/import-match-memory]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/import-match-memory
          fetch-depth: 0
      - name: Apply importer changes
        run: python .github/tmp/import_match_memory.py
      - name: Validate JavaScript and version source
        shell: bash
        run: |
          node --check assets/js/ui-imports.js
          node --check assets/js/data.js
          VERSION="$(node -p "require('./version.json').appVersion")"
          EXTRA="$(grep -R --fixed-strings "$VERSION" . --exclude=version.json --exclude=temp-import-match-memory.yml --exclude=import_match_memory.py --exclude-dir=.git || true)"
          if [ -n "$EXTRA" ]; then
            echo "New version string appeared outside version.json:"
            echo "$EXTRA"
            exit 1
          fi
          grep -q "fetchImportedMatchMemoryRows" assets/js/data.js
          grep -q "loadRememberedAliasRules" assets/js/ui-imports.js
          ! grep -q "import-persist-match-check" assets/js/ui-imports.js
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "WNMU Pledge automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/data.js assets/js/ui-imports.js version.json
          git commit -m "Apply importer match-memory fix [skip ci]"
          git push origin HEAD:feature/import-match-memory
