name: v0.22.133 inspect report targets
on:
  push:
    branches:
      - release/v0.22.133-weekday-tooltips-library-filter
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect historical ranking internals
        run: |
          echo '=== historical normalize ==='
          grep -n -B 20 -A 80 "historicalNormalizeKey" assets/js/one-sheet-analysis.js || true
          echo '=== historical ranking ==='
          grep -n -B 20 -A 180 "function historicalRanking" assets/js/one-sheet-analysis.js || true
          echo '=== exports ==='
          tail -n 100 assets/js/one-sheet-analysis.js
