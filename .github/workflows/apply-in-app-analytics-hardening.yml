name: Apply in-app analytics hardening

on:
  push:
    branches:
      - audit/in-app-analytics-hardening-2026-08-27

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/in-app-analytics-hardening-2026-08-27
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source patch
        run: python .github/tmp/apply_in_app_analytics_hardening.py
      - name: Run full regression suite
        run: node --test tests/*.test.mjs
      - name: Commit canonical source changes
        run: |
          git config user.name "WNMU Analytics Hardening"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-in-app-analytics-hardening.yml .github/tmp/apply_in_app_analytics_hardening.py
          git add assets/js/ui-analytics.js assets/js/ui-fundraiser-comparison.js tests/performance-analytics.test.mjs tests/fundraiser-comparison.test.mjs
          git commit -m "Harden in-app pledge analytics core"
          git push origin HEAD:audit/in-app-analytics-hardening-2026-08-27
