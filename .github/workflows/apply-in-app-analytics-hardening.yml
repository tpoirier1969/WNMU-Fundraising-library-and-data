name: Apply in-app analytics hardening

on:
  push:
    branches:
      - audit/in-app-analytics-hardening-2026-08-27

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/in-app-analytics-hardening-2026-08-27
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scope the guarded patch
        run: python .github/tmp/scope_start_time_patch.py
      - name: Apply guarded source patch
        run: python .github/tmp/apply_in_app_analytics_hardening.py
      - name: Guard postprocess script
        run: python .github/tmp/fix_postprocess_typo.py
      - name: Repair fixtures and separate non-specific pledge giving
        run: python .github/tmp/postprocess_analytics_and_non_specific.py
      - name: Update NSPL report expectations
        run: python .github/tmp/update_non_specific_report_tests.py
      - name: Run full regression suite
        run: node --test tests/*.test.mjs
      - name: Commit canonical source changes
        run: |
          git config user.name "WNMU Analytics Hardening"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/apply-in-app-analytics-hardening.yml .github/tmp/apply_in_app_analytics_hardening.py .github/tmp/scope_start_time_patch.py .github/tmp/postprocess_analytics_and_non_specific.py .github/tmp/fix_postprocess_typo.py .github/tmp/update_non_specific_report_tests.py
          git add assets/js/ui-analytics.js assets/js/ui-fundraiser-comparison.js assets/js/one-sheet-reports.js tests/performance-analytics.test.mjs tests/fundraiser-comparison.test.mjs tests/one-sheet-analysis-hardening.test.mjs tests/one-sheet-report-refinements.test.mjs tests/one-sheet-reports.test.mjs
          git commit -m "Harden in-app analytics and classify non-specific pledges"
          git push origin HEAD:audit/in-app-analytics-hardening-2026-08-27
