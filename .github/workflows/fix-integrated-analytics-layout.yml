# trigger after workflow registration
name: Fix integrated analytics layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-integrated-analytics-layout.yml'

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update integrated analytics layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('assets/analytics-workspace.html')
          text = path.read_text(encoding='utf-8')

          old_palette = """:host {
      --bg: #f4f0e8;
      --card: #fffaf1;
      --ink: #272019;
      --muted: #6d6255;
      --line: #d7c8ae;
      --accent: #7b341e;
      --accent-2: #2f5d62;
      --bad: #8b2d20;
      --good: #245d39;
      --soft: #fff4dd;
      font-family: Inter, system-ui, -apple-system, \"Segoe UI\", sans-serif;
    }"""
          new_palette = """:host {
      --bg: #eef5f8;
      --card: #ffffff;
      --ink: #1e3140;
      --muted: #5f7383;
      --line: #d6e4ea;
      --accent: #1d5f96;
      --accent-2: #12867f;
      --bad: #bf2f43;
      --good: #12867f;
      --soft: #f2f8fa;
      font-family: Inter, system-ui, -apple-system, \"Segoe UI\", sans-serif;
    }"""
          if old_palette not in text:
              raise SystemExit('Palette anchor not found')
          text = text.replace(old_palette, new_palette, 1)

          color_map = {
              '#fffdf8': '#ffffff',
              '#fff7e8': '#f2f8fa',
              '#f7ead8': '#eef7fb',
              '#eadcc8': '#d6e4ea',
              '#efe3d2': '#e8f1f4',
              '#584b3b': '#103a66',
              '#f0e4d3': '#dbe9ee',
              '#83a9aa': '#24b0a8',
              '#edf5f4': '#eef8f7',
              '#24494d': '#0c5f5a',
              '#f3eee5': '#eef3f5',
              '#eee1ca': '#eef7fb',
          }
          for old, new in color_map.items():
              text = text.replace(old, new)

          old_filters = """    .filter-panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
    .filter-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; min-width: 0; }
    .filter-card.required-card { border-color: #c9b47c; background: #fff8e7; }
    .filter-card.required-card.exploratory { border-color: #c98e72; background: #fff2e9; }
    .filter-card-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 4px; }
    .filter-card-head h3 { margin: 0; }
    .filter-card-note { margin: 5px 0 10px; font-size: .88rem; line-height: 1.38; }
    .filter-status { border-radius: 999px; padding: 4px 8px; background: #eef7fb; color: #103a66; font-size: .74rem; font-weight: 950; white-space: nowrap; }
    .filter-status.ready { background: #e6f2e9; color: var(--good); }
    .filter-status.exploratory { background: #f8ddd1; color: var(--bad); }
    .filter-grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    .filter-grid .field { flex: 1 1 150px; }
    .filter-grid .field.grow { flex: 2 1 250px; }
    .filter-bank { display: none; }"""
          new_filters = """    .filter-panels { display: grid; grid-template-columns: minmax(320px, .85fr) minmax(0, 1.35fr); gap: 12px; margin-bottom: 12px; align-items: stretch; }
    .filter-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; min-width: 0; overflow: visible; }
    .filter-card.required-card { border-color: #b9d3df; background: #f5fafc; }
    .filter-card.required-card.exploratory { border-color: #e8b5bd; background: #fff5f6; }
    .filter-card-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 4px; }
    .filter-card-head h3 { margin: 0; }
    .filter-card-note { margin: 5px 0 10px; font-size: .88rem; line-height: 1.38; }
    .filter-status { border-radius: 999px; padding: 4px 8px; background: #eef7fb; color: #103a66; font-size: .74rem; font-weight: 950; white-space: nowrap; }
    .filter-status.ready { background: #e8f6f4; color: var(--good); }
    .filter-status.exploratory { background: #ffe8ec; color: var(--bad); }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(142px, 1fr)); gap: 10px; align-items: end; min-width: 0; }
    .filter-grid .field { min-width: 0; width: 100%; }
    .filter-grid .field.grow { grid-column: 1 / -1; min-width: 0; }
    .filter-grid input, .filter-grid select, .filter-grid details { width: 100%; min-width: 0; max-width: 100%; }
    .filter-bank { display: none; }"""
          if old_filters not in text:
              raise SystemExit('Filter layout anchor not found')
          text = text.replace(old_filters, new_filters, 1)

          old_scope = """    .scope-note { flex: 1 1 100%; color: var(--muted); font-size: .9rem; }
    .season-mix-legend {
      margin: -8px 0 16px;"""
          new_scope = """    .scope-note { display: block; color: var(--muted); font-size: .9rem; line-height: 1.4; margin: 8px 0 10px; }
    .season-mix-legend {
      margin: 0 0 16px;"""
          if old_scope not in text:
              raise SystemExit('Scope-note anchor not found')
          text = text.replace(old_scope, new_scope, 1)

          old_layout = """    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .cards { display: grid; gap: 12px; position: sticky; top: 14px; }
    .qcard { text-align: left; border-radius: 18px; background: var(--card); border: 1px solid var(--line); padding: 16px; display: grid; gap: 7px; }"""
          new_layout = """    .question-picker { margin: 0 0 12px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
    .question-picker-head { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 10px; }
    .question-picker-head h3 { margin: 1px 0 0; color: #0c3159; }
    .question-picker-head p { margin: 0; max-width: 650px; text-align: right; }
    .layout { display: block; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; position: static; }
    .qcard { text-align: left; border-radius: 14px; background: var(--card); border: 1px solid var(--line); padding: 12px; display: grid; gap: 5px; min-width: 0; }"""
          if old_layout not in text:
              raise SystemExit('Question-card layout anchor not found')
          text = text.replace(old_layout, new_layout, 1)

          old_picker = """    .topic-picker { position: relative; min-width: 190px; }
    .topic-picker summary { list-style: none; border: 1px solid var(--line); border-radius: 11px; padding: 9px 10px; background: #ffffff; color: var(--ink); font-weight: 700; cursor: pointer; }
    .topic-picker summary::-webkit-details-marker { display: none; }"""
          new_picker = """    .topic-picker { position: relative; min-width: 0; width: 100%; }
    .topic-picker summary { list-style: none; border: 1px solid var(--line); border-radius: 11px; padding: 9px 10px; background: #ffffff; color: var(--ink); font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
    .topic-picker summary::after { content: '▾'; flex: 0 0 auto; color: var(--accent); font-size: .9rem; line-height: 1; transition: transform .15s ease; }
    .topic-picker[open] summary::after { transform: rotate(180deg); }
    .topic-picker summary::-webkit-details-marker { display: none; }"""
          if old_picker not in text:
              raise SystemExit('Picker anchor not found')
          text = text.replace(old_picker, new_picker, 1)

          text = text.replace("    @media (max-width: 900px) { .filter-panels { grid-template-columns: 1fr; } }", "    @media (max-width: 1050px) { .filter-panels { grid-template-columns: 1fr; } }")
          text = text.replace("      .layout, .split { grid-template-columns: 1fr; }\n      .cards { position: static; }", "      .split { grid-template-columns: 1fr; }\n      .question-picker-head { display: block; }\n      .question-picker-head p { text-align: left; margin-top: 5px; }\n      .cards { grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); }")

          old_lab = """  <section id=\"lab\">
<div id=\"filter-panels\" class=\"filter-panels\">"""
          new_lab = """  <section id=\"lab\">
    <section class=\"question-picker\">
      <div class=\"question-picker-head\">
        <div><div class=\"eyebrow\">Analytics questions</div><h3>Choose an analysis</h3></div>
        <p>Pick the question first. Required filters and Refine results will then adapt to that analysis.</p>
      </div>
      <aside id=\"cards\" class=\"cards\"></aside>
    </section>
<div id=\"filter-panels\" class=\"filter-panels\">"""
          if old_lab not in text:
              raise SystemExit('Lab markup anchor not found')
          text = text.replace(old_lab, new_lab, 1)

          old_detail = """    <div class=\"layout\">
      <aside id=\"cards\" class=\"cards\"></aside>
      <section class=\"detail\">"""
          new_detail = """    <div class=\"layout\">
      <section class=\"detail\">"""
          if old_detail not in text:
              raise SystemExit('Detail layout anchor not found')
          text = text.replace(old_detail, new_detail, 1)

          text = text.replace('box-shadow: 0 16px 38px rgba(56, 41, 23, .13)', 'box-shadow: 0 10px 22px rgba(22, 53, 83, .07)')
          text = text.replace('box-shadow: 0 14px 38px rgba(56, 41, 23, .22)', 'box-shadow: 0 14px 34px rgba(22, 53, 83, .16)')

          path.write_text(text, encoding='utf-8')

          version_path = Path('version.json')
          version = json.loads(version_path.read_text(encoding='utf-8'))
          version['appVersion'] = '0.22.76'
          version['releasedAt'] = '2026-08-19'
          version_path.write_text(json.dumps(version, separators=(',', ':')), encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          text = Path('assets/analytics-workspace.html').read_text(encoding='utf-8')
          checks = {
              'question cards precede filters': text.index('id="cards"') < text.index('id="filter-panels"'),
              'single cards host': text.count('id="cards"') == 1,
              'year/topic picker chevron': ".topic-picker summary::after { content: '▾'" in text,
              'no negative season legend margin': 'margin: -8px 0 16px' not in text,
              'responsive refine grid': 'repeat(auto-fit, minmax(142px, 1fr))' in text,
              'main blue palette': '--accent: #1d5f96;' in text,
              'version': '"appVersion":"0.22.76"' in Path('version.json').read_text(encoding='utf-8'),
          }
          failed = [name for name, okay in checks.items() if not okay]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          print('Analytics layout validation passed')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-integrated-analytics-layout.yml
          git add assets/analytics-workspace.html version.json
          git commit -m "Fix integrated analytics layout"
          git push origin HEAD:main
