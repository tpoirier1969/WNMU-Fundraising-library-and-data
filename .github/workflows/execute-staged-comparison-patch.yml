name: Validate comparison fine tune

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.head_ref == 'comparison-finetune-02289'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate comparison code and math
        run: |
          node --check assets/js/ui-fundraiser-comparison.js
          node --test tests/fundraiser-comparison.test.mjs
          git diff --check origin/main...HEAD
