name: Execute staged comparison patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'comparison-finetune-02289'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply staged patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/finetune-comparison-lab.yml').read_text()
          token = "          python - <<'PY'\n"
          start = source.index(token) + len(token)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          code = code.replace('"""      .fc-drive-extras', '""".fc-drive-extras')
          code = code.replace('"""      .fc-finding-grid', '""".fc-finding-grid')
          exec(compile(code, 'comparison-finetune', 'exec'), {})
          PY
          node --check assets/js/ui-fundraiser-comparison.js
          git diff --check
          git rm -f .github/workflows/finetune-comparison-lab.yml .github/workflows/run-comparison-finetune-pr.yml .comparison-finetune-trigger || true
          git add assets/js/ui-fundraiser-comparison.js version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fine tune fundraiser comparison page"
          git push origin HEAD:${{ github.head_ref }}
