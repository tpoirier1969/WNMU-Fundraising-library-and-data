name: Apply strategy source update

on:
  push:
    branches:
      - feature/fundraiser-programming-strategy-report-v0.22.172

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fundraiser-programming-strategy-report-v0.22.172
          fetch-depth: 0

      - name: Apply reviewed strategy changes
        run: python3 tools/apply_strategy_source_update.py

      - name: Syntax checks
        run: |
          node --check assets/js/programming-strategy-analysis.js
          node --check assets/js/programming-strategy-report.js
          node --check assets/js/report-hub-programming-strategy.js

      - name: Full regression suite
        run: node --test tests/*.test.mjs

      - name: Commit finalized report source
        run: |
          rm .github/workflows/apply-strategy-source-update.yml
          rm tools/apply_strategy_source_update.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/programming-strategy-analysis.js assets/js/programming-strategy-report.js assets/js/report-hub-programming-strategy.js assets/programming-strategy-report.css programming-strategy.html reports.html tests/programming-strategy-report.test.mjs version.json .github/workflows/apply-strategy-source-update.yml tools/apply_strategy_source_update.py
          git commit -m "Finalize fundraiser programming strategy report v0.22.172"
          git push origin HEAD:feature/fundraiser-programming-strategy-report-v0.22.172
