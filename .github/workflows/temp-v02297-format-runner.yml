name: Temporary v0.22.97 formatting validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-v02297
          fetch-depth: 0
      - name: Clean formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/js/ui-scheduling.js')
          text = path.read_text()
          old = "        try {\nawait App.data.deleteScheduleRemote(scheduleId);\nremovedIds.push(scheduleId);\n        } catch (error) {\nconsole.warn('Remote duplicate imported fundraiser delete failed.', scheduleId, error);\nstate.scheduleStoreMode = 'local';\nstate.scheduleSyncMessage = `Remote duplicate cleanup failed. The failed duplicate remains visible in this browser. ${error.message || ''}`.trim();\nbreak;\n        }"
          new = "        try {\n          await App.data.deleteScheduleRemote(scheduleId);\n          removedIds.push(scheduleId);\n        } catch (error) {\n          console.warn('Remote duplicate imported fundraiser delete failed.', scheduleId, error);\n          state.scheduleStoreMode = 'local';\n          state.scheduleSyncMessage = `Remote duplicate cleanup failed. The failed duplicate remains visible in this browser. ${error.message || ''}`.trim();\n          break;\n        }"
          if text.count(old) != 1:
              raise SystemExit(f'expected one formatting target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        shell: bash
        run: |
          node --check assets/js/ui-scheduling.js
          node --check assets/js/ui-analytics.js
          node --check assets/js/ui-fundraiser-comparison.js
          node --test tests/schedule-import-safety.test.mjs
          node --test tests/performance-analytics.test.mjs
          node --test tests/fundraiser-comparison.test.mjs
      - name: Commit validated formatting
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add assets/js/ui-scheduling.js
          git commit -m "Clean v0.22.97 schedule repair formatting"
          git push origin HEAD:cleanup-v02297
