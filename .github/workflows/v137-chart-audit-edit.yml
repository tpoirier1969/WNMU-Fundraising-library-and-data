name: v0.22.137 chart audit edit

on:
  push:
    branches:
      - fix/report-chart-audit-v137

permissions:
  contents: write

jobs:
  apply-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-chart-audit-v137
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply chart audit changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected source block: {label}')
              return text.replace(old, new, 1)

          path = Path('assets/js/one-sheet-reports.js')
          source = path.read_text()

          source = replace_once(source,
          "  const CHART_NODE_OVERLAP_DISTANCE = 10;\n",
          "  const CHART_NODE_OVERLAP_DISTANCE = 10;\n  const HISTORICAL_EVENT_ANNOTATIONS = [\n    { type: 'band', start: '2007-12-01', end: '2009-06-30', label: 'Great Recession' },\n    { type: 'marker', date: '2018-01-01', label: '2018 tax-law change' },\n    { type: 'marker', date: '2019-02-01', label: 'WNMU Passport · Feb 2019' },\n    { type: 'band', start: '2020-03-11', end: '2023-05-11', label: 'COVID emergency period' },\n    { type: 'marker', date: '2020-03-11', label: 'COVID begins · Mar 2020' },\n    { type: 'marker', date: '2023-05-11', label: 'COVID emergency ends · May 2023' },\n    { type: 'marker', date: '2025-07-24', label: 'CPB funding rescinded · Jul 2025' }\n  ];\n",
          'historical event constants')

          old_signature = "  function lineChartSvg({ labels = [], series = [], ariaLabel = 'Fundraiser comparison line graph', className = '', legendTop = false, yLabel = 'Broadcast dollars', axisFormatter = compactMoney, pointFormatter = money, xLabelEvery = 1, verticalGridEvery = 0, xDisplayLabels = null } = {}) {\n    if (!labels.length || !series.length) return '<div class=\"chart-empty\">No chartable results.</div>';\n    const displayLabels = Array.isArray(xDisplayLabels) && xDisplayLabels.length === labels.length ? xDisplayLabels : labels;\n    const width = 760;\n    const height = 285;\n    const margin = { left: 70, right: 20, top: 22, bottom: labels.length > 8 ? 86 : 62 };\n    const plotWidth = width - margin.left - margin.right;\n    const plotHeight = height - margin.top - margin.bottom;\n    const { max, step } = chartScale(series);\n    const x = (index) => labels.length === 1 ? margin.left + (plotWidth / 2) : margin.left + ((plotWidth * index) / (labels.length - 1));\n"
          new_signature = "  function lineChartSvg({ labels = [], series = [], ariaLabel = 'Fundraiser comparison line graph', className = '', legendTop = false, yLabel = 'Broadcast dollars', axisFormatter = compactMoney, pointFormatter = money, xLabelEvery = 1, verticalGridEvery = 0, xDisplayLabels = null, xDateValues = null, eventAnnotations = [] } = {}) {\n    if (!labels.length || !series.length) return '<div class=\"chart-empty\">No chartable results.</div>';\n    const displayLabels = Array.isArray(xDisplayLabels) && xDisplayLabels.length === labels.length ? xDisplayLabels : labels;\n    const dateValues = Array.isArray(xDateValues) && xDateValues.length === labels.length ? xDateValues : null;\n    const hasEventAnnotations = Boolean(dateValues && eventAnnotations?.length);\n    const width = 760;\n    const height = hasEventAnnotations ? 330 : 285;\n    const margin = { left: 70, right: 20, top: hasEventAnnotations ? 66 : 22, bottom: labels.length > 8 ? 86 : 62 };\n    const plotWidth = width - margin.left - margin.right;\n    const plotHeight = height - margin.top - margin.bottom;\n    const { max, step } = chartScale(series);\n    const xAt = (position) => labels.length === 1 ? margin.left + (plotWidth / 2) : margin.left + ((plotWidth * position) / (labels.length - 1));\n    const x = (index) => xAt(index);\n    const dateTimes = dateValues ? dateValues.map((value) => A.parseDate(value)?.getTime() ?? null) : null;\n    const xForDate = (value) => {\n      if (!dateTimes || labels.length < 2) return null;\n      const target = A.parseDate(value)?.getTime();\n      const valid = dateTimes.map((time, index) => ({ time, index })).filter((item) => Number.isFinite(item.time));\n      if (!Number.isFinite(target) || valid.length < 2) return null;\n      if (target <= valid[0].time) return xAt(valid[0].index);\n      if (target >= valid[valid.length - 1].time) return xAt(valid[valid.length - 1].index);\n      for (let index = 1; index < valid.length; index += 1) {\n        const previous = valid[index - 1];\n        const next = valid[index];\n        if (target > next.time) continue;\n        const span = Math.max(1, next.time - previous.time);\n        const fraction = Math.max(0, Math.min(1, (target - previous.time) / span));\n        return xAt(previous.index + ((next.index - previous.index) * fraction));\n      }\n      return null;\n    };\n"
          source = replace_once(source, old_signature, new_signature, 'line chart signature and date positioning')

          source = replace_once(source,
          "    const grid = yTicks.map((value) => {\n      const ypos = y(value);\n      return `<g><line x1=\"${margin.left}\" y1=\"${ypos.toFixed(1)}\" x2=\"${width - margin.right}\" y2=\"${ypos.toFixed(1)}\" class=\"chart-grid-line\"/><text x=\"${margin.left - 9}\" y=\"${(ypos + 4).toFixed(1)}\" text-anchor=\"end\">${escapeHtml(axisFormatter(value))}</text></g>`;\n    }).join('');\n",
          "    const grid = yTicks.map((value) => {\n      const ypos = y(value);\n      return `<g><line x1=\"${margin.left}\" y1=\"${ypos.toFixed(1)}\" x2=\"${width - margin.right}\" y2=\"${ypos.toFixed(1)}\" class=\"chart-grid-line\"/><text x=\"${margin.left - 9}\" y=\"${(ypos + 4).toFixed(1)}\" text-anchor=\"end\">${escapeHtml(axisFormatter(value))}</text></g>`;\n    }).join('');\n    const eventBands = hasEventAnnotations ? eventAnnotations.filter((item) => item.type === 'band').map((item) => {\n      const startX = xForDate(item.start);\n      const endX = xForDate(item.end);\n      if (!(Number.isFinite(startX) && Number.isFinite(endX))) return '';\n      const left = Math.min(startX, endX);\n      const bandWidth = Math.max(1, Math.abs(endX - startX));\n      return `<g class=\"chart-event-band\"><rect x=\"${left.toFixed(1)}\" y=\"${margin.top}\" width=\"${bandWidth.toFixed(1)}\" height=\"${plotHeight}\" fill=\"#dbe3e7\" fill-opacity=\"0.42\"/><text x=\"${(left + 4).toFixed(1)}\" y=\"${margin.top + 13}\" font-size=\"9\" font-weight=\"800\" fill=\"#536a76\">${escapeHtml(item.label)}</text></g>`;\n    }).join('') : '';\n    const eventMarkers = hasEventAnnotations ? eventAnnotations.filter((item) => item.type === 'marker').map((item, index) => {\n      const xpos = xForDate(item.date);\n      if (!Number.isFinite(xpos)) return '';\n      const labelY = 14 + ((index % 3) * 15);\n      const shortLabel = chartLabel(item.label, 24);\n      return `<g class=\"chart-event-marker\"><line x1=\"${xpos.toFixed(1)}\" y1=\"${margin.top}\" x2=\"${xpos.toFixed(1)}\" y2=\"${margin.top + plotHeight}\" stroke=\"#7b8790\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"${xpos.toFixed(1)}\" y=\"${labelY}\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"800\" fill=\"#4f626d\"><title>${escapeHtml(item.label)}</title>${escapeHtml(shortLabel)}</text></g>`;\n    }).join('') : '';\n    const eventLayer = `${eventBands}${eventMarkers}`;\n",
          'event annotation SVG layer')

          source = replace_once(source,
          "${grid}${verticalGrid}${plotted}${xLabels}<text x=\"18\"",
          "${grid}${verticalGrid}${eventLayer}${plotted}${xLabels}<text x=\"18\"",
          'event layer rendering')

          source = replace_once(source,
          "  function linearTrend(values = []) {\n",
          "  function historicalEventAnnotationsForDates(dateValues = []) {\n    const times = (dateValues || []).map((value) => A.parseDate(value)?.getTime()).filter(Number.isFinite);\n    if (times.length < 2) return [];\n    const min = Math.min(...times);\n    const max = Math.max(...times);\n    return HISTORICAL_EVENT_ANNOTATIONS.filter((item) => {\n      if (item.type === 'band') {\n        const start = A.parseDate(item.start)?.getTime();\n        const end = A.parseDate(item.end)?.getTime();\n        return Number.isFinite(start) && Number.isFinite(end) && end >= min && start <= max;\n      }\n      const date = A.parseDate(item.date)?.getTime();\n      return Number.isFinite(date) && date >= min && date <= max;\n    });\n  }\n\n  function linearTrend(values = []) {\n",
          'historical event range helper')

          source = replace_once(source,
          "    const series = bands.map((band) => {\n      const data = correspondingDaySeries(band.analyses);\n      const byLabel = new Map(data.labels.map((label, index) => [label, { value: data.values[index], tooltip: data.tooltips?.[index] || null }]));\n      return {\n        label: band.label,\n        values: labels.map((label) => byLabel.has(label) ? byLabel.get(label).value : null),\n        tooltips: labels.map((label) => byLabel.has(label) ? byLabel.get(label).tooltip : null)\n      };\n    });\n",
          "    const series = bands.map((band, bandIndex) => {\n      const data = correspondingDaySeries(band.analyses);\n      const byLabel = new Map(data.labels.map((label, index) => [label, { value: data.values[index], tooltip: data.tooltips?.[index] || null }]));\n      const baseStyle = CHART_STYLES[bandIndex % CHART_STYLES.length];\n      return {\n        label: band.label,\n        values: labels.map((label) => byLabel.has(label) ? byLabel.get(label).value : null),\n        tooltips: labels.map((label) => byLabel.has(label) ? byLabel.get(label).tooltip : null),\n        style: { ...baseStyle, width: 1.6 }\n      };\n    });\n",
          'thinner era lines')

          source = source.replace("style: { stroke: '#ff2020', dash: '', width: 3.25 }", "style: { stroke: '#f0c419', dash: '', width: 1.75 }", 1)
          source = source.replace("style: { stroke: '#ff2020', dash: '9 6', width: 2 }", "style: { stroke: '#ff2020', dash: '', width: 1.25 }", 1)

          source = replace_once(source,
          "      values: ordered.map((analysis) => Number(metric(analysis) || 0)),\n      tooltips: ordered.map((analysis) => analysisProgramTooltip(\n",
          "      values: ordered.map((analysis) => Number(metric(analysis) || 0)),\n      dates: ordered.map((analysis) => A.text(analysis.schedule?.startDate || analysis.schedule?.endDate || '')),\n      tooltips: ordered.map((analysis) => analysisProgramTooltip(\n",
          'trend dates')

          source = replace_once(source,
          "    return {\n      labels: years.map(String),\n      series: seasons.map((season) => ({\n",
          "    return {\n      labels: years.map(String),\n      dates: years.map((year) => `${year}-01-01`),\n      series: seasons.map((season) => ({\n",
          'season dates')

          source = replace_once(source,
          "        verticalGridEvery: 1,\n        ...rateChartOptions()\n      }), 'visual-card-wide'),\n      chartCard('Average gift over time'",
          "        verticalGridEvery: 1,\n        xDateValues: productivity.dates,\n        eventAnnotations: historicalEventAnnotationsForDates(productivity.dates),\n        ...rateChartOptions()\n      }), 'visual-card-wide'),\n      chartCard('Average gift over time'",
          'productivity event annotations')

          source = replace_once(source,
          "        xLabelEvery: 1,\n        verticalGridEvery: 1\n      }), 'visual-card-wide'),\n      chartCard('Season performance over time'",
          "        xLabelEvery: 1,\n        verticalGridEvery: 1,\n        xDateValues: gifts.dates,\n        eventAnnotations: historicalEventAnnotationsForDates(gifts.dates)\n      }), 'visual-card-wide'),\n      chartCard('Season performance over time'",
          'gift event annotations')

          source = replace_once(source,
          "        legendTop: true,\n        verticalGridEvery: 1,\n        ...rateChartOptions()\n      }), 'visual-card-wide'),\n      chartCard('Corresponding fundraiser days by era'",
          "        legendTop: true,\n        verticalGridEvery: 1,\n        xDateValues: seasonal.dates,\n        eventAnnotations: historicalEventAnnotationsForDates(seasonal.dates),\n        ...rateChartOptions()\n      }), 'visual-card-wide'),\n      chartCard('Corresponding fundraiser days by era'",
          'season event annotations')

          source = replace_once(source,
          "      chartCard('Corresponding fundraiser days by era', 'Five-year bands show how the fundraiser calendar and day-by-day productivity have changed. The bright red line combines all selected years; the dashed red least-squares line reports the long-term slope across fundraiser-day positions with R² in the legend.'",
          "      chartCard('Corresponding fundraiser days by era', 'Five-year bands show how the fundraiser calendar and day-by-day productivity have changed. The yellow line combines all selected years; the thin solid red least-squares line reports the long-term slope across fundraiser-day positions with R² in the legend.'",
          'corresponding-day description')

          source = replace_once(source,
          "      pointFormatter: (value) => suffix ? `${money(value)}${suffix}` : money(value)\n    }));\n",
          "      pointFormatter: (value) => suffix ? `${money(value)}${suffix}` : money(value),\n      xDateValues: trend.dates,\n      eventAnnotations: historicalEventAnnotationsForDates(trend.dates)\n    }));\n",
          'selected history event annotations')

          path.write_text(source)

          # Bump the report release and every regression version lock that tracks it.
          for target in [Path('reports.html'), Path('version.json'), *Path('tests').glob('*.test.mjs')]:
              text = target.read_text()
              if '0.22.136' in text:
                  target.write_text(text.replace('0.22.136', '0.22.137'))

          test_path = Path('tests/chart-program-tooltips-trend-v134.test.mjs')
          test = test_path.read_text()
          test = test.replace("assert.match(source, /stroke: '#ff2020', dash: '', width: 3\\.25/);", "assert.match(source, /stroke: '#f0c419', dash: '', width: 1\\.75/);")
          test = test.replace("assert.match(source, /stroke: '#ff2020', dash: '9 6', width: 2/);", "assert.match(source, /stroke: '#ff2020', dash: '', width: 1\\.25/);")
          marker = "assert.match(source, /least-squares line reports the long-term slope/);\n"
          additions = """assert.match(source, /HISTORICAL_EVENT_ANNOTATIONS/);\nassert.match(source, /2007-12-01/);\nassert.match(source, /2018 tax-law change/);\nassert.match(source, /WNMU Passport · Feb 2019/);\nassert.match(source, /COVID begins · Mar 2020/);\nassert.match(source, /COVID emergency ends · May 2023/);\nassert.match(source, /CPB funding rescinded · Jul 2025/);\nassert.match(source, /function historicalEventAnnotationsForDates/);\nassert.match(source, /xDateValues: productivity\\.dates/);\nassert.match(source, /xDateValues: gifts\\.dates/);\nassert.match(source, /xDateValues: seasonal\\.dates/);\nassert.match(source, /eventAnnotations: historicalEventAnnotationsForDates\\(trend\\.dates\\)/);\nassert.match(source, /style: \{ \\.\\.\\.baseStyle, width: 1\\.6 \}/);\nassert.match(source, /yellow line combines all selected years/);\nassert.match(source, /thin solid red least-squares line/);\n"""
          if additions not in test:
              test = replace_once(test, marker, marker + additions, 'v137 chart annotation assertions')
          test = test.replace("console.log('v0.22.136 chart program tooltip, filled bar, and trend tests passed');", "console.log('v0.22.137 chart hover, filled bar, event annotation, and trend tests passed');")
          test_path.write_text(test)
          PY

          node --check assets/js/one-sheet-reports.js
          node --test tests/*.test.mjs
      - name: Commit audited report changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-reports.js reports.html version.json tests
          git diff --cached --check
          git commit -m "v0.22.137 add historical event callouts and correct trend styling"
          git push origin HEAD:fix/report-chart-audit-v137
