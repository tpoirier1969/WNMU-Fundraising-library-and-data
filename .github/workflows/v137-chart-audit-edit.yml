name: v0.22.137 chart audit edit

on:
  push:
    branches:
      - fix/report-chart-audit-v137

permissions:
  contents: write

jobs:
  apply-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-chart-audit-v137
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply chart audit changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected source block: {label}')
              return text.replace(old, new, 1)

          js_path = Path('assets/js/one-sheet-reports.js')
          source = js_path.read_text()

          source = replace_once(
              source,
              "  const CHART_NODE_OVERLAP_DISTANCE = 10;\n",
              "  const CHART_NODE_OVERLAP_DISTANCE = 10;\n  const HISTORICAL_EVENT_ANNOTATIONS = [\n    { type: 'band', start: '2007-12-01', end: '2009-06-30', label: 'Great Recession · Dec 2007–Jun 2009' },\n    { type: 'marker', date: '2018-01-01', label: 'TCJA changes take effect · Jan 2018' },\n    { type: 'marker', date: '2019-02-01', label: 'WNMU Passport · Feb 2019' },\n    { type: 'band', start: '2020-03-11', end: '2023-05-11', label: 'COVID emergency period · Mar 2020–May 2023' },\n    { type: 'marker', date: '2020-03-11', label: 'COVID emergency begins · Mar 2020' },\n    { type: 'marker', date: '2023-05-11', label: 'COVID emergency ends · May 2023' },\n    { type: 'marker', date: '2025-07-24', label: 'CPB funding rescinded · Jul 2025' }\n  ];\n",
              'historical event constants'
          )

          source = replace_once(
              source,
              "    historicalEndDate: '',\n    historicalSeason: 'all'\n",
              "    historicalEndDate: '',\n    historicalSeason: 'all',\n    historicalCorrespondingView: 'groups'\n",
              'historical corresponding-day view state'
          )

          old_signature = "  function lineChartSvg({ labels = [], series = [], ariaLabel = 'Fundraiser comparison line graph', className = '', legendTop = false, yLabel = 'Broadcast dollars', axisFormatter = compactMoney, pointFormatter = money, xLabelEvery = 1, verticalGridEvery = 0, xDisplayLabels = null } = {}) {\n    if (!labels.length || !series.length) return '<div class=\"chart-empty\">No chartable results.</div>';\n    const displayLabels = Array.isArray(xDisplayLabels) && xDisplayLabels.length === labels.length ? xDisplayLabels : labels;\n    const width = 760;\n    const height = 285;\n    const margin = { left: 70, right: 20, top: 22, bottom: labels.length > 8 ? 86 : 62 };\n    const plotWidth = width - margin.left - margin.right;\n    const plotHeight = height - margin.top - margin.bottom;\n    const { max, step } = chartScale(series);\n    const x = (index) => labels.length === 1 ? margin.left + (plotWidth / 2) : margin.left + ((plotWidth * index) / (labels.length - 1));\n"
          new_signature = "  function lineChartSvg({ labels = [], series = [], ariaLabel = 'Fundraiser comparison line graph', className = '', legendTop = false, yLabel = 'Broadcast dollars', axisFormatter = compactMoney, pointFormatter = money, xLabelEvery = 1, verticalGridEvery = 0, xDisplayLabels = null, xDateValues = null, eventAnnotations = [] } = {}) {\n    if (!labels.length || !series.length) return '<div class=\"chart-empty\">No chartable results.</div>';\n    const displayLabels = Array.isArray(xDisplayLabels) && xDisplayLabels.length === labels.length ? xDisplayLabels : labels;\n    const dateValues = Array.isArray(xDateValues) && xDateValues.length === labels.length ? xDateValues : null;\n    const hasEventAnnotations = Boolean(dateValues && eventAnnotations?.length);\n    const width = 760;\n    const height = hasEventAnnotations ? 330 : 285;\n    const margin = { left: 70, right: 20, top: hasEventAnnotations ? 66 : 22, bottom: labels.length > 8 ? 86 : 62 };\n    const plotWidth = width - margin.left - margin.right;\n    const plotHeight = height - margin.top - margin.bottom;\n    const { max, step } = chartScale(series);\n    const xAt = (position) => labels.length === 1 ? margin.left + (plotWidth / 2) : margin.left + ((plotWidth * position) / (labels.length - 1));\n    const x = (index) => xAt(index);\n    const dateTimes = dateValues ? dateValues.map((value) => A.parseDate(value)?.getTime() ?? null) : null;\n    const xForDate = (value) => {\n      if (!dateTimes || labels.length < 2) return null;\n      const target = A.parseDate(value)?.getTime();\n      const valid = dateTimes.map((time, index) => ({ time, index })).filter((item) => Number.isFinite(item.time));\n      if (!Number.isFinite(target) || valid.length < 2) return null;\n      if (target <= valid[0].time) return xAt(valid[0].index);\n      if (target >= valid[valid.length - 1].time) return xAt(valid[valid.length - 1].index);\n      for (let index = 1; index < valid.length; index += 1) {\n        const previous = valid[index - 1];\n        const next = valid[index];\n        if (target > next.time) continue;\n        const span = Math.max(1, next.time - previous.time);\n        const fraction = Math.max(0, Math.min(1, (target - previous.time) / span));\n        return xAt(previous.index + ((next.index - previous.index) * fraction));\n      }\n      return null;\n    };\n"
          source = replace_once(source, old_signature, new_signature, 'line chart date-aware signature')

          source = replace_once(
              source,
              "    const grid = yTicks.map((value) => {\n      const ypos = y(value);\n      return `<g><line x1=\"${margin.left}\" y1=\"${ypos.toFixed(1)}\" x2=\"${width - margin.right}\" y2=\"${ypos.toFixed(1)}\" class=\"chart-grid-line\"/><text x=\"${margin.left - 9}\" y=\"${(ypos + 4).toFixed(1)}\" text-anchor=\"end\">${escapeHtml(axisFormatter(value))}</text></g>`;\n    }).join('');\n",
              "    const grid = yTicks.map((value) => {\n      const ypos = y(value);\n      return `<g><line x1=\"${margin.left}\" y1=\"${ypos.toFixed(1)}\" x2=\"${width - margin.right}\" y2=\"${ypos.toFixed(1)}\" class=\"chart-grid-line\"/><text x=\"${margin.left - 9}\" y=\"${(ypos + 4).toFixed(1)}\" text-anchor=\"end\">${escapeHtml(axisFormatter(value))}</text></g>`;\n    }).join('');\n    const eventBands = hasEventAnnotations ? eventAnnotations.filter((item) => item.type === 'band').map((item) => {\n      const startX = xForDate(item.start);\n      const endX = xForDate(item.end);\n      if (!(Number.isFinite(startX) && Number.isFinite(endX))) return '';\n      const left = Math.min(startX, endX);\n      const bandWidth = Math.max(1, Math.abs(endX - startX));\n      return `<g class=\"chart-event-band\"><rect x=\"${left.toFixed(1)}\" y=\"${margin.top}\" width=\"${bandWidth.toFixed(1)}\" height=\"${plotHeight}\" fill=\"#dbe3e7\" fill-opacity=\"0.42\"/><text x=\"${(left + 4).toFixed(1)}\" y=\"${margin.top + 13}\" font-size=\"9\" font-weight=\"800\" fill=\"#536a76\"><title>${escapeHtml(item.label)}</title>${escapeHtml(chartLabel(item.label, 28))}</text></g>`;\n    }).join('') : '';\n    const eventMarkers = hasEventAnnotations ? eventAnnotations.filter((item) => item.type === 'marker').map((item, index) => {\n      const xpos = xForDate(item.date);\n      if (!Number.isFinite(xpos)) return '';\n      const labelY = 14 + ((index % 3) * 15);\n      const shortLabel = chartLabel(item.label, 24);\n      return `<g class=\"chart-event-marker\"><line x1=\"${xpos.toFixed(1)}\" y1=\"${margin.top}\" x2=\"${xpos.toFixed(1)}\" y2=\"${margin.top + plotHeight}\" stroke=\"#7b8790\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"${xpos.toFixed(1)}\" y=\"${labelY}\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"800\" fill=\"#4f626d\"><title>${escapeHtml(item.label)}</title>${escapeHtml(shortLabel)}</text></g>`;\n    }).join('') : '';\n    const eventLayer = `${eventBands}${eventMarkers}`;\n",
              'historical event annotation SVG layer'
          )

          source = replace_once(
              source,
              "${grid}${verticalGrid}${plotted}${xLabels}<text x=\"18\"",
              "${grid}${verticalGrid}${eventLayer}${plotted}${xLabels}<text x=\"18\"",
              'event layer rendering'
          )

          source = replace_once(
              source,
              "  function linearTrend(values = []) {\n",
              "  function historicalEventAnnotationsForDates(dateValues = []) {\n    const times = (dateValues || []).map((value) => A.parseDate(value)?.getTime()).filter(Number.isFinite);\n    if (times.length < 2) return [];\n    const min = Math.min(...times);\n    const max = Math.max(...times);\n    return HISTORICAL_EVENT_ANNOTATIONS.filter((item) => {\n      if (item.type === 'band') {\n        const start = A.parseDate(item.start)?.getTime();\n        const end = A.parseDate(item.end)?.getTime();\n        return Number.isFinite(start) && Number.isFinite(end) && end >= min && start <= max;\n      }\n      const date = A.parseDate(item.date)?.getTime();\n      return Number.isFinite(date) && date >= min && date <= max;\n    });\n  }\n\n  function linearTrend(values = []) {\n",
              'historical event range helper'
          )

          start_marker = "  function fiveYearHistoryBands(analyses = []) {\n"
          end_marker = "  function currentCorrespondingDayComparisonData(analysis, historical = []) {\n"
          start_index = source.find(start_marker)
          end_index = source.find(end_marker)
          if start_index < 0 or end_index < 0 or end_index <= start_index:
              raise SystemExit('Missing expected corresponding-day era block')
          replacement = '''  function historyYearForAnalysis(analysis = {}) {
    return Number(analysis?.schedule?.year || 0) || A.parseDate(analysis?.schedule?.startDate)?.getFullYear() || null;
  }

  function yearHistoryBands(analyses = [], bandSize = 3) {
    const ordered = chronologicalAnalyses(analyses);
    const years = ordered.map(historyYearForAnalysis).filter(Number.isFinite);
    if (!years.length) return [];
    const size = Math.max(1, Number(bandSize) || 3);
    const minYear = Math.min(...years);
    const maxYear = Math.max(...years);
    const firstStart = Math.floor(minYear / size) * size;
    const bands = [];
    for (let bandStart = firstStart; bandStart <= maxYear; bandStart += size) {
      const bandEnd = bandStart + size - 1;
      const subset = ordered.filter((analysis) => {
        const year = historyYearForAnalysis(analysis);
        return Number.isFinite(year) && year >= bandStart && year <= bandEnd;
      });
      if (subset.length) bands.push({ start: bandStart, end: Math.min(bandEnd, maxYear), label: `${bandStart}–${Math.min(bandEnd, maxYear)}`, analyses: subset });
    }
    return bands;
  }

  function correspondingDaySeries(analyses = []) {
    const aligned = A.alignedDailyRows(analyses);
    return {
      labels: aligned.map((entry) => entry.label.title),
      values: aligned.map((entry) => {
        const values = (entry.days || []).filter(Boolean).map((day) => Number(day.dollarsPerHour)).filter(Number.isFinite);
        return values.length ? medianNumber(values) : null;
      }),
      tooltips: aligned.map((entry) => {
        const contributing = (entry.days || []).map((day, index) => day ? { day, analysis: analyses[index] } : null).filter(Boolean);
        const values = contributing.map(({ day }) => Number(day.dollarsPerHour)).filter(Number.isFinite);
        if (!values.length) return null;
        const rows = contributing.flatMap(({ day, analysis }) => (analysis?.placementRows || []).filter((row) => A.text(row.dateKey) === A.text(day.dateKey)));
        return {
          title: `Corresponding ${entry.label.title}`,
          detail: `${contributing.length} fundraiser observation${contributing.length === 1 ? '' : 's'} · median ${money(medianNumber(values))}/hr`,
          lines: programTooltipLinesForRows(rows)
        };
      })
    };
  }

  function historicalCorrespondingDayViewData(analyses = [], view = 'groups') {
    const combined = correspondingDaySeries(analyses);
    const labels = combined.labels;
    const ordered = chronologicalAnalyses(analyses);
    const groups = view === 'years'
      ? [...new Set(ordered.map(historyYearForAnalysis).filter(Number.isFinite))].sort((a, b) => a - b).map((year) => ({
          label: String(year),
          analyses: ordered.filter((analysis) => historyYearForAnalysis(analysis) === year)
        }))
      : yearHistoryBands(ordered, 3);
    const series = groups.map((group, groupIndex) => {
      const data = correspondingDaySeries(group.analyses);
      const byLabel = new Map(data.labels.map((label, index) => [label, { value: data.values[index], tooltip: data.tooltips?.[index] || null }]));
      const baseStyle = CHART_STYLES[groupIndex % CHART_STYLES.length];
      return {
        label: group.label,
        values: labels.map((label) => byLabel.has(label) ? byLabel.get(label).value : null),
        tooltips: labels.map((label) => byLabel.has(label) ? byLabel.get(label).tooltip : null),
        style: { ...baseStyle, width: view === 'years' ? 1.15 : 1.5 }
      };
    });
    series.push({
      label: 'All selected years',
      values: combined.values,
      tooltips: combined.tooltips,
      style: { stroke: '#f0c419', dash: '', width: 1.75 }
    });
    const trend = linearTrend(combined.values);
    if (trend.n >= 2) {
      const sign = trend.slope >= 0 ? '+' : '−';
      const slope = money(Math.abs(trend.slope));
      series.push({
        label: `Long-term linear trend: ${sign}${slope}/hr per fundraiser-day position · R² ${trend.r2.toFixed(2)}`,
        values: trend.values,
        style: { stroke: '#ff2020', dash: '', width: 1.1 }
      });
    }
    return { labels, series };
  }

  function historicalCorrespondingDaysCard(analyses = []) {
    const view = state.historicalCorrespondingView === 'years' ? 'years' : 'groups';
    const data = historicalCorrespondingDayViewData(analyses, view);
    const description = view === 'years'
      ? 'Each year is shown separately so annual changes in fundraiser-day productivity stay visible. The yellow line combines all selected years; the thin solid red least-squares line reports the long-term slope across fundraiser-day positions with R² in the legend.'
      : 'Three-year groups reduce single-year noise while preserving more change than the former five-year bands. The yellow line combines all selected years; the thin solid red least-squares line reports the long-term slope across fundraiser-day positions with R² in the legend.';
    const toggle = `<div class="chart-view-toggle" role="group" aria-label="Corresponding fundraiser day view"><button type="button" class="report-button ${view === 'groups' ? 'active' : ''}" data-corresponding-view="groups" aria-pressed="${view === 'groups' ? 'true' : 'false'}">3-Year Groups</button><button type="button" class="report-button ${view === 'years' ? 'active' : ''}" data-corresponding-view="years" aria-pressed="${view === 'years' ? 'true' : 'false'}">All Years</button></div>`;
    const chart = lineChartSvg({
      labels: data.labels,
      series: data.series,
      ariaLabel: `Historical corresponding fundraiser day performance by ${view === 'years' ? 'year' : 'three-year period'}`,
      className: 'historical-corresponding-days',
      legendTop: true,
      verticalGridEvery: 1,
      ...rateChartOptions()
    });
    return `<section class="visual-card visual-card-wide historical-corresponding-days-card"><div class="section-heading"><div><h3>Corresponding fundraiser days by era</h3><p>${escapeHtml(description)}</p></div></div>${toggle}${chart}</section>`;
  }

  function bindHistoricalChartControls(root = $('#report-output')) {
    if (!root) return;
    root.querySelectorAll('[data-corresponding-view]').forEach((button) => button.addEventListener('click', () => {
      const next = button.getAttribute('data-corresponding-view') === 'years' ? 'years' : 'groups';
      if (state.historicalCorrespondingView === next) return;
      state.historicalCorrespondingView = next;
      void renderHistoricalReport();
    }));
  }

'''
          source = source[:start_index] + replacement + source[end_index:]

          source = replace_once(
              source,
              "      values: ordered.map((analysis) => Number(metric(analysis) || 0)),\n      tooltips: ordered.map((analysis) => analysisProgramTooltip(\n",
              "      values: ordered.map((analysis) => Number(metric(analysis) || 0)),\n      dates: ordered.map((analysis) => A.text(analysis.schedule?.startDate || analysis.schedule?.endDate || '')),\n      tooltips: ordered.map((analysis) => analysisProgramTooltip(\n",
              'trend dates'
          )

          source = replace_once(
              source,
              "    return {\n      labels: years.map(String),\n      series: seasons.map((season) => ({\n",
              "    return {\n      labels: years.map(String),\n      dates: years.map((year) => `${year}-01-01`),\n      series: seasons.map((season) => ({\n",
              'season dates'
          )

          source = replace_once(
              source,
              "      pointFormatter: (value) => suffix ? `${money(value)}${suffix}` : money(value)\n    }));\n",
              "      pointFormatter: (value) => suffix ? `${money(value)}${suffix}` : money(value),\n      xDateValues: trend.dates,\n      eventAnnotations: historicalEventAnnotationsForDates(trend.dates)\n    }));\n",
              'selected fundraiser history event annotations'
          )

          source = source.replace("    const correspondingBands = historicalCorrespondingDayBandData(analyses);\n", "")
          source = replace_once(
              source,
              "        verticalGridEvery: 1,\n        ...rateChartOptions()\n      }), 'visual-card-wide'),\n      chartCard('Average gift over time'",
              "        verticalGridEvery: 1,\n        xDateValues: productivity.dates,\n        eventAnnotations: historicalEventAnnotationsForDates(productivity.dates),\n        ...rateChartOptions()\n      }), 'visual-card-wide'),\n      chartCard('Average gift over time'",
              'productivity event annotations'
          )
          source = replace_once(
              source,
              "        xLabelEvery: 1,\n        verticalGridEvery: 1\n      }), 'visual-card-wide'),\n      chartCard('Season performance over time'",
              "        xLabelEvery: 1,\n        verticalGridEvery: 1,\n        xDateValues: gifts.dates,\n        eventAnnotations: historicalEventAnnotationsForDates(gifts.dates)\n      }), 'visual-card-wide'),\n      chartCard('Season performance over time'",
              'gift event annotations'
          )
          source = replace_once(
              source,
              "        legendTop: true,\n        verticalGridEvery: 1,\n        ...rateChartOptions()\n      }), 'visual-card-wide'),\n      chartCard('Corresponding fundraiser days by era', 'Five-year bands show how the fundraiser calendar and day-by-day productivity have changed. The bright red line combines all selected years; the dashed red least-squares line reports the long-term slope across fundraiser-day positions with R² in the legend.', lineChartSvg({\n        labels: correspondingBands.labels,\n        series: correspondingBands.series,\n        ariaLabel: 'Historical corresponding fundraiser day performance by five-year period',\n        className: 'historical-corresponding-days',\n        legendTop: true,\n        verticalGridEvery: 1,\n        ...rateChartOptions()\n      }), 'visual-card-wide'),\n",
              "        legendTop: true,\n        verticalGridEvery: 1,\n        xDateValues: seasonal.dates,\n        eventAnnotations: historicalEventAnnotationsForDates(seasonal.dates),\n        ...rateChartOptions()\n      }), 'visual-card-wide'),\n      historicalCorrespondingDaysCard(analyses),\n",
              'season annotations and corresponding-day toggle card'
          )

          source = replace_once(
              source,
              "    bindChartTooltips($('#report-output'));\n  }\n\n  async function initHistorical()",
              "    bindChartTooltips($('#report-output'));\n    bindHistoricalChartControls($('#report-output'));\n  }\n\n  async function initHistorical()",
              'historical chart toggle binding'
          )

          js_path.write_text(source)

          css_path = Path('assets/one-sheet-reports.css')
          css = css_path.read_text()
          if '.chart-view-toggle{' not in css:
              css += '''\n.chart-view-toggle{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin:4px 0 7px}\n.chart-view-toggle .report-button{padding:4px 9px;font-size:.78rem;line-height:1.2}\n.chart-view-toggle .report-button.active{background:#17384a;color:#fff;border-color:#17384a}\n@media print{.chart-view-toggle{display:none!important}}\n'''
          css_path.write_text(css)

          for target in [Path('reports.html'), Path('version.json'), *Path('tests').glob('*.test.mjs')]:
              text = target.read_text()
              text = text.replace('0.22.136', '0.22.137')
              text = text.replace(r'0\.22\.136', r'0\.22\.137')
              text = text.replace(r"stroke: '#ff2020', dash: '', width: 3\.25", r"stroke: '#f0c419', dash: '', width: 1\.75")
              text = text.replace(r"stroke: '#ff2020', dash: '9 6', width: 2", r"stroke: '#ff2020', dash: '', width: 1\.1")
              target.write_text(text)

          test_path = Path('tests/chart-program-tooltips-trend-v134.test.mjs')
          test = test_path.read_text()
          marker = "assert.match(source, /least-squares line reports the long-term slope/);\n"
          additions = r'''assert.match(source, /HISTORICAL_EVENT_ANNOTATIONS/);
assert.match(source, /Great Recession · Dec 2007–Jun 2009/);
assert.match(source, /TCJA changes take effect · Jan 2018/);
assert.match(source, /WNMU Passport · Feb 2019/);
assert.match(source, /COVID emergency begins · Mar 2020/);
assert.match(source, /COVID emergency ends · May 2023/);
assert.match(source, /CPB funding rescinded · Jul 2025/);
assert.match(source, /function historicalEventAnnotationsForDates/);
assert.match(source, /xDateValues: productivity\.dates/);
assert.match(source, /xDateValues: gifts\.dates/);
assert.match(source, /xDateValues: seasonal\.dates/);
assert.match(source, /eventAnnotations: historicalEventAnnotationsForDates\(trend\.dates\)/);
assert.match(source, /historicalCorrespondingView: 'groups'/);
assert.match(source, /function yearHistoryBands\(analyses = \[\], bandSize = 3\)/);
assert.match(source, /yearHistoryBands\(ordered, 3\)/);
assert.match(source, /data-corresponding-view=\"groups\"/);
assert.match(source, /data-corresponding-view=\"years\"/);
assert.match(source, />3-Year Groups<\/button>/);
assert.match(source, />All Years<\/button>/);
assert.match(source, /view === 'years' \? 1\.15 : 1\.5/);
assert.match(source, /style: \{ stroke: '#f0c419', dash: '', width: 1\.75 \}/);
assert.match(source, /style: \{ stroke: '#ff2020', dash: '', width: 1\.1 \}/);
assert.match(source, /bindHistoricalChartControls\(\$\('#report-output'\)\)/);
'''
          if additions not in test:
              test = replace_once(test, marker, marker + additions, 'v137 event and era-toggle assertions')
          test = test.replace("console.log('v0.22.136 chart program tooltip, filled bar, and trend tests passed');", "console.log('v0.22.137 chart hover, event annotation, era toggle, and trend tests passed');")
          test = test.replace("console.log('v0.22.137 chart program tooltip, filled bar, and trend tests passed');", "console.log('v0.22.137 chart hover, event annotation, era toggle, and trend tests passed');")
          test_path.write_text(test)

          version_path = Path('version.json')
          version = version_path.read_text().replace('"appVersion":"0.22.136"', '"appVersion":"0.22.137"')
          version_path.write_text(version)
          PY

          node --check assets/js/one-sheet-reports.js
          node --test tests/*.test.mjs
      - name: Commit audited report changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-reports.js assets/one-sheet-reports.css reports.html version.json tests
          git diff --cached --check
          git commit -m "v0.22.137 add historical event callouts and three-year chart toggle"
          git push origin HEAD:fix/report-chart-audit-v137
