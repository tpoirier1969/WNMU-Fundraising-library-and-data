name: v0.22.137 chart audit edit

on:
  push:
    branches:
      - fix/report-chart-audit-v137

permissions:
  contents: write

jobs:
  apply-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-chart-audit-v137
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply chart audit changes
        run: |
          python .github/scripts/apply_v137_chart_audit.py
          python - <<'PY'
          from pathlib import Path

          chart = Path('tests/chart-program-tooltips-trend-v134.test.mjs')
          lines = chart.read_text().splitlines()
          lines = [
              "assert.match(source, /async function renderHistoricalReport\\([\\s\\S]*?bindChartTooltips\\(\\$\\('#report-output'\\)\\);[\\s\\S]*?bindHistoricalChartControls\\(\\$\\('#report-output'\\)\\);\\n  \\}/);"
              if line.startswith('assert.match(source, /async function renderHistoricalReport')
              else line
              for line in lines
          ]
          chart.write_text('\n'.join(lines) + '\n')

          historical = Path('tests/historical-refinements-v131.test.mjs')
          text = historical.read_text().replace(
              'assert.match(source, /fiveYearHistoryBands/);',
              "assert.match(source, /function yearHistoryBands\\(analyses = \\[\\], bandSize = 3\\)/);\nassert.match(source, /yearHistoryBands\\(ordered, 3\\)/);"
          )
          historical.write_text(text)
          PY
          node --check assets/js/one-sheet-reports.js
          node --test tests/*.test.mjs
      - name: Commit audited report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-reports.js assets/one-sheet-reports.css reports.html version.json tests
          git diff --cached --check
          git commit -m "v0.22.137 add historical event callouts and three-year chart toggle"
          git push origin HEAD:fix/report-chart-audit-v137
