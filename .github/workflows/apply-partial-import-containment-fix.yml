name: Apply partial fundraiser containment fix

on:
  push:
    branches:
      - fix-partial-import-containment-20260812

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-partial-import-containment-20260812
          fetch-depth: 0

      - name: Apply importer fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('assets/js/ui-scheduling.js')
          text = path.read_text(encoding='utf-8')

          def replace_region(source, start_marker, end_marker, replacement, label):
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker not found')
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: end marker not found')
              if source.find(start_marker, start + 1) >= 0:
                  raise SystemExit(f'{label}: start marker is not unique')
              return source[:start] + replacement + source[end:]

          text = replace_region(
              text,
              '  function scheduleLooksAutoImported(schedule = {}) {',
              '\n\n  function scheduleSameRangePreferenceScore',
              """  function scheduleLooksAutoImported(schedule = {}) {
            if (schedule?.meta?.autoCreatedFromReports === true) return true;
            if (schedule?.meta?.autoCreatedFromReports === false) return false;
            const titleKey = utils.normalizeLookupKey(schedule?.title || '');
            if (titleKey.startsWith('imported pledge')) return true;
            const hasImportedIdentity = Boolean(schedule?.meta?.importedFromReports)
              || Boolean(utils.normalizeText(schedule?.meta?.importedFundraiserKey || ''));
            return hasImportedIdentity && !scheduleHasManualOrUserContent(schedule);
          }
          """,
              'scheduleLooksAutoImported'
          )

          text = replace_region(
              text,
              '  function findExistingScheduleForImportedGroup(group = {}, groupFileKeys = groupImportedFileKeys(group)) {',
              '\n\n  function prepareImportedScheduleRows',
              """  function scheduleContainsImportedGroup(schedule = {}, group = {}) {
            const scheduleStart = utils.normalizeText(schedule?.startDate || '');
            const scheduleEnd = utils.normalizeText(schedule?.endDate || scheduleStart);
            const groupStart = utils.normalizeText(group?.startDate || '');
            const groupEnd = utils.normalizeText(group?.endDate || groupStart);
            if (!(scheduleStart && scheduleEnd && groupStart && groupEnd)) return false;
            if (scheduleStart > groupStart || scheduleEnd < groupEnd) return false;
            return scheduleAndGroupShareCalendarYear(schedule, group);
          }

          function findBestContainingScheduleForImportedGroup(group = {}) {
            const candidates = (state.schedules || []).filter((item) => {
              if (!scheduleContainsImportedGroup(item, group)) return false;
              return !scheduleLooksAutoImported(item) || scheduleHasManualOrUserContent(item);
            });
            if (!candidates.length) return null;
            return [...candidates].sort((a, b) => {
              const aExact = utils.normalizeText(a?.startDate) === utils.normalizeText(group?.startDate)
                && utils.normalizeText(a?.endDate) === utils.normalizeText(group?.endDate);
              const bExact = utils.normalizeText(b?.startDate) === utils.normalizeText(group?.startDate)
                && utils.normalizeText(b?.endDate) === utils.normalizeText(group?.endDate);
              if (aExact !== bExact) return aExact ? -1 : 1;
              const aSpan = dateRangeSpanDays(utils.normalizeText(a?.startDate), utils.normalizeText(a?.endDate));
              const bSpan = dateRangeSpanDays(utils.normalizeText(b?.startDate), utils.normalizeText(b?.endDate));
              if (aSpan !== bSpan) return aSpan - bSpan;
              return scheduleSameRangePreferenceScore(b) - scheduleSameRangePreferenceScore(a);
            })[0] || null;
          }

          function findExistingScheduleForImportedGroup(group = {}, groupFileKeys = groupImportedFileKeys(group)) {
            const identity = `imported|${group.key}`.toLowerCase();
            let schedule = findBestContainingScheduleForImportedGroup(group);
            if (!schedule) schedule = state.schedules.find((item) => scheduleIdentityKey(item) === identity) || null;
            if (!schedule) {
              schedule = state.schedules.find((item) => {
                const importedPlacement = (item.placements || []).find((placement) => placement?.importedFromReport && utils.normalizeText(placement?.importedFundraiserKey) === utils.normalizeText(group.key));
                return Boolean(importedPlacement);
              }) || null;
            }
            if (!schedule) schedule = findBestSameRangeScheduleForImportedGroup(group);
            if (!schedule) {
              schedule = state.schedules.find((item) => {
                const sameRange = utils.normalizeText(item.startDate) === group.startDate && utils.normalizeText(item.endDate) === group.endDate;
                const hasImportedPlacements = (item.placements || []).some((placement) => placement.importedFromReport);
                return sameRange && hasImportedPlacements;
              }) || null;
            }
            if (!schedule) {
              schedule = state.schedules.find((item) => {
                const hasImportedPlacements = (item.placements || []).some((placement) => placement.importedFromReport);
                if (!hasImportedPlacements) return false;
                if (!datesOverlap(utils.normalizeText(item.startDate), utils.normalizeText(item.endDate), group.startDate, group.endDate)) return false;
                if (!scheduleAndGroupShareCalendarYear(item, group)) return false;
                const itemFileKeys = scheduleImportedFileKeys(item);
                if (!itemFileKeys.size || !groupFileKeys.size) return false;
                return [...groupFileKeys].some((key) => itemFileKeys.has(key));
              }) || null;
            }
            return schedule;
          }
          """,
              'findExistingScheduleForImportedGroup'
          )

          merge_start = text.find('  function mergeImportedRowsIntoSchedules(rows = [],')
          merge_end = text.find('\n\n  async function deleteMergedImportedScheduleRecords', merge_start)
          if merge_start < 0 or merge_end < 0:
              raise SystemExit('mergeImportedRowsIntoSchedules region not found')
          merge = text[merge_start:merge_end]

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return source.replace(old, new, 1)

          merge = replace_once(
              merge,
              """      let schedule = findExistingScheduleForImportedGroup(group, groupFileKeys);
              let createdThisSchedule = false;
              if (!schedule) {
          """,
              """      let schedule = findExistingScheduleForImportedGroup(group, groupFileKeys);
              let createdThisSchedule = false;
              let scheduleWasAutoImported = schedule
                ? (scheduleLooksAutoImported(schedule) && !scheduleHasManualOrUserContent(schedule))
                : false;
              if (!schedule) {
          """,
              'capture fundraiser origin'
          )

          merge = replace_once(
              merge,
              """        createdSchedules += 1;
                createdThisSchedule = true;
              }
          """,
              """        createdSchedules += 1;
                createdThisSchedule = true;
                scheduleWasAutoImported = true;
              }
          """,
              'mark newly created fundraiser as imported'
          )

          merge = replace_once(
              merge,
              """      if (scheduleLooksAutoImported(schedule)) {
                if (createdThisSchedule || allowTitleUpdates) schedule.title = group.title || schedule.title;
                schedule.startDate = group.startDate || schedule.startDate;
                schedule.endDate = group.endDate || schedule.endDate;
              }
          """,
              """      if (scheduleWasAutoImported) {
                if (createdThisSchedule || allowTitleUpdates) schedule.title = group.title || schedule.title;
                schedule.startDate = group.startDate || schedule.startDate;
                schedule.endDate = group.endDate || schedule.endDate;
              }
          """,
              'protect user fundraiser boundaries'
          )

          merge = replace_once(
              merge,
              """      schedule.meta = {
                ...(schedule.meta || {}),
                importedFundraiserKey: group.key,
          """,
              """      schedule.meta = {
                ...(schedule.meta || {}),
                autoCreatedFromReports: Boolean(scheduleWasAutoImported || createdThisSchedule),
                importedFundraiserKey: group.key,
          """,
              'persist fundraiser origin'
          )

          text = text[:merge_start] + merge + text[merge_end:]
          path.write_text(text, encoding='utf-8')

          version_path = Path('version.json')
          payload = json.loads(version_path.read_text(encoding='utf-8'))
          if payload.get('appVersion') != '0.22.55':
              raise SystemExit(f"Expected production version 0.22.55, found {payload.get('appVersion')!r}")
          version_path.write_text(json.dumps({'appVersion': '0.22.56', 'releasedAt': '2026-08-12'}, separators=(',', ':')) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if index.count('0.22.55') != 2:
              raise SystemExit(f"index.html expected exactly two 0.22.55 markers, found {index.count('0.22.55')}")
          index = index.replace('0.22.55', '0.22.56')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate source and importer behavior
        shell: bash
        run: |
          node --check assets/js/ui-scheduling.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('assets/js/ui-scheduling.js').read_text(encoding='utf-8')
          required = [
              'function scheduleContainsImportedGroup',
              'function findBestContainingScheduleForImportedGroup',
              'let schedule = findBestContainingScheduleForImportedGroup(group);',
              'let scheduleWasAutoImported = schedule',
              'if (scheduleWasAutoImported) {',
              'autoCreatedFromReports: Boolean(scheduleWasAutoImported || createdThisSchedule)'
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing required fix marker: {item}')
          find_start = text.index('function findExistingScheduleForImportedGroup')
          find_end = text.index('function prepareImportedScheduleRows', find_start)
          find_body = text[find_start:find_end]
          if find_body.index('findBestContainingScheduleForImportedGroup(group)') > find_body.index('scheduleIdentityKey(item) === identity'):
              raise SystemExit('Containing fundraiser lookup does not run before imported identity lookup')
          PY

          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('assets/js/ui-scheduling.js', 'utf8');
          function extract(name) {
            const marker = `function ${name}`;
            const start = src.indexOf(marker);
            if (start < 0) throw new Error(`Missing function ${name}`);
            const brace = src.indexOf('{', start);
            let depth = 0;
            let quote = '';
            let escape = false;
            for (let i = brace; i < src.length; i += 1) {
              const ch = src[i];
              if (quote) {
                if (escape) escape = false;
                else if (ch === '\\') escape = true;
                else if (ch === quote) quote = '';
                continue;
              }
              if (ch === "'" || ch === '"' || ch === '`') { quote = ch; continue; }
              if (ch === '{') depth += 1;
              if (ch === '}') {
                depth -= 1;
                if (depth === 0) return src.slice(start, i + 1);
              }
            }
            throw new Error(`Unclosed function ${name}`);
          }

          const utils = {
            normalizeText: (v) => String(v || '').trim(),
            normalizeLookupKey: (v) => String(v || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim()
          };
          const state = { schedules: [] };
          const names = [
            'dateKeyToDate',
            'daysBetweenDateKeys',
            'dateKeyYear',
            'dateRangeSpansCalendarYears',
            'dateRangeSpanDays',
            'scheduleAndGroupShareCalendarYear',
            'scheduleManualMoneyTotal',
            'scheduleHasManualOrUserContent',
            'scheduleLooksAutoImported',
            'scheduleSameRangePreferenceScore',
            'scheduleContainsImportedGroup',
            'findBestContainingScheduleForImportedGroup'
          ];
          eval(names.map(extract).join('\n'));

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          const group = { startDate: '2026-08-08', endDate: '2026-08-11' };
          const realAugust = {
            id: 'real', title: 'August Fundraiser', startDate: '2026-08-01', endDate: '2026-08-16',
            placements: [{ id: 'manual-slot', importedFromReport: false }], meta: {}
          };
          const bogusImported = {
            id: 'bogus', title: 'Imported pledge Aug 8 - Aug 11', startDate: '2026-08-08', endDate: '2026-08-11',
            placements: [{ id: 'imported-slot', importedFromReport: true }],
            meta: { importedFromReports: true, importedFundraiserKey: 'cluster|aug8|aug11' }
          };
          state.schedules = [bogusImported, realAugust];
          assert(findBestContainingScheduleForImportedGroup(group)?.id === 'real', 'Real containing fundraiser must beat exact auto-imported duplicate');

          const narrower = {
            id: 'narrow', title: 'Mid-August Fundraiser', startDate: '2026-08-05', endDate: '2026-08-12',
            placements: [{ importedFromReport: false }], meta: {}
          };
          state.schedules = [realAugust, narrower];
          assert(findBestContainingScheduleForImportedGroup(group)?.id === 'narrow', 'Smallest user-created containing fundraiser should win');

          const exactManual = {
            id: 'exact-manual', title: 'Special Fundraiser', startDate: '2026-08-08', endDate: '2026-08-11',
            placements: [{ importedFromReport: false }], meta: {}
          };
          state.schedules = [realAugust, exactManual];
          assert(findBestContainingScheduleForImportedGroup(group)?.id === 'exact-manual', 'Exact user-created range should beat broader containing range');

          const importedButUserOwned = {
            id: 'user-owned', title: 'August Fundraiser', startDate: '2026-08-01', endDate: '2026-08-16',
            placements: [{ importedFromReport: true }],
            meta: { autoCreatedFromReports: false, importedFromReports: true, importedFundraiserKey: 'cluster|x' }
          };
          assert(scheduleLooksAutoImported(importedButUserOwned) === false, 'Explicit user-created origin must survive later imports');

          const autoSpecificTitle = {
            id: 'auto-specific', title: 'August Membership Drive', startDate: '2026-08-08', endDate: '2026-08-11',
            placements: [{ importedFromReport: true }],
            meta: { autoCreatedFromReports: true, importedFromReports: true }
          };
          assert(scheduleLooksAutoImported(autoSpecificTitle) === true, 'Explicit auto-created origin must not depend on title');

          state.schedules = [bogusImported];
          assert(findBestContainingScheduleForImportedGroup(group) === null, 'Auto-created fundraiser alone should fall through to existing import identity logic');

          console.log('Targeted partial-import containment tests passed.');
          NODE

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "assets/js/ui-scheduling.js
          index.html
          version.json"

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Tod"
          git config user.email "tpoirier@nmu.edu"
          git rm .github/workflows/apply-partial-import-containment-fix.yml
          git add assets/js/ui-scheduling.js index.html version.json
          git commit -m "Fix partial results imports reusing existing fundraisers"
          git push origin fix-partial-import-containment-20260812
