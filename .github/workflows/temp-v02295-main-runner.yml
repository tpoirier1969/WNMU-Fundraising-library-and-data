name: Temporary v0.22.95 source validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-imported-history-authority-v02295
          fetch-depth: 0

      - name: Extract and apply feature patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/temp-v02295.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code = []
          for line in lines[start:end]:
              code.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v02295_patch.py').write_text('\n'.join(code) + '\n')
          PY
          python /tmp/v02295_patch.py

      - name: Validate source and regression tests
        shell: bash
        run: |
          node --check assets/js/ui-fundraiser-comparison.js
          node --check assets/js/ui-analytics.js
          node --test tests/fundraiser-comparison.test.mjs
          node --test tests/performance-analytics.test.mjs

      - name: Commit clean feature source
        shell: bash
        run: |
          rm -f .github/workflows/temp-v02295.yml .temp-v02295-trigger
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Make imported fundraiser history authoritative"
          git push origin HEAD:fix-imported-history-authority-v02295

      - name: Remove temporary runner from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm -f .github/workflows/temp-v02295-main-runner.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Remove temporary v0.22.95 runner"
          git push origin main
