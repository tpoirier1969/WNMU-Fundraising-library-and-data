name: Apply library fast-load v0.22.112

on:
  push:
    branches:
      - feature/library-fast-load-v022112
    paths:
      - tools/apply-library-fast-load-v022112.py
      - .github/workflows/apply-library-fast-load-v022112.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-fast-load-v022112
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python tools/apply-library-fast-load-v022112.py
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit canonical fast-load release
        run: |
          rm tools/apply-library-fast-load-v022112.py .github/workflows/apply-library-fast-load-v022112.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.22.112 faster Program Library loading"
          git push origin HEAD:feature/library-fast-load-v022112
