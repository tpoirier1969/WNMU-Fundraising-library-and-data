name: Validate topic drilldown v0.22.93

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and validate topic drilldown
        shell: bash
        run: |
          git fetch origin analytics-topic-drilldown-v02293
          git switch analytics-topic-drilldown-v02293
          if [ -f scripts/_tmp_topic_drilldown_v02293.py ]; then
            python scripts/_tmp_topic_drilldown_v02293.py
            python - <<'PY'
          from pathlib import Path
          path = Path('tests/performance-analytics.test.mjs')
          text = path.read_text(encoding='utf-8')
          marker = "\ntest('topic analytics columns explicitly opt into left alignment'"
          start = text.index(marker)
          end = text.index('\n});', start) + len('\n});')
          replacement = """
          test('topic analytics columns explicitly opt into left alignment', () => {
            const text = fs.readFileSync(sourcePath, 'utf8');
            assert.ok(text.includes('analytics-left'));
            const workspace = fs.readFileSync(new URL('../assets/analytics-workspace.html', import.meta.url), 'utf8');
            assert.ok(workspace.includes('.analytics-left { text-align: left !important; }'));
          });"""
          path.write_text(text[:start] + '\n' + replacement.strip() + text[end:], encoding='utf-8')
          PY
            rm -f scripts/_tmp_topic_drilldown_v02293.py scripts/_tmp_topic_drilldown_trigger.txt
            node --check assets/js/ui-analytics.js
            node --test tests/performance-analytics.test.mjs
            git config user.name "OpenAI"
            git config user.email "noreply@openai.com"
            git add -A
            git commit -m "Add topic and outlier analytics drilldowns"
            git push origin HEAD:analytics-topic-drilldown-v02293
          else
            node --check assets/js/ui-analytics.js
            node --test tests/performance-analytics.test.mjs
          fi
