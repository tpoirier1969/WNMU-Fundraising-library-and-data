name: Apply report duration and hover v0.22.110

on:
  push:
    branches:
      - fix/report-duration-protection-v022110

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-duration-protection-v022110
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python .github/tmp/apply-report-duration-and-hover-v022110.py
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit canonical report hardening
        run: |
          git config user.name "WNMU Report Hardening"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/apply-report-duration-and-hover-v022110.yml .github/tmp/apply-report-duration-and-hover-v022110.py
          git add assets/js/one-sheet-analysis.js assets/js/one-sheet-reports.js assets/one-sheet-reports.css reports.html tests/one-sheet-report-refinements.test.mjs tests/one-sheet-reports.test.mjs version.json
          git commit -m "Finish report duration protection and add day-node hover titles"
          git push origin HEAD:fix/report-duration-protection-v022110
