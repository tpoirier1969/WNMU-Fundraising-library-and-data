name: Apply Scheduling authoritative actuals fix

on:
  push:
    branches:
      - fix/scheduling-authoritative-actuals-v022109

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scheduling-authoritative-actuals-v022109
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct test-hook target in guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/tmp/apply_scheduling_authoritative_actuals.py')
          text = path.read_text()
          bad = '''export_old = "globalThis.__scheduleImportTestHooks = { mergeImportedRowsIntoSchedules, deleteMergedImportedScheduleRecords, confirmImportedScheduleDestructiveRepair };"\nexport_new = "globalThis.__scheduleImportTestHooks = { mergeImportedRowsIntoSchedules, deleteMergedImportedScheduleRecords, confirmImportedScheduleDestructiveRepair, reconcileSchedulePlacementResults };"\nif export_old not in source:\n    raise SystemExit('schedule test hook marker not found')\nsource = source.replace(export_old, export_new, 1)\nsource_path.write_text(source)\n\ntest_path = Path('tests/schedule-import-safety.test.mjs')\ntests = test_path.read_text()\n'''
          good = '''source_path.write_text(source)\n\ntest_path = Path('tests/schedule-import-safety.test.mjs')\ntests = test_path.read_text()\nhook_pattern = re.compile(r"(globalThis\\.__scheduleImportTestHooks = \\{[^}]*confirmImportedScheduleDestructiveRepair)( \\};)")\ntests, hook_count = hook_pattern.subn(r"\\1, reconcileSchedulePlacementResults\\2", tests, count=1)\nif hook_count != 1:\n    raise SystemExit(f'schedule test hook injection replacement count={hook_count}')\n'''
          if bad not in text:
              raise SystemExit('bad test-hook patch block not found')
          path.write_text(text.replace(bad, good, 1))
          PY
      - name: Apply guarded patch
        run: python .github/tmp/apply_scheduling_authoritative_actuals.py
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit canonical fix
        run: |
          git config user.name "WNMU Scheduling Hardening"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/apply-scheduling-authoritative-actuals.yml .github/tmp/apply_scheduling_authoritative_actuals.py
          git add assets/js/ui-scheduling.js tests/schedule-import-safety.test.mjs version.json
          git commit -m "Make Scheduling actuals follow imported evidence"
          git push origin HEAD:fix/scheduling-authoritative-actuals-v022109
