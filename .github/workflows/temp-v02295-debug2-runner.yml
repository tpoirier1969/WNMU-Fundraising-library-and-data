name: Temporary v0.22.95 debug validation retry

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-imported-history-authority-v02295
          fetch-depth: 0

      - name: Apply corrected feature patch and capture failures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/temp-v02295.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          code = []
          for line in lines[start:end]:
              code.append(line[10:] if line.startswith('          ') else line)
          source = '\n'.join(code) + '\n'
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if old not in source:
              raise SystemExit('could not patch re.subn replacement handling')
          source = source.replace(old, new, 1)
          Path('/tmp/v02295_patch.py').write_text(source)
          PY
          rm -f .temp-v02295-error.log
          set +e
          python /tmp/v02295_patch.py >/tmp/v02295-patch.log 2>&1
          PATCH_STATUS=$?
          set -e
          if [ "$PATCH_STATUS" -ne 0 ]; then
            cp /tmp/v02295-patch.log .temp-v02295-error.log
            git config user.name "OpenAI"
            git config user.email "noreply@openai.com"
            git add -A
            git commit -m "Capture v0.22.95 patch failure retry"
            git push origin HEAD:fix-imported-history-authority-v02295
            exit "$PATCH_STATUS"
          fi

      - name: Validate and capture failures
        shell: bash
        run: |
          set +e
          {
            node --check assets/js/ui-fundraiser-comparison.js &&
            node --check assets/js/ui-analytics.js &&
            node --test tests/fundraiser-comparison.test.mjs &&
            node --test tests/performance-analytics.test.mjs
          } >/tmp/v02295-test.log 2>&1
          TEST_STATUS=$?
          set -e
          if [ "$TEST_STATUS" -ne 0 ]; then
            cp /tmp/v02295-test.log .temp-v02295-error.log
            git config user.name "OpenAI"
            git config user.email "noreply@openai.com"
            git add -A
            git commit -m "Capture v0.22.95 validation failure retry"
            git push origin HEAD:fix-imported-history-authority-v02295
            exit "$TEST_STATUS"
          fi

      - name: Commit clean feature source
        shell: bash
        run: |
          rm -f .github/workflows/temp-v02295.yml .temp-v02295-trigger .temp-v02295-error.log
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Make imported fundraiser history authoritative"
          git push origin HEAD:fix-imported-history-authority-v02295

      - name: Remove temporary runner from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm -f .github/workflows/temp-v02295-debug2-runner.yml
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Remove temporary v0.22.95 debug retry runner"
          git push origin main
