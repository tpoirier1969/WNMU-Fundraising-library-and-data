name: v0.22.130 report visual updater

on:
  push:
    branches:
      - release/v0.22.130-report-visual-context

permissions:
  contents: write

jobs:
  update-and-test:
    if: github.event.head_commit.message != 'v0.22.130 add report visual summaries and historical context'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.22.130-report-visual-context
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply report changes
        run: python .github/v130_report_visual_updater.py
      - name: Syntax check report code
        run: node --check assets/js/one-sheet-reports.js
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit generated release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-reports.js reports.html version.json tests/report-visual-historical-context-v130.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "v0.22.130 add report visual summaries and historical context"
          git push origin HEAD:release/v0.22.130-report-visual-context
