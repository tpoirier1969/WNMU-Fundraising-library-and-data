name: v0.22.130 report visual updater

on:
  push:
    branches:
      - release/v0.22.130-report-visual-context

permissions:
  contents: write

jobs:
  update-and-test:
    if: github.event.head_commit.message != 'v0.22.130 add report visual summaries and historical context'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.22.130-report-visual-context
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply report changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/v130_report_visual_updater.py')
          text = path.read_text()
          old = "js = replace_once(js, '${escapeHtml(compactMoney(value))}</text></g>`;', '${escapeHtml(axisFormatter(value))}</text></g>`;', 'line chart axis formatter')"
          new = "js = js.replace('${escapeHtml(compactMoney(value))}</text></g>`;', '${escapeHtml(axisFormatter(value))}</text></g>`;', 1)"
          if old not in text:
              raise SystemExit('axis formatter updater line not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/v130_report_visual_updater.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/library-load-performance.test.mjs': [('0.22.129', '0.22.130')],
              'tests/one-sheet-report-refinements.test.mjs': [('0\\.22\\.129', '0\\.22\\.130')],
              'tests/one-sheet-reports.test.mjs': [('0\\.22\\.129', '0\\.22\\.130')],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{filename}: expected release lock {old}')
                  text = text.replace(old, new)
              path.write_text(text)

          # Missing comparison evidence must stay missing, never become a synthetic zero bar.
          path = Path('assets/js/one-sheet-reports.js')
          text = path.read_text()
          old = "const cleanSeries = series.map((item) => ({ ...item, values: (item.values || []).map((value) => Number.isFinite(Number(value)) ? Number(value) : 0) }));"
          new = "const cleanSeries = series.map((item) => ({ ...item, values: (item.values || []).map((value) => value === null || value === undefined || value === '' ? null : (Number.isFinite(Number(value)) ? Number(value) : null)) }));"
          if old not in text:
              raise SystemExit('bar-series null-preservation target not found')
          text = text.replace(old, new, 1)
          old = "return item.values.map((value, index) => {\n        const x = margin.left + (index * groupWidth) + ((groupWidth - innerWidth) / 2) + (seriesIndex * (barWidth + barGap));"
          new = "return item.values.map((value, index) => {\n        if (value === null || value === undefined || !Number.isFinite(Number(value))) return '';\n        const x = margin.left + (index * groupWidth) + ((groupWidth - innerWidth) / 2) + (seriesIndex * (barWidth + barGap));"
          if old not in text:
              raise SystemExit('bar null-skip target not found')
          text = text.replace(old, new, 1)
          old = "dollarsPerHour: medianNumber(byFundraiser.map((rows) => rows[index]?.dollarsPerHour).filter((value) => Number.isFinite(Number(value)))),\n      pledgesPerHour: medianNumber(byFundraiser.map((rows) => rows[index]?.pledgesPerHour).filter((value) => Number.isFinite(Number(value)))),"
          new = "dollarsPerHour: (() => { const values = byFundraiser.map((rows) => rows[index]?.dollarsPerHour).filter((value) => value !== null && value !== undefined && Number.isFinite(Number(value))); return values.length ? medianNumber(values) : null; })(),\n      pledgesPerHour: (() => { const values = byFundraiser.map((rows) => rows[index]?.pledgesPerHour).filter((value) => value !== null && value !== undefined && Number.isFinite(Number(value))); return values.length ? medianNumber(values) : null; })(),"
          if old not in text:
              raise SystemExit('lifecycle missing-evidence target not found')
          text = text.replace(old, new, 1)
          old = "${Number.isFinite(Number(historicalTopic)) ? `That is ${comparisonPhrase(topicRows.current[bestIndex], historicalTopic, `${topic} historical median`)}.` : 'That topic does not yet have enough historical evidence for a stable median.'}"
          new = "${historicalTopic !== null && historicalTopic !== undefined && Number.isFinite(Number(historicalTopic)) ? `That is ${comparisonPhrase(topicRows.current[bestIndex], historicalTopic, `${topic} historical median`)}.` : 'That topic does not yet have enough historical evidence for a stable median.'}"
          if old not in text:
              raise SystemExit('historical topic missing-evidence target not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Syntax check report code
        run: node --check assets/js/one-sheet-reports.js
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit generated release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-reports.js reports.html version.json tests/report-visual-historical-context-v130.test.mjs tests/library-load-performance.test.mjs tests/one-sheet-report-refinements.test.mjs tests/one-sheet-reports.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "v0.22.130 add report visual summaries and historical context"
          git push origin HEAD:release/v0.22.130-report-visual-context
