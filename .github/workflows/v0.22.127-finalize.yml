name: v0.22.127 finalizer

on:
  push:
    branches:
      - release/v0.22.127-analytics-consistency

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize release files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          reports = Path('reports.html')
          text = reports.read_text()
          old = '0.22.126'
          new = '0.22.127'
          count = text.count(old)
          if count != 3:
              raise RuntimeError(f'reports.html: expected 3 v0.22.126 cache refs, found {count}')
          reports.write_text(text.replace(old, new))

          replacements = {
              'tests/library-load-performance.test.mjs': [
                  ("assert.equal(version.appVersion, '0.22.126');", "assert.equal(version.appVersion, '0.22.127');")
              ],
              'tests/one-sheet-report-refinements.test.mjs': [
                  ('one-sheet-reports\\.js\\?v=0\\.22\\.126', 'one-sheet-reports\\.js\\?v=0\\.22\\.127'),
                  ('one-sheet-analysis\\.js\\?v=0\\.22\\.126', 'one-sheet-analysis\\.js\\?v=0\\.22\\.127'),
                  ('one-sheet-reports\\.css\\?v=0\\.22\\.126', 'one-sheet-reports\\.css\\?v=0\\.22\\.127')
              ],
              'tests/one-sheet-reports.test.mjs': [
                  ('assert.match(reportHtml, /0\\.22\\.126/);', 'assert.match(reportHtml, /0\\.22\\.127/);')
              ]
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old_text, new_text in pairs:
                  count = text.count(old_text)
                  if count != 1:
                      raise RuntimeError(f'{filename}: expected one {old_text!r}, found {count}')
                  text = text.replace(old_text, new_text, 1)
              path.write_text(text)

          version = json.loads(Path('version.json').read_text())
          if version.get('appVersion') != '0.22.127':
              raise RuntimeError(f"version.json is {version.get('appVersion')}, expected 0.22.127")
          PY

          rm -f \
            .github/v127_stage1.py \
            .github/v127_stage1_fix.py \
            .github/v127_stage1_fix2.py \
            .github/v127_stage2.py \
            .github/v127_stage2b.py \
            .github/v127_stage2b_testfix.py \
            .github/v127_update.py \
            .github/workflows/v0.22.127-finalize.yml
      - name: Run complete regression suite
        run: node --test tests/*.test.mjs
      - name: Verify clean release shape
        shell: bash
        run: |
          test ! -e .github/v127_stage1.py
          test ! -e .github/v127_stage1_fix.py
          test ! -e .github/v127_stage1_fix2.py
          test ! -e .github/v127_stage2.py
          test ! -e .github/v127_stage2b.py
          test ! -e .github/v127_stage2b_testfix.py
          test ! -e .github/v127_update.py
          test ! -e .github/workflows/v0.22.127-finalize.yml
          test "$(git show HEAD:.github/workflows/regression-tests.yml | git hash-object --stdin)" = "8e3c286c6550b64aa6c00a834023a18b1aa29dbd"
      - name: Commit clean release candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare clean v0.22.127 analytics release candidate'
          git push origin HEAD:release/v0.22.127-analytics-consistency
