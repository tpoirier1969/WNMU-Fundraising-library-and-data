name: Temporary v0.22.129 updater

on:
  push:
    branches:
      - release/v0.22.129-import-reconciliation
    paths:
      - .github/workflows/v129-import-reconciliation-updater.yml

permissions:
  contents: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.22.129-import-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.22.129 changes
        env:
          UPDATER_B64:   
        run: |
          echo "$UPDATER_B64" | base64 --decode > /tmp/v129_updater.py
          python /tmp/v129_updater.py
      - name: Run full regression suite
        run: node --test tests/*.test.mjs
      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ui-analytics.js reports.html version.json tests/
          git commit -m "v0.22.129 prevent duplicate schedule analytics distortion"
          git push origin HEAD:release/v0.22.129-import-reconciliation
