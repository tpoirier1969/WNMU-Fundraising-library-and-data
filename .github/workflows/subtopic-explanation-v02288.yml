name: Temporary subtopic explanation runner

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'subtopic-explanation-v02288'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply subtopic explanation patch
        run: |
          python .github/subtopic-explanation-v02288.py
          node --check assets/js/ui-fundraiser-comparison.js
          git diff --check
          grep -q "Dial down into" assets/js/ui-fundraiser-comparison.js
          grep -q "subtopicRevenueDecomposition" assets/js/ui-fundraiser-comparison.js
          grep -q "Main accounting driver" assets/js/ui-fundraiser-comparison.js
          grep -q '"appVersion":"0.22.88"' version.json
          rm -f .github/subtopic-explanation-v02288.py .github/workflows/subtopic-explanation-v02288.yml
          git config user.name "Tod"
          git config user.email "tpoirier@nmu.edu"
          git add -A
          git commit -m "Add subtopic explanation drill-down"
          git push origin HEAD:${{ github.head_ref }}
