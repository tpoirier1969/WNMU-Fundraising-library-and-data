name: Apply historical report fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v0.22.135-historical-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update original report code
        run: echo '' | base64 --decode | python3
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit fixed release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v0.22.135 fix Historical Analytics crash and error routing'
          git push origin main
