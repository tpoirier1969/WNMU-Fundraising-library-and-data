name: Integrate Performance Analytics workspace

on:
  push:
    paths:
      - ".github/workflows/integrate-analytics-workspace.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/performance-analytics-workspace
          fetch-depth: 0

      - name: Generate integrated Analytics workspace
        run: python .github/scripts/integrate_analytics_workspace.py

      - name: Remove retired and temporary sources
        shell: bash
        run: |
          rm -f assets/js/ui-performance.js
          rm -f pledge-performance-lab-shell.html
          rm -f .github/scripts/integrate_analytics_workspace.py
          rm -f .github/workflows/integrate-analytics-workspace.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Validate integration
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/ui-analytics.js
          node --check assets/js/ui-workspace.js
          node --check assets/js/ui-list.js
          node --check assets/js/auth.js
          node --check assets/js/app-init.js
          node --check assets/js/core.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json

          shell = Path('app-shell.html').read_text(encoding='utf-8')
          analytics = Path('assets/js/ui-analytics.js').read_text(encoding='utf-8')
          fragment = Path('assets/analytics-workspace.html').read_text(encoding='utf-8')
          list_ui = Path('assets/js/ui-list.js').read_text(encoding='utf-8')
          auth = Path('assets/js/auth.js').read_text(encoding='utf-8')
          workspace = Path('assets/js/ui-workspace.js').read_text(encoding='utf-8')
          version = json.loads(Path('version.json').read_text(encoding='utf-8'))
          legacy = Path('pledge-performance-lab.html').read_text(encoding='utf-8')

          assert version.get('appVersion') == '0.22.75'
          assert 'data-workspace-button="performance"' in shell
          assert '>Performance Analytics</button>' in shell
          assert 'id="performance-analytics-root"' in shell
          assert 'assets/js/ui-analytics.js' in shell
          assert 'ui-performance.js' not in shell
          assert 'Pledge Performance comparisons' not in shell
          assert 'App.analyticsUi?.ensureReady()' in workspace
          assert 'App.performanceUi' not in workspace
          assert 'App.workspaceUi?.setWorkspace?.(\'performance\')' in list_ui
          assert 'window.location.href = \'pledge-performance-lab.html' not in list_ui
          assert 'ensurePerformanceLabButton' not in auth
          assert 'Performance Analytics' in fragment
          assert '<style>' in fragment
          assert 'attachShadow' in analytics
          assert 'App.analyticsUi = { ensureReady, openCohort, reload }' in analytics
          assert 'Sign in as admin to use Performance Analytics.' not in analytics
          assert 'admin-only' not in analytics.lower()
          assert "next.searchParams.set('workspace', 'performance')" in legacy
          assert not Path('assets/js/ui-performance.js').exists()
          assert not Path('pledge-performance-lab-shell.html').exists()
          PY

      - name: Verify anonymous read path used by current app
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cfg = fs.readFileSync('config.js', 'utf8');
          const base = cfg.match(/SUPABASE_URL:\s*'([^']+)'/)?.[1];
          const key = cfg.match(/SUPABASE_ANON_KEY:\s*'([^']+)'/)?.[1];
          if (!base || !key) throw new Error('Could not read Supabase config');
          async function check(table) {
            const url = `${base}/rest/v1/${table}?select=id&limit=1`;
            const response = await fetch(url, { headers: { apikey: key, Authorization: `Bearer ${key}` } });
            if (!response.ok) throw new Error(`${table} anonymous read failed: ${response.status} ${await response.text()}`);
            const rows = await response.json();
            console.log(`${table}: anonymous read OK (${rows.length} sample row${rows.length === 1 ? '' : 's'})`);
          }
          Promise.all([check('pledge_program_airings_v2'), check('pledge_fundraiser_schedules')]).catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Integrate Performance Analytics workspace"
          git push origin HEAD:integration/performance-analytics-workspace
