name: Run analytics v0.22.92 patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-analytics-v02292.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run patch from feature branch
        shell: bash
        run: |
          git fetch origin fix-performance-analytics-starttime-v02292
          git switch fix-performance-analytics-starttime-v02292
          python - <<'PY' > /tmp/apply.sh
          from pathlib import Path
          import textwrap
          lines = Path('.github/workflows/analytics-and-comparison-v02292.yml').read_text(encoding='utf-8').splitlines()
          target = '      - name: Apply analytics hardening and comparison refinements'
          start = lines.index(target)
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          end = next((i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name: ')), len(lines))
          print(textwrap.dedent('\n'.join(lines[run_line + 1:end])))
          PY
          bash /tmp/apply.sh
          python - <<'PY' > /tmp/validate.sh
          from pathlib import Path
          import textwrap
          lines = Path('.github/workflows/analytics-and-comparison-v02292.yml').read_text(encoding='utf-8').splitlines()
          target = '      - name: Validate'
          start = lines.index(target)
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          end = next((i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name: ')), len(lines))
          print(textwrap.dedent('\n'.join(lines[run_line + 1:end])))
          PY
          bash /tmp/validate.sh
          rm -f .github/workflows/analytics-and-comparison-v02292.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Harden analytics and add weather performance view"
          git push origin HEAD:fix-performance-analytics-starttime-v02292
      - name: Remove temporary runner from main
        shell: bash
        run: |
          git switch main
          git pull --ff-only origin main
          rm -f .github/workflows/run-analytics-v02292.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Remove temporary v0.22.92 analytics runner"
          git push origin HEAD:main
