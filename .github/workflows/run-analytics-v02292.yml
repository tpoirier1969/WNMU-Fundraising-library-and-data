name: Validate analytics v0.22.92

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate analytics and comparison changes
        run: |
          node --check assets/js/ui-analytics.js
          node --check assets/js/ui-fundraiser-comparison.js
          node --test tests/performance-analytics.test.mjs
          node --test tests/fundraiser-comparison.test.mjs
