      return `<td class="${intensity > 0.62 ? 'fc-heat-dark' : ''}" style="background:rgba(29,95,150,${alpha})"><strong>${escapeHtml(hoursLabel(minutes))}</strong><span>Median ${escapeHtml(money(med))}/airing</span><small>${escapeHtml(money(dollars))} total</small></td>`;
    }).join('')}</tr>`).join('');
    return `<section class="fc-panel"><div class="fc-panel-head"><div><h3>Topic hours / median-performance heatmap</h3><span>Printed value is scheduled hours. Color intensity is median Broadcast $ per completed airing, so strong low-hour topics do not disappear. Total attributable dollars remain in each cell as context.</span></div><div class="fc-heat-scale"><span>Lower median</span><i></i><span>Higher median</span></div></div><div class="fc-table-wrap"><table class="fc-heatmap"><thead><tr><th>Topic</th>${head}</tr></thead><tbody>${body}</tbody></table></div></section>`;
  }''')

          # Make certified subtopic/program drill-down rank and shade by median, while retaining total-dollar context.
