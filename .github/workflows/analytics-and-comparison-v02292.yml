      .sort((a, b) => b.maxMedian - a.maxMedian || b.totalDollars - a.totalDollars || b.totalMinutes - a.totalMinutes || a.key.localeCompare(b.key));

    if (!rows.length) return '<section class="fc-panel"><h3>Topic performance and revenue</h3><div class="fc-chart-empty">No topic schedule/results to graph.</div></section>';

