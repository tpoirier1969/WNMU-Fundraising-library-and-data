        const raw = text(stamp);
        const dateKey = raw.slice(0, 10);
        const hour = Number(raw.slice(11, 13));
        if (!dateKey || !Number.isFinite(hour) || hour < weatherWindowStartHour(dateKey) || hour >= 24) return;
        if (!hourlyByDate.has(dateKey)) hourlyByDate.set(dateKey, { temps: [], precip: 0 });
        const bucket = hourlyByDate.get(dateKey);
        const temp = Number(hourly.temperature_2m?.[index]);
        const precip = Number(hourly.precipitation?.[index]);
        if (Number.isFinite(temp)) bucket.temps.push(temp);
        if (Number.isFinite(precip)) bucket.precip += precip;
      });

      daily.time.forEach((dateKey, index) => {
        if (!perDate.has(dateKey)) perDate.set(dateKey, []);
        const hourlyWindow = hourlyByDate.get(dateKey) || { temps: [], precip: null };
        const windowTemp = hourlyWindow.temps.length ? hourlyWindow.temps.reduce((sum, value) => sum + value, 0) / hourlyWindow.temps.length : null;
        perDate.get(dateKey).push({
          location: location.name,
          high: Number(daily.temperature_2m_max?.[index]),
          low: Number(daily.temperature_2m_min?.[index]),
          precip: Number(daily.precipitation_sum?.[index]),
          snow: Number(daily.snowfall_sum?.[index]),
          windowTemp,
          windowPrecip: Number.isFinite(Number(hourlyWindow.precip)) ? Number(hourlyWindow.precip) : null
        });
      });
    });

    perDate.forEach((rows, dateKey) => {
      const average = (field) => {
        const values = rows.map((row) => Number(row[field])).filter(Number.isFinite);
        return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
