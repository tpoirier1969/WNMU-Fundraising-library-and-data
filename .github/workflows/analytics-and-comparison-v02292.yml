          a = replace_function(a, 'dedupeSchedulesByDateRange', '''  function dedupeSchedulesByDateRange(schedules = []) {
    const buckets = new Map();
    schedules.forEach((schedule) => {
      const key = `${text(schedule.startDate)}|${text(schedule.endDate)}`;
      if (!text(schedule.startDate) || !text(schedule.endDate)) {
        buckets.set(`${key}|${text(schedule.id)}`, [schedule]);
        return;
      }
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(schedule);
    });
    const active = [];
    let suppressed = 0;
    buckets.forEach((items) => {
      const ranked = [...items].sort((a, b) => schedulePreferenceScore(b) - schedulePreferenceScore(a));
      if (ranked[0]) active.push({ ...ranked[0], duplicateRangeCount: ranked.length });
      suppressed += Math.max(0, ranked.length - 1);
    });
    state.scheduleAudit = {
      rawSchedules: schedules.length,
      activeSchedules: active.length,
      duplicateSchedulesMerged: 0,
      duplicateSchedulesSuppressed: suppressed
    };
    return active.sort((a, b) => `${text(a.startDate)}|${text(a.endDate)}`.localeCompare(`${text(b.startDate)}|${text(b.endDate)}`));
  }''')

