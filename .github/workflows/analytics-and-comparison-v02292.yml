test('ambiguous same-day airing matches are excluded instead of choosing the highest-dollar row', () => {
  const rowA = { id: 'a', dateKey: '2026-08-22', startMinutes: 1200, title: 'Same Program', dollars: 900 };
  const rowB = { id: 'b', dateKey: '2026-08-22', startMinutes: 1290, title: 'Same Program', dollars: 100 };
  const lookup = { hash: new Map(), exact: new Map(), dateProgram: new Map(), dateNola: new Map(), dateTitle: new Map() };
  lookup.dateTitle.set('2026-08-22|same program', [rowA, rowB]);
  assert.equal(hooks.findAiringForSchedulePlacement({ placement: { programTitle: 'Same Program' }, dateKey: '2026-08-22', startMinutes: 1230, title: 'same program', airingLookup: lookup }), null);
  lookup.exact.set('2026-08-22|same program|1200', [rowA]);
  assert.equal(hooks.findAiringForSchedulePlacement({ placement: { programTitle: 'Same Program' }, dateKey: '2026-08-22', startMinutes: 1200, title: 'same program', airingLookup: lookup }), rowA);
});

test('duplicate fundraiser ranges select one preferred record rather than blending placements', () => {
  const older = { id: 'old', startDate: '2026-08-01', endDate: '2026-08-09', updatedAt: '2026-08-10T00:00:00Z', placements: [{ id: 'old-p' }] };
  const newer = { id: 'new', startDate: '2026-08-01', endDate: '2026-08-09', updatedAt: '2026-08-12T00:00:00Z', placements: [{ id: 'new-p' }] };
  const rows = hooks.dedupeSchedulesByDateRange([older, newer]);
  assert.equal(rows.length, 1);
  assert.equal(rows[0].id, 'new');
  assert.equal(rows[0].placements.length, 1);
  assert.equal(rows[0].placements[0].id, 'new-p');
});
