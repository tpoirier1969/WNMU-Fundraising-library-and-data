      state.weatherByDate.set(dateKey, {
        stations: rows.length,
        high: average('high'),
        low: average('low'),
        precip: average('precip'),
        windowTemp: average('windowTemp'),
        windowPrecip: average('windowPrecip'),
        wetStations: rows.filter((row) => Number(row.windowPrecip || 0) >= 0.01).length,
        snowStations: rows.filter((row) => Number(row.snow || 0) > 0).length,
        windowLabel: weatherWindowLabel(dateKey)
      });
    });
  }''', async_fn=True)

