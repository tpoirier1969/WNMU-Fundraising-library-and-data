name: Temporary v0.22.95 imported-history correction

on:
  push:
    branches:
      - fix-imported-history-authority-v02295

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source corrections and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement, got {count}')
              return updated

          comparison_path = Path('assets/js/ui-fundraiser-comparison.js')
          comparison = comparison_path.read_text()

          imported_block = r'''  function importedStartMinutes(row = {}) {
            const raw = text(row.air_time || '');
            const match = raw.match(/^(\d{1,2}):(\d{2})/);
            if (match) return (Number(match[1]) * 60) + Number(match[2]);
            const date = new Date(row.aired_at || '');
            return Number.isNaN(date.getTime()) ? null : (date.getHours() * 60) + date.getMinutes();
          }

          function importedTitle(row = {}) {
            return text(row.imported_program_title || row.program_title || row.title || row.matched_library_title || '');
          }

          function libraryRowForImportedRow(row = {}) {
            const id = text(row.pledge_program_id || row.manual_match_program_id || row.program_id || '');
            if (id && state.libraryById.has(id)) return state.libraryById.get(id);
            const nola = nolaKey(row.nola_code || row.nola || row.program_nola || '');
            const title = lookupKey(row.matched_library_title || row.program_title || row.title || row.imported_program_title || '');
            if (nola) {
              const matches = state.libraryByNola.get(nola) || [];
              if (title) {
                const exact = matches.find((candidate) => lookupKey(candidate.title) === title);
                if (exact) return exact;
              }
              if (matches.length === 1) return matches[0];
            }
            return title ? state.libraryByTitle.get(title) || null : null;
          }

          function scheduleSeasonYear(schedule = {}) {
            const counts = new Map();
            (schedule.placements || []).forEach((placement) => {
              const date = parseDate(placement?.dateKey || placement?.date_key || '');
              if (!date) return;
              const season = seasonForDate(date);
              const year = date.getFullYear();
              if (!season || !year) return;
              const key = `${season}|${year}`;
              counts.set(key, (counts.get(key) || 0) + 1);
            });
            if (counts.size) {
              const [key] = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))[0];
              const [season, year] = key.split('|');
              return { season, year: Number(year) };
            }
            const title = text(schedule.title || '');
            const titleSeason = SEASONS.find((season) => new RegExp(`\\b${season}\\b`, 'i').test(title)) || '';
            const titleYearMatch = title.match(/\\b(20\\d{2})\\b/);
            if (titleSeason && titleYearMatch) return { season: titleSeason, year: Number(titleYearMatch[1]) };
            const start = parseDate(schedule.startDate || schedule.start_date || '');
            return {
              season: text(schedule.season || seasonForDate(start)),
              year: Number(schedule.year || start?.getFullYear() || 0)
            };
          }

          function importedRowsForSchedule(schedule = {}) {
            const identity = scheduleSeasonYear(schedule);
            if (!identity.season || !identity.year) return [];
            return (state.airings || []).filter((row) => {
              const date = parseDate(importedDateKey(row));
              return Boolean(date && seasonForDate(date) === identity.season && date.getFullYear() === identity.year);
            });
          }

          function importedUseKey(row = {}) {
            return text(row.row_hash || row.id || `${importedDateKey(row)}|${importedStartMinutes(row) ?? ''}|${importedTitle(row)}|${row.dollars ?? row.contribution_amount ?? ''}`);
          }

          function importedDateHasResults(dateKey = '', importedRows = []) {
            const wanted = text(dateKey);
            return Boolean(wanted && (importedRows || []).some((row) => importedDateKey(row) === wanted));
          }

          function placementStartMinutes(placement = {}) {
            const value = Number(placement.startMinutes ?? placement.start_minutes ?? placement.start);
            return Number.isFinite(value) ? value : null;
          }

          function identityMatches(row = {}, placement = {}, lib = null) {
            const placementId = text(placement.programId || placement.program_id || lib?.id || '');
            const rowId = text(row.program_id || row.pledge_program_id || row.manual_match_program_id || '');
            if (placementId && rowId && placementId === rowId) return true;

            const placementNola = nolaKey(lib?.nola_code || placement.nolaCode || placement.nola_code || placement.nola || '');
            const rowNola = nolaKey(row.nola_code || row.nola || row.program_nola || '');
            if (placementNola && rowNola && placementNola === rowNola) return true;

            const placementTitle = lookupKey(lib?.title || placement.programTitle || placement.program_title || placement.title || '');
            const rowTitle = lookupKey(row.matched_library_title || row.program_title || row.title || row.imported_program_title || '');
            return Boolean(placementTitle && rowTitle && placementTitle === rowTitle);
          }

          function importedRowForPlacement(placement = {}, used = new Set(), importedRows = state.airings || []) {
            const available = (importedRows || []).filter((row) => !used.has(importedUseKey(row)));
            const hash = text(placement.sourceAiringHash || placement.source_airing_hash || '');
            if (hash) {
              const direct = available.find((row) => text(row.row_hash) === hash);
              if (direct) return direct;
            }

            const dateKey = text(placement.dateKey || placement.date_key || '');
            if (!dateKey) return null;
            const start = placementStartMinutes(placement);
            const lib = libraryRowForPlacement(placement);
            const sameDay = available.filter((row) => importedDateKey(row) === dateKey);
            if (Number.isFinite(start)) {
              const exactTime = sameDay.filter((row) => importedStartMinutes(row) === start);
              const exactIdentity = exactTime.filter((row) => identityMatches(row, placement, lib));
              if (exactIdentity.length === 1) return exactIdentity[0];
              if (exactIdentity.length > 1) return null;
              if (exactTime.length === 1) return exactTime[0];
              if (exactTime.length > 1) return null;
            }
            const sameDayIdentity = sameDay.filter((row) => identityMatches(row, placement, lib));
            return sameDayIdentity.length === 1 ? sameDayIdentity[0] : null;
          }

          function placementResult(placement = {}, used = new Set(), importedRows = state.airings || []) {
            if (placement?.isNonPledge) return { known: false, dollars: 0, pledges: 0, source: 'non-pledge' };

            const imported = importedRowForPlacement(placement, used, importedRows);
            if (imported) {
              const usedKey = importedUseKey(imported);
              if (usedKey) used.add(usedKey);
              return {
                known: true,
                dollars: Number(imported.dollars ?? imported.contribution_amount ?? 0) || 0,
                pledges: Number(imported.pledge_count || 0) || 0,
                source: 'report',
                importedRow: imported,
                actualDateKey: importedDateKey(imported),
                actualStartMinutes: importedStartMinutes(imported),
                actualTitle: importedTitle(imported)
              };
            }

            const attachedRaw = placement.importedBroadcastDollars;
            const attached = attachedRaw === '' || attachedRaw == null ? null : Number(attachedRaw);
            if (Number.isFinite(attached)) {
              return {
                known: true,
                dollars: attached,
                pledges: Number(placement.importedPledges || placement.importedBroadcastPledges || 0) || 0,
                source: 'attached-report'
              };
            }

            const dateKey = text(placement.dateKey || placement.date_key || '');
            if (importedDateHasResults(dateKey, importedRows)) {
              return {
                known: true,
                dollars: 0,
                pledges: 0,
                source: 'report-day-zero',
                implicitZero: true
              };
            }

            if (placement?.manualResultRecorded) {
              return {
                known: true,
                dollars: Number(placement.manualBroadcastDollars || 0) || 0,
                pledges: Number(placement.manualPledgeCount || 0) || 0,
                source: 'manual'
              };
            }

            return { known: false, dollars: 0, pledges: 0, source: 'none' };
          }
'''
          imported_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in imported_block.splitlines())
          comparison = sub_once(
              comparison,
              r"  function importedStartMinutes\(row = \{\}\) \{.*?(?=\n  function programMinutes)",
              imported_block.rstrip(),
              'comparison imported-history block'
          )

          analyze_block = r'''  function analyzeSchedule(schedule = {}) {
            const used = new Set();
            const importedRows = importedRowsForSchedule(schedule);
            const topics = new Map();
            const times = new Map();
            const placementRows = [];
            let scheduled = 0;
            let completed = 0;
            let scheduledMinutes = 0;
            let attributableDollars = 0;
            let attributablePledges = 0;

            (schedule.placements || []).forEach((placement) => {
              if (!placement || placement.isNonPledge) return;
              const scheduledTitle = text(placement.programTitle || placement.program_title || placement.title || '');
              if (!scheduledTitle && !placement.programId) return;
              const scheduledLib = libraryRowForPlacement(placement) || {};
              const minutes = programMinutes(placement);
              const scheduledStartMinutes = placementStartMinutes(placement);
              const result = placementResult(placement, used, importedRows);
              const importedLib = result.importedRow ? libraryRowForImportedRow(result.importedRow) || {} : {};
              const lib = Object.keys(importedLib).length ? importedLib : scheduledLib;
              const startMinutes = Number.isFinite(result.actualStartMinutes) ? result.actualStartMinutes : scheduledStartMinutes;
              const dateKey = text(result.actualDateKey || placement.dateKey || placement.date_key || '');
              const displayTitle = text(result.actualTitle || lib.title || scheduledTitle || 'Untitled program');
              const topic = text(lib.topic_primary || result.importedRow?.topic_primary || result.importedRow?.topic || placement.topicPrimary || placement.topic_primary || 'Uncategorized') || 'Uncategorized';
              const secondary = text(lib.topic_secondary || result.importedRow?.topic_secondary || result.importedRow?.secondary_topic || placement.topicSecondary || placement.topic_secondary || 'Unspecified') || 'Unspecified';
              const daypart = daypartLabel(startMinutes);

              scheduled += 1;
              scheduledMinutes += minutes;
              if (result.known) {
                completed += 1;
                attributableDollars += result.dollars;
                attributablePledges += result.pledges;
              }
              addGroup(topics, topic, minutes, result);
              addGroup(times, timeBucketLabel(startMinutes), minutes, result);
              placementRows.push({
                dateKey,
                startMinutes,
                title: displayTitle,
                plannedTitle: scheduledTitle,
                topic,
                secondary,
                daypart,
                minutes,
                known: Boolean(result.known),
                dollars: Number(result.dollars || 0),
                pledges: Number(result.pledges || 0),
                source: result.source || 'none'
              });
            });

            placementRows.sort((a, b) => text(a.dateKey).localeCompare(text(b.dateKey)) || Number(a.startMinutes || 0) - Number(b.startMinutes || 0));

            const meta = schedule.meta || {};
            const reportedBroadcast = Number(meta.reportedBroadcastTotalDollars ?? meta.importedBroadcastTotalDollars ?? meta.importedProgramSpecificBroadcastTotalDollars);
            const importedBroadcast = importedRows.reduce((sum, row) => sum + (Number(row.dollars ?? row.contribution_amount ?? 0) || 0), 0);
            const broadcastDollars = importedRows.length
              ? importedBroadcast
              : (Number.isFinite(reportedBroadcast) ? reportedBroadcast : attributableDollars);
            const onlineDollars = Number(schedule.onlineDollars || 0) || 0;
            const mailDollars = Number(schedule.mailDollars || 0) || 0;
            const onlineTracked = onlineDollars > 0;
            const mailTracked = mailDollars > 0;
            const recordedTotal = broadcastDollars + onlineDollars + mailDollars;

            return {
              schedule,
              scheduled,
              completed,
              scheduledMinutes,
              attributableDollars,
              attributablePledges,
              broadcastDollars,
              unattributedBroadcast: broadcastDollars - attributableDollars,
              onlineDollars,
              mailDollars,
              onlineTracked,
              mailTracked,
              recordedTotal,
              topics,
              times,
              placementRows,
              importedRows
            };
          }
'''
          analyze_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in analyze_block.splitlines())
          comparison = sub_once(
              comparison,
              r"  function analyzeSchedule\(schedule = \{\}\) \{.*?(?=\n  function analysisForSchedule)",
              analyze_block.rstrip(),
              'comparison analyzeSchedule'
          )

          anchor_block = r'''  function firstSaturdayAnchor(analysis = {}) {
            const importedDays = importedRowsForSchedule(analysis?.schedule || {})
              .map((row) => parseDate(importedDateKey(row)))
              .filter((date) => date instanceof Date && !Number.isNaN(date.getTime()))
              .sort((a, b) => a - b);
            const placementDays = calendarDays(analysis)
              .map((day) => day?.date || parseDate(day?.dateKey))
              .filter((date) => date instanceof Date && !Number.isNaN(date.getTime()))
              .sort((a, b) => a - b);
            const observedDays = importedDays.length ? importedDays : placementDays;
            const firstObservedSaturday = observedDays.find((date) => date.getDay() === 6);
            if (firstObservedSaturday) {
              return new Date(firstObservedSaturday.getFullYear(), firstObservedSaturday.getMonth(), firstObservedSaturday.getDate());
            }
            const startDate = observedDays[0] || parseDate(analysis?.schedule?.startDate);
            if (!startDate) return null;
            const anchor = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
            const weekday = anchor.getDay();
            const daysToSaturday = weekday === 0 ? -1 : (6 - weekday + 7) % 7;
            anchor.setDate(anchor.getDate() + daysToSaturday);
            return anchor;
          }
'''
          anchor_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in anchor_block.splitlines())
          comparison = sub_once(
              comparison,
              r"  function firstSaturdayAnchor\(analysis = \{\}\) \{.*?(?=\n  function localDateSerial)",
              anchor_block.rstrip(),
              'comparison firstSaturdayAnchor'
          )
          comparison = comparison.replace(
              'Days are aligned by fundraiser sequence, not by calendar date: first Saturday with first Saturday, first Sunday with first Sunday, second Saturday with second Saturday, and so on. Day 0 is the first Saturday; only the Friday immediately before it can appear as Day -1. Extra tail days that fall outside the shared comparison window are omitted.',
              'Imported fundraiser history establishes the actual historical calendar whenever it exists. Days are then aligned by fundraiser sequence, not by calendar date: first Saturday with first Saturday, first Sunday with first Sunday, second Saturday with second Saturday, and so on. Day 0 is the first Saturday; only the Friday immediately before it can appear as Day -1. Extra tail days that fall outside the shared comparison window are omitted.'
          )
          comparison_path.write_text(comparison)

          analytics_path = Path('assets/js/ui-analytics.js')
          analytics = analytics_path.read_text()

          lookup_block = r'''  function buildAiringRecordLookup(airingRecords = []) {
            const maps = { hash: new Map(), exact: new Map(), dateTime: new Map(), dateProgram: new Map(), dateNola: new Map(), dateTitle: new Map() };
            const push = (map, key, record) => {
              if (!key) return;
              if (!map.has(key)) map.set(key, []);
              map.get(key).push(record);
            };
            airingRecords.forEach((record) => {
              const hash = text(record.sourceAiringHash || record.row?.row_hash || '');
              if (hash) maps.hash.set(hash, record);
              const dateKey = text(record.dateKey || '');
              if (!dateKey) return;
              if (Number.isFinite(record.startMinutes)) push(maps.dateTime, `${dateKey}|${record.startMinutes}`, record);
              const keys = [
                text(record.programOpenId || ''),
                text(record.programId || ''),
                record.nola ? nolaKey(record.nola) : '',
                lookupKey(record.title),
                lookupKey(record.importedTitle)
              ].filter(Boolean);
              keys.forEach((key) => {
                if (Number.isFinite(record.startMinutes)) push(maps.exact, `${dateKey}|${key}|${record.startMinutes}`, record);
                push(maps.dateProgram, `${dateKey}|${key}`, record);
                push(maps.dateNola, `${dateKey}|${key}`, record);
                push(maps.dateTitle, `${dateKey}|${key}`, record);
              });
            });
            return maps;
          }
'''
          lookup_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in lookup_block.splitlines())
          analytics = sub_once(
              analytics,
              r"  function buildAiringRecordLookup\(airingRecords = \[\]\) \{.*?(?=\n  function findAiringForSchedulePlacement)",
              lookup_block.rstrip(),
              'analytics buildAiringRecordLookup'
          )

          match_block = r'''  function findAiringForSchedulePlacement({ placement = {}, dateKey = '', startMinutes = NaN, pid = '', nola = '', title = '', airingLookup }) {
            const hash = text(placement.sourceAiringHash || placement.source_airing_hash || '');
            if (hash && airingLookup.hash.has(hash)) return airingLookup.hash.get(hash);
            const keys = [pid, nola, title, lookupKey(placement.programTitle || placement.program_title || placement.title || placement.name || '')].filter(Boolean);
            const exactCandidates = [];
            const sameDayCandidates = [];
            keys.forEach((key) => {
              if (Number.isFinite(startMinutes)) exactCandidates.push(...(airingLookup.exact.get(`${dateKey}|${key}|${startMinutes}`) || []));
              sameDayCandidates.push(...(airingLookup.dateProgram.get(`${dateKey}|${key}`) || []));
              sameDayCandidates.push(...(airingLookup.dateNola.get(`${dateKey}|${key}`) || []));
              sameDayCandidates.push(...(airingLookup.dateTitle.get(`${dateKey}|${key}`) || []));
            });
            const uniqueRows = (rows) => {
              const unique = [];
              const seen = new Set();
              rows.forEach((record) => {
                const id = text(record.id || record.sourceAiringHash || `${record.dateKey}|${record.startMinutes}|${record.title}|${record.dollars}`);
                if (!id || seen.has(id)) return;
                seen.add(id);
                unique.push(record);
              });
              return unique;
            };
            const exact = uniqueRows(exactCandidates);
            if (exact.length === 1) return exact[0];
            if (exact.length > 1) return null;
            if (Number.isFinite(startMinutes)) {
              const exactTime = uniqueRows(airingLookup.dateTime?.get(`${dateKey}|${startMinutes}`) || []);
              if (exactTime.length === 1) return exactTime[0];
              if (exactTime.length > 1) return null;
            }
            const sameDay = uniqueRows(sameDayCandidates);
            return sameDay.length === 1 ? sameDay[0] : null;
          }
'''
          match_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in match_block.splitlines())
          analytics = sub_once(
              analytics,
              r"  function findAiringForSchedulePlacement\(\{ placement = \{\}, dateKey = '', startMinutes = NaN, pid = '', nola = '', title = '', airingLookup \}\) \{.*?(?=\n  function buildScheduleRecords)",
              match_block.rstrip(),
              'analytics findAiringForSchedulePlacement'
          )

          schedule_block = r'''  function buildScheduleRecords(schedules = [], libraryRows = [], airingRecords = []) {
            const indexes = buildLibraryIndexes(libraryRows);
            const airingLookup = buildAiringRecordLookup(airingRecords);
            const importedDates = new Set(airingRecords.map((record) => text(record.dateKey || '')).filter(Boolean));
            const out = [];
            const usedAiringDollarMatches = new Set();
            const diagnostics = { schedulePlacements: 0, livePlacements: 0, liveRows: 0, liveDollars: 0, unmatchedLivePlacements: 0, implicitZeroRows: 0 };
            schedules.forEach((schedule) => {
              (schedule.placements || []).forEach((placement) => {
                diagnostics.schedulePlacements += 1;
                const liveFlag = placementLive(placement);
                if (liveFlag) diagnostics.livePlacements += 1;
                const scheduledDateKey = text(placement.dateKey || placement.date_key || '');
                const scheduledDate = parseLocalDate(scheduledDateKey);
                const scheduledSeason = pledgeSeason(scheduledDate);
                const scheduledStartMinutes = Number(placement.startMinutes ?? placement.start_minutes ?? placement.start ?? NaN);
                const scheduledEndMinutes = Number(placement.endMinutes ?? placement.end_minutes ?? placement.end ?? NaN);
                const scheduledDurationMinutes = Number(firstNonEmpty(placement.programMinutes, placement.program_minutes, placement.durationMinutes, placement.duration_minutes, null)) || durationFromTimes(scheduledStartMinutes, scheduledEndMinutes);
                if (!scheduledDateKey || !scheduledDate || !scheduledSeason) return;
                const hash = text(placement.sourceAiringHash || placement.source_airing_hash || '');
                const rawPid = text(firstNonEmpty(placement.programId, placement.program_id, ''));
                const rawNola = nolaKey(firstNonEmpty(placement.nolaCode, placement.nola_code, placement.nola, placement.program_nola, ''));
                const rawTitleText = text(firstNonEmpty(placement.programTitle, placement.program_title, placement.title, placement.name, ''));
                const rawTitle = lookupKey(rawTitleText);
                const initialLib = indexes.byId.get(rawPid) || resolveLibraryByNola(indexes, rawNola, rawTitle) || indexes.byTitle.get(rawTitle) || {};
                const initialPid = text(firstNonEmpty(rawPid, initialLib.id, ''));
                const initialNola = nolaKey(firstNonEmpty(initialLib.nola_code, rawNola, ''));
                const initialTitle = lookupKey(firstNonEmpty(initialLib.title, rawTitleText, ''));
                const matchedCandidate = findAiringForSchedulePlacement({ placement, dateKey: scheduledDateKey, startMinutes: scheduledStartMinutes, pid: initialPid, nola: initialNola, title: initialTitle, airingLookup });
                const matchedDollarKey = matchedCandidate ? text(firstNonEmpty(
                  matchedCandidate.sourceAiringHash,
                  matchedCandidate.id,
                  `${matchedCandidate.dateKey || scheduledDateKey}|${matchedCandidate.startMinutes ?? ''}|${lookupKey(matchedCandidate.title || '')}|${matchedCandidate.dollars ?? ''}`
                )) : '';
                const canUseMatchedDollars = matchedCandidate && (matchedDollarKey ? !usedAiringDollarMatches.has(matchedDollarKey) : true);
                const matched = canUseMatchedDollars ? matchedCandidate : null;
                if (liveFlag && !matched) diagnostics.unmatchedLivePlacements += 1;

                const attachedImportedDollars = placement.importedBroadcastDollars === '' || placement.importedBroadcastDollars == null
                  ? null
                  : Number(placement.importedBroadcastDollars);
                const attachedImportedPledges = firstNonEmpty(placement.importedPledges, placement.importedBroadcastPledges, null);
                const savedDollars = firstNonEmpty(
                  placement.manualResultRecorded ? Number(placement.manualBroadcastDollars || 0) : null,
                  placement.actualDollars,
                  placement.broadcastDollars,
                  placement.dollars,
                  placement.pledgeDollars,
                  null
                );
                const savedPledges = firstNonEmpty(
                  placement.manualResultRecorded ? Number(placement.manualPledgeCount || 0) : null,
                  placement.pledges,
                  placement.pledgeCount,
                  null
                );
                const sameDayReported = importedDates.has(scheduledDateKey);
                let resultSource = 'none';
                let dollars = 0;
                let pledges = 0;
                if (matched) {
                  resultSource = 'report';
                  dollars = Number(matched.dollars || 0) || 0;
                  pledges = Number(matched.pledges || 0) || 0;
                  if (matchedDollarKey) usedAiringDollarMatches.add(matchedDollarKey);
                } else if (Number.isFinite(attachedImportedDollars)) {
                  resultSource = 'attached-report';
                  dollars = attachedImportedDollars;
                  pledges = Number(attachedImportedPledges || 0) || 0;
                } else if (sameDayReported) {
                  resultSource = 'report-day-zero';
                  dollars = 0;
                  pledges = 0;
                  diagnostics.implicitZeroRows += 1;
                } else if (savedDollars != null) {
                  resultSource = placement.manualResultRecorded ? 'manual' : 'saved-result';
                  dollars = Number(savedDollars || 0) || 0;
                  pledges = Number(savedPledges || 0) || 0;
                } else {
                  return;
                }

                const pid = text(firstNonEmpty(matched?.programOpenId, matched?.programId, placement.programId, placement.program_id, initialLib.id, ''));
                const matchedTitleKey = lookupKey(firstNonEmpty(matched?.title, matched?.importedTitle, ''));
                const lib = (matched?.programOpenId ? indexes.byId.get(text(matched.programOpenId)) : null)
                  || (matched?.programId ? indexes.byId.get(text(matched.programId)) : null)
                  || (matched?.nola ? resolveLibraryByNola(indexes, nolaKey(matched.nola), matchedTitleKey) : null)
                  || indexes.byId.get(pid)
                  || resolveLibraryByNola(indexes, initialNola, initialTitle)
                  || indexes.byTitle.get(matchedTitleKey)
                  || indexes.byTitle.get(rawTitle)
                  || initialLib
                  || {};
                const title = text(firstNonEmpty(matched?.title, lib.title, rawTitleText, 'Untitled'));
                const nonSpecific = isNonSpecificPledgeBucket(title, lib.nola_code, matched?.nola, placement.nolaCode, placement.nola_code, placement.nola);
                const rawTopic = nonSpecific ? 'Non-Specific' : text(firstNonEmpty(matched?.topic, lib.topic_primary, ''));
                const topicMissing = !nonSpecific && isMissingTopic(rawTopic);
                const actualDateKey = text(firstNonEmpty(matched?.dateKey, scheduledDateKey));
                const actualDate = matched?.date instanceof Date && !Number.isNaN(matched.date.getTime()) ? matched.date : (parseLocalDate(actualDateKey) || scheduledDate);
                const actualStartMinutes = Number.isFinite(Number(matched?.startMinutes)) ? Number(matched.startMinutes) : scheduledStartMinutes;
