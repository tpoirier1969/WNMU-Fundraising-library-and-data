name: Configure analytics filter cards

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  update:
    if: startsWith(github.event.issue.title, '[internal] apply analytics filter redesign')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Complete multi-year patch coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_analytics_filter_redesign.py')
          s = p.read_text(encoding='utf-8')
          anchor = "replace_once(\n    \"      if (question.useYear !== false && state.year !== 'all' && String(record.year) !== String(state.year)) return false;\",\n    \"      if (question.useYear !== false && !yearFilterMatches(record.year)) return false;\",\n    'filtered record year matching'\n)\n"
          addition = anchor + "replace_once(\n    \"    if (state.year !== 'all' && String(record.year) !== String(state.year)) return false;\",\n    \"    if (!yearFilterMatches(record.year)) return false;\",\n    'live comparison year matching'\n)\nreplace_once(\n    \"    if (selectedTopics.length && !selectedTopics.includes(record.topic)) return false;\\n    if (state.season !== 'all' && record.season !== state.season) return false;\",\n    \"    if (selectedTopics.length && !selectedTopics.includes(record.topic)) return false;\\n    if (state.secondaryTopicFilter !== 'all' && (record.secondaryTopic || '') !== state.secondaryTopicFilter) return false;\\n    if (state.season !== 'all' && record.season !== state.season) return false;\",\n    'live comparison secondary topic filter'\n)\nreplace_once(\n    \"    if (state.advancedWeekpart !== 'all' && record.weekpart !== state.advancedWeekpart) return false;\\n    return true;\\n  }\\n\\n  function liveCandidateBaseKey\",\n    \"    if (state.advancedWeekpart !== 'all' && record.weekpart !== state.advancedWeekpart) return false;\\n    if (!durationFilterMatches(record)) return false;\\n    return true;\\n  }\\n\\n  function liveCandidateBaseKey\",\n    'live comparison duration filter'\n)\n"
          if anchor not in s:
              raise SystemExit('Could not locate year-conversion anchor in patch script')
          p.write_text(s.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Apply analytics filter redesign
        run: python .github/scripts/apply_analytics_filter_redesign.py

      - name: Validate source
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          text = Path('pledge-performance-lab-shell.html').read_text(encoding='utf-8')
          version = json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert version['appVersion'] == '0.22.74'
          assert '<h3>Required filters</h3>' in text
          assert '<h3>Refine results</h3>' in text
          assert 'id="year-options"' in text
          assert 'All except ${omitted.join' in text
          assert 'id="adv-duration"' in text
          assert 'const FILTER_PLANS = {' in text
          assert "startTimes: {\n      required: ['season', 'topic']" in text
          assert 'All seasons is a valid view' in text
          assert 'Exploratory result:' in text
          assert 'state.secondaryTopicFilter' in text
          assert not re.search(r'state\.year\b', text)
          assert not re.search(r'dom\.year\b', text)
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          Path('/tmp/analytics-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/analytics-inline.js

      - name: Commit source and remove temporary tooling
        shell: bash
        run: |
          rm -f .github/workflows/setup-analytics-filter-cards.yml
          rm -f .github/workflows/live-starttime-audit.yml
          rm -f .github/scripts/apply_analytics_filter_redesign.py
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "Guide analytics filters by question"
          git push origin HEAD:main
