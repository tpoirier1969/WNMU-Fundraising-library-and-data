name: v0.22.138 chart spacing edit

on:
  push:
    branches:
      - fix/report-chart-spacing-v138

permissions:
  contents: write

jobs:
  apply-chart-spacing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-chart-spacing-v138
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply chart spacing changes
        run: |
          python .github/scripts/apply_v138_chart_spacing.py
          node --check assets/js/one-sheet-reports.js
          node --test tests/*.test.mjs
      - name: Commit chart spacing changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-reports.js assets/one-sheet-reports.css reports.html version.json tests
          git diff --cached --check
          git commit -m "v0.22.138 improve historical chart spacing and event leaders"
          git push origin HEAD:fix/report-chart-spacing-v138
