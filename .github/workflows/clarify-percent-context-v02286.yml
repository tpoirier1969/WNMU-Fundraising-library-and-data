name: Clarify percent context v0.22.86

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'clarify-percent-context-v02286'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clarify large changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('assets/js/ui-fundraiser-comparison.js')
          src = path.read_text()

          old = """      const driveChange = percentChange(current.scheduledMinutes, base.scheduledMinutes);\n      const topicChange = percentChange(row.current.minutes, row.baseline.minutes);\n      let read = 'Fundraiser length and topic allocation both need inspection.';"""
          new = """      const driveDeltaMinutes = Number(current.scheduledMinutes || 0) - Number(base.scheduledMinutes || 0);\n      const topicDeltaMinutes = Number(row.current.minutes || 0) - Number(row.baseline.minutes || 0);\n      const topicRatio = Number(row.baseline.minutes || 0) > 0 ? Number(row.current.minutes || 0) / Number(row.baseline.minutes || 0) : null;\n      const signedHoursDelta = (minutes) => {\n        const numeric = Number(minutes || 0);\n        return `${numeric > 0 ? '+' : numeric < 0 ? '-' : ''}${hoursLabel(Math.abs(numeric))}`;\n      };\n      const topicScaleRead = Number.isFinite(topicRatio) && topicRatio >= 1.8\n        ? ` · ${Math.round(topicRatio * 10) / 10}× as much`\n        : '';\n      let read = 'Fundraiser length and topic allocation both need inspection.';"""
          if src.count(old) != 1:
              raise SystemExit(f'change math block expected once, found {src.count(old)}')
          src = src.replace(old, new, 1)

          old = """<span>Fundraiser ${escapeHtml(hoursLabel(base.scheduledMinutes))} → ${escapeHtml(hoursLabel(current.scheduledMinutes))}${Number.isFinite(driveChange) ? ` · ${escapeHtml(signedPercent(driveChange))}` : ''}</span><span>Topic ${escapeHtml(hoursLabel(row.baseline.minutes))} → ${escapeHtml(hoursLabel(row.current.minutes))}${Number.isFinite(topicChange) ? ` · ${escapeHtml(signedPercent(topicChange))}` : ''}</span><span>Schedule share ${Math.round(baseShare)}% → ${Math.round(currentShare)}% · ${shareDelta > 0 ? '+' : ''}${shareDelta.toFixed(1)} pts</span>"""
          new = """<span>Fundraiser ${escapeHtml(hoursLabel(base.scheduledMinutes))} → ${escapeHtml(hoursLabel(current.scheduledMinutes))} · ${escapeHtml(signedHoursDelta(driveDeltaMinutes))}</span><span>Topic ${escapeHtml(hoursLabel(row.baseline.minutes))} → ${escapeHtml(hoursLabel(row.current.minutes))} · ${escapeHtml(signedHoursDelta(topicDeltaMinutes))}${escapeHtml(topicScaleRead)}</span><span>Schedule share ${Math.round(baseShare)}% → ${Math.round(currentShare)}% · ${shareDelta > 0 ? '+' : ''}${shareDelta.toFixed(1)} pts</span>"""
          if src.count(old) != 1:
              raise SystemExit(f'context chips expected once, found {src.count(old)}')
          src = src.replace(old, new, 1)
          path.write_text(src)

          vpath = Path('version.json')
          data = json.loads(vpath.read_text())
          data['appVersion'] = '0.22.86'
          data['releasedAt'] = '2026-08-21'
          vpath.write_text(json.dumps(data, separators=(',', ':')))
          PY
          node --check assets/js/ui-fundraiser-comparison.js
          git diff --check
          grep -q "7.2× as much\|× as much" assets/js/ui-fundraiser-comparison.js
          grep -q '"appVersion":"0.22.86"' version.json
          rm -f .github/workflows/clarify-percent-context-v02286.yml
          git config user.name "Tod"
          git config user.email "tpoirier@nmu.edu"
          git add -A
          git commit -m "Clarify large fundraiser hour changes"
          git push origin HEAD:${{ github.head_ref }}
