name: Trigger comparison v0.22.83

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-comparison-083.yml"

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run staged comparison update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/admin-comparison-public-channel-fix.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == 'run: |') + 1
          script = '\n'.join((line[10:] if line.startswith('          ') else line) for line in workflow[start:]) + '\n'
          Path('/tmp/apply-comparison.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-comparison.sh
          git pull --ff-only origin main
          rm -f .github/workflows/trigger-comparison-083.yml
          git add .github/workflows/trigger-comparison-083.yml
          git config user.name 'Tod'
          git config user.email 'tpoirier@nmu.edu'
          git commit -m 'Remove comparison release trigger'
          git push origin main
