name: Fix comparison empty weather states

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix-comparison-empty-weather-v02291b'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and validate Comparison Lab cleanup
        shell: bash
        run: |
          if [ ! -f .github/patches/fix-comparison-empty-weather-v02291.py ]; then
            echo "Patch already applied."
            exit 0
          fi
          python .github/patches/fix-comparison-empty-weather-v02291.py
          node --check assets/js/ui-fundraiser-comparison.js
          node --test tests/fundraiser-comparison.test.mjs
          git diff --check
          git rm -f .github/patches/fix-comparison-empty-weather-v02291.py .comparison-empty-weather-trigger
          git add assets/js/ui-fundraiser-comparison.js tests/fundraiser-comparison.test.mjs version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean up empty comparison and future weather states"
          git push origin HEAD:${{ github.head_ref }}
