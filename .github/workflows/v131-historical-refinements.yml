name: v0.22.131 historical refinements

on:
  push:
    branches:
      - release/v0.22.131-historical-refinements

permissions:
  contents: write

jobs:
  finalize-and-test:
    if: github.event.head_commit.message != 'v0.22.131 finalize historical report refinements'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.22.131-historical-refinements
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix current-fundraiser corresponding-day baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/js/one-sheet-reports.js')
          s = p.read_text()
          old = """  function fundraiserVisualOverview(analysis, historical = []) {\n    const days = A.calendarDays(analysis);\n    const corresponding = currentCorrespondingDayComparisonData(analysis, baseline);\n"""
          new = """  function fundraiserVisualOverview(analysis, historical = []) {\n    const days = A.calendarDays(analysis);\n    const corresponding = currentCorrespondingDayComparisonData(analysis, historical);\n"""
          if old not in s:
              raise SystemExit('fundraiser corresponding-day baseline target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/historical-refinements-v131.test.mjs')
          ts = t.read_text()
          marker = "assert.match(source, /Corresponding fundraiser days vs history/);\n"
          addition = marker + "assert.match(source, /currentCorrespondingDayComparisonData\\(analysis, historical\\)/);\nassert.doesNotMatch(source, /currentCorrespondingDayComparisonData\\(analysis, baseline\\);\\n    const topics/);\n"
          if marker not in ts:
              raise SystemExit('v131 test insertion point not found')
          t.write_text(ts.replace(marker, addition, 1))
          PY
      - name: Syntax check report code
        run: node --check assets/js/one-sheet-reports.js
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Commit final generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/one-sheet-reports.js tests/historical-refinements-v131.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "v0.22.131 finalize historical report refinements"
          git push origin HEAD:release/v0.22.131-historical-refinements
