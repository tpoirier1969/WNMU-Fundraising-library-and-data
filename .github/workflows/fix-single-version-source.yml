name: Fix single version source

on:
  push:
    branches:
      - fix-single-version-source-20260812

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-single-version-source-20260812
          fetch-depth: 0

      - name: Make version.json authoritative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          # index.html: load the application version from version.json at runtime.
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "    const VERSION='0.22.57', LABEL=`v${VERSION}`, status=document.getElementById('split-boot-status');\n    const setStatus=(message)=>{if(status)status.textContent=message};"
          new = """    const status=document.getElementById('split-boot-status');
              const setStatus=(message)=>{if(status)status.textContent=message};
              let VERSION='', LABEL='';
              try {
                setStatus('Checking application version…');
                const versionResponse=await fetch(`version.json?_=${Date.now()}`,{cache:'no-store'});
                if(!versionResponse.ok)throw new Error(`Could not load version.json (${versionResponse.status}).`);
                const versionPayload=await versionResponse.json();
                VERSION=String(versionPayload?.appVersion||versionPayload?.version||'').trim().replace(/^v/i,'');
                if(!VERSION)throw new Error('version.json does not contain an appVersion.');
                LABEL=`v${VERSION}`;
              } catch(error) {
                console.error(error);
                setStatus(`The Pledge Program Library could not determine its version: ${error.message||error}`);
                return;
              }"""
          if old not in text:
              raise SystemExit('index version declaration anchor not found')
          text = text.replace(old, new, 1)

          old_override = "if(core){const override=doc.createElement('script');override.textContent=`window.addEventListener('DOMContentLoaded',()=>{if(window.PledgeLib?.constants)window.PledgeLib.constants.APP_VERSION='${LABEL}'})`;core.after(override)}"
          new_override = "if(core){const seed=doc.createElement('script');seed.textContent=`window.__PLEDGE_APP_VERSION__=${JSON.stringify(LABEL)};`;core.before(seed)}"
          if old_override not in text:
              raise SystemExit('index core version override anchor not found')
          text = text.replace(old_override, new_override, 1)
          path.write_text(text, encoding='utf-8')

          # core.js: consume the version injected by index.html instead of owning another revision string.
          path = Path('assets/js/core.js')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r"APP_VERSION:\s*'v\d+\.\d+\.\d+',", "APP_VERSION: String(window.__PLEDGE_APP_VERSION__ || '').trim(),", text, count=1)
          if count != 1:
              raise SystemExit(f'core APP_VERSION replacements: {count}')
          path.write_text(text, encoding='utf-8')

          # config.js should not carry an application revision at all.
          path = Path('config.js')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r"^\s*APP_VERSION:\s*'v?\d+\.\d+\.\d+',\s*\n", '', text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit(f'config APP_VERSION removals: {count}')
          path.write_text(text, encoding='utf-8')

          # app-shell.html is a version-neutral template. index.html supplies cache keys and visible labels.
          path = Path('app-shell.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'\?v=\d+\.\d+\.\d+', '', text)
          text = re.sub(r'<title>WNMU Pledge Program Library v\d+\.\d+\.\d+</title>', '<title>WNMU Pledge Program Library</title>', text)
          text = re.sub(r'>v\d+\.\d+\.\d+<', '>v…<', text)
          path.write_text(text, encoding='utf-8')

          # The sole authoritative application revision.
          Path('version.json').write_text(json.dumps({'appVersion':'0.22.58','releasedAt':'2026-08-12'}, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Verify one source of truth
        shell: bash
        run: |
          node --check assets/js/core.js
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html').read_text(encoding='utf-8')
          core = Path('assets/js/core.js').read_text(encoding='utf-8')
          shell = Path('app-shell.html').read_text(encoding='utf-8')
          config = Path('config.js').read_text(encoding='utf-8')

          if "fetch(`version.json?_=${Date.now()}`" not in index:
              raise SystemExit('index does not load version.json dynamically')
          if re.search(r"const VERSION='\d+\.\d+\.\d+'", index):
              raise SystemExit('index still hardcodes a revision')
          if "window.__PLEDGE_APP_VERSION__" not in index or "window.__PLEDGE_APP_VERSION__" not in core:
              raise SystemExit('runtime version handoff is missing')
          if re.search(r"APP_VERSION:\s*'v?\d+\.\d+\.\d+'", core):
              raise SystemExit('core still hardcodes APP_VERSION')
          if 'APP_VERSION:' in config:
              raise SystemExit('config still contains APP_VERSION')
          if re.search(r'\?v=\d+\.\d+\.\d+', shell):
              raise SystemExit('app shell still hardcodes asset revision query strings')
          if re.search(r'v\d+\.\d+\.\d+', shell):
              raise SystemExit('app shell still contains a visible hardcoded revision')

          # Parse-check the launcher script itself.
          match = re.search(r'<script>\s*(\(async\(\)=>\{.*?\}\)\(\);)\s*</script>', index, flags=re.S)
          if not match:
              raise SystemExit('could not extract launcher script')
          Path('/tmp/index-launcher.js').write_text(match.group(1) + '\n', encoding='utf-8')
          PY
          node --check /tmp/index-launcher.js

          # 0.22.58 may appear only in version.json in the final application files.
          hits="$(grep -RIl --exclude='version.json' --exclude='fix-single-version-source.yml' '0\.22\.58' index.html app-shell.html config.js assets/js || true)"
          test -z "$hits"

      - name: Commit verified architecture fix
        shell: bash
        run: |
          rm .github/workflows/fix-single-version-source.yml
          git config user.name "Tod"
          git config user.email "tpoirier@nmu.edu"
          git add index.html app-shell.html config.js assets/js/core.js version.json .github/workflows/fix-single-version-source.yml

          changed="$(git diff --cached --name-only | grep -v '^\.github/workflows/fix-single-version-source.yml$' | sort)"
          expected="$(printf '%s\n' app-shell.html assets/js/core.js config.js index.html version.json | sort)"
          test "$changed" = "$expected"

          git commit -m "Use version.json as the single app revision source"
          git push origin HEAD:fix-single-version-source-20260812
