name: Remove last version literal

on:
  push:
    branches:
      - fix-single-version-source-20260812

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-single-version-source-20260812
          fetch-depth: 0
      - name: Remove static launcher revision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r'<title>WNMU Pledge Program Library v\d+\.\d+\.\d+</title>', '<title>WNMU Pledge Program Library</title>', text, count=1)
          if count != 1:
              raise SystemExit(f'launcher title replacements: {count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify no boot-path version literals
        shell: bash
        run: |
          node --check assets/js/core.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['index.html','app-shell.html','assets/js/core.js','config.js']:
              text = Path(name).read_text(encoding='utf-8')
              if re.search(r"v?0\.22\.\d+", text):
                  raise SystemExit(f'{name} still contains a 0.22.x application revision')
          version = Path('version.json').read_text(encoding='utf-8')
          if '0.22.58' not in version:
              raise SystemExit('version.json is not 0.22.58')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/remove-last-version-literal.yml
          git config user.name "Tod"
          git config user.email "tpoirier@nmu.edu"
          git add index.html .github/workflows/remove-last-version-literal.yml
          git commit -m "Remove hardcoded revision from launcher title"
          git push origin HEAD:fix-single-version-source-20260812
