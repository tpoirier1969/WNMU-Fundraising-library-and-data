<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WNMU One-Sheet Reports</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/pledge-icon-32.png">
  <link rel="stylesheet" href="assets/one-sheet-reports.css?v=0.22.137">
  <style>
    .report-selection{position:relative;min-width:280px}
    .report-fundraiser-picker{position:relative;width:100%}
    .report-fundraiser-trigger{width:100%;min-height:38px;display:flex;align-items:center;gap:9px;border:1px solid #aebfc7;border-radius:7px;background:#fff;color:#17384a;padding:6px 9px;text-align:left;cursor:pointer}
    .report-fundraiser-trigger:hover,.report-fundraiser-trigger:focus-visible{border-color:#6f9bb2;outline:none;box-shadow:0 0 0 2px rgb(20 95 145 / 12%)}
    .report-fundraiser-trigger-summary{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .report-fundraiser-trigger-count{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 7px;border-radius:999px;background:#eef4f7;color:#31586e;font-size:.8rem;font-weight:900}
    .report-fundraiser-trigger-arrow{font-size:.9rem;color:#536a76;transition:transform .15s ease}
    .report-fundraiser-picker.open .report-fundraiser-trigger-arrow{transform:rotate(180deg)}
    .report-fundraiser-picker .report-checks{display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:80;max-height:340px;overflow:auto;padding:6px;background:#fff;border:1px solid #aebfc7;border-radius:8px;box-shadow:0 12px 28px rgb(23 56 74 / 18%)}
    .report-fundraiser-picker.open .report-checks{display:grid;gap:2px}
    .report-fundraiser-picker .report-check{width:100%;border:0;border-radius:5px;padding:7px 8px;align-items:flex-start}
    .report-fundraiser-picker .report-check:hover{background:#f1f6f8}
    .report-fundraiser-picker .report-check input{margin-top:3px}
    .report-fundraiser-picker .report-check strong{font-size:.9rem}
    .report-fundraiser-picker .report-check small{font-size:.8rem}
    .daily-matrix .day-row-labels,.daily-matrix .day-value-lines{display:grid;gap:2px;margin-top:4px}
    .daily-matrix .day-row-labels span{display:block;margin:0;color:#415c69;font-weight:850;line-height:1.25}
    .daily-matrix .day-value-lines span{display:block;margin:0;color:#17384a;line-height:1.25}
    .daily-matrix .day-date-value{font-weight:900;color:#17384a;line-height:1.25}
    .daily-matrix .day-label-detail{margin-top:1px}
    .topic-empty-message{font-style:normal;text-align:left;line-height:1.3;color:#5d717c}
    @media(max-width:900px){.report-selection{min-width:0}.report-fundraiser-picker .report-checks{position:static;margin-top:5px;max-height:300px}}
    @media print{
      .report-fundraiser-picker{display:none!important}
      .comparison-sheet table{font-size:8pt}
      .comparison-sheet thead th{font-size:8pt}
      .comparison-sheet td span,.comparison-sheet th small,.comparison-sheet td small{font-size:8pt}
      .comparison-sheet .topic-programs{font-size:8pt!important}
      .comparison-sheet .sheet-footer,.comparison-sheet .data-quality-note{font-size:8pt}
      .comparison-sheet .report-chart svg text,.comparison-sheet .chart-legend,.comparison-sheet .chart-legend strong{font-size:8pt}
      .comparison-sheet .sheet-title p,.comparison-sheet .report-kicker,.comparison-sheet .section-heading p{font-size:13pt}
      .comparison-sheet .day-cell strong,.comparison-sheet .topic-performance-line strong{font-size:9pt}
      .comparison-sheet .day-row-labels span,.comparison-sheet .day-value-lines span{font-size:8pt}
    }

    .visual-overview{break-inside:auto}
    .visual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:12px}
    .visual-card{border:1px solid #d5e1e7;border-radius:9px;background:#fbfdfe;padding:12px;min-width:0;break-inside:avoid}
    .visual-card-wide{grid-column:1 / -1}
    .historical-range-controls{align-items:flex-end;flex-wrap:wrap}
    .historical-range-presets{display:flex;gap:6px;flex-wrap:wrap}
    .historical-range-controls .report-field{min-width:150px}
    .chart-grid-line-vertical{opacity:.55}
    .fiscal-ytd-note{margin:10px 0 0;color:#334f5e}
    .visual-card .section-heading{margin-bottom:4px}
    .visual-card h3{margin:0;color:#17384a;font-size:1rem}
    .visual-card .section-heading p{margin-top:4px;font-size:.82rem;line-height:1.35}
    .visual-card .report-chart{margin-top:4px}
    .historical-context-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
    .historical-context-grid article{border-left:4px solid #9bb8c7;background:#f6fafc;padding:10px 12px;break-inside:avoid}
    .historical-context-grid h3{margin:0 0 4px;color:#17384a;font-size:.95rem}
    .historical-context-grid p{margin:0;color:#334f5e;line-height:1.45}
    .report-bar-chart-svg rect{vector-effect:non-scaling-stroke}
    @media(max-width:900px){.visual-grid,.historical-context-grid{grid-template-columns:1fr}}
    @media print{
      .visual-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .visual-card{padding:7px}
      .visual-card .section-heading p{font-size:7.5pt}
      .visual-card h3{font-size:9pt}
      .historical-context-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
      .historical-context-grid p{font-size:8pt}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="assets/js/one-sheet-analysis.js?v=0.22.137"></script>
  <script defer src="assets/js/one-sheet-reports.js?v=0.22.137"></script>
</head>
<body>
  <div id="report-access-gate" class="report-access-gate hidden"></div>
  <div id="report-app" class="report-shell hidden">
    <header class="report-topbar">
      <div class="report-brand">
        <img src="assets/WNMU-TV-logo-head2019.png" alt="WNMU-TV PBS logo">
        <div>
          <h1 id="report-page-title">One-Sheet Reports</h1>
          <p id="report-page-subtitle">Printable retrospective fundraiser analysis</p>
        </div>
      </div>
      <div class="report-top-actions">
        <span id="report-role" class="report-role">Checking access…</span>
        <a class="report-button" href="reports.html">Report hub</a>
        <a class="report-button" href="./">Pledge Program Library</a>
      </div>
    </header>
    <main class="report-main">
      <div class="report-toolbar">
        <div id="report-controls"></div>
        <div id="report-status" class="report-status">Checking administrator access…</div>
      </div>
      <div id="report-output"></div>
    </main>
  </div>
  <script>
    (() => {
      function setText(node, value) {
        if (!node) return;
        const next = String(value ?? '');
        if (node.textContent !== next) node.textContent = next;
      }

      function textNode(tagName, className, value) {
        const node = document.createElement(tagName);
        if (className) node.className = className;
        node.textContent = String(value ?? '');
        return node;
      }

      function updatePickerSummary(picker) {
        const checks = picker.querySelector('#report-fundraiser-checks');
        const trigger = picker.querySelector('.report-fundraiser-trigger');
        if (!checks || !trigger) return;
        const selected = [...checks.querySelectorAll('input[type="checkbox"]:checked')];
        const summary = trigger.querySelector('.report-fundraiser-trigger-summary');
        const count = trigger.querySelector('.report-fundraiser-trigger-count');
        if (!selected.length) setText(summary, 'Choose fundraisers');
        else if (selected.length === 1) setText(summary, selected[0].closest('.report-check')?.querySelector('strong')?.textContent?.trim() || '1 fundraiser selected');
        else setText(summary, `${selected.length} fundraisers selected`);
        setText(count, String(selected.length));
      }

      function closePicker(picker) {
        picker?.classList.remove('open');
        picker?.querySelector('.report-fundraiser-trigger')?.setAttribute('aria-expanded', 'false');
      }

      function enhanceFundraiserPicker() {
        const checks = document.getElementById('report-fundraiser-checks');
        if (!checks || checks.closest('.report-fundraiser-picker')) return;
        const selection = checks.closest('.report-selection');
        if (!selection) return;

        const picker = document.createElement('div');
        picker.className = 'report-fundraiser-picker';
        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'report-fundraiser-trigger';
        trigger.setAttribute('aria-expanded', 'false');
        trigger.setAttribute('aria-controls', 'report-fundraiser-checks');
        trigger.innerHTML = '<span class="report-fundraiser-trigger-summary">Choose fundraisers</span><span class="report-fundraiser-trigger-count">0</span><span class="report-fundraiser-trigger-arrow" aria-hidden="true">▼</span>';

        selection.insertBefore(picker, checks);
        picker.append(trigger, checks);
        updatePickerSummary(picker);

        trigger.addEventListener('click', () => {
          const opening = !picker.classList.contains('open');
          document.querySelectorAll('.report-fundraiser-picker.open').forEach((other) => { if (other !== picker) closePicker(other); });
          picker.classList.toggle('open', opening);
          trigger.setAttribute('aria-expanded', opening ? 'true' : 'false');
        });
        trigger.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            closePicker(picker);
            trigger.focus();
          }
        });
        checks.addEventListener('change', () => updatePickerSummary(picker));
      }

      function fundraiserDateRanges() {
        const ranges = new Map();
        document.querySelectorAll('#report-fundraiser-checks .report-check').forEach((label) => {
          const title = label.querySelector('strong')?.textContent?.trim() || '';
          const detail = label.querySelector('small')?.textContent?.trim() || '';
          const dateRange = detail.split(' · ')[0]?.trim() || '';
          if (title && dateRange) ranges.set(title, dateRange);
        });
        return ranges;
      }

      function enhanceComparisonHeadings(report) {
        const ranges = fundraiserDateRanges();
        report.querySelectorAll('table thead th:not(:first-child)').forEach((heading) => {
          const title = heading.querySelector('strong')?.textContent?.trim() || '';
          const small = heading.querySelector('small');
          const dateRange = ranges.get(title);
          if (small && dateRange) setText(small, dateRange);
        });
      }

      function normalizeIncomePledges(text) {
        return String(text || '')
          .replace(/\s+pledges?$/i, '')
          .replace(' · ', ' / ');
      }

      function normalizeWeather(text) {
        const value = String(text || '')
          .trim()
          .replace(/^regional\s+weather\s*/i, '')
          .replace(/^weather\s*/i, '');
        if (!value || value === '—') return '— / —';
        return value.replace(' · ', ' / ');
      }

      function enhanceDailyMatrix(report) {
        const table = report.querySelector('.daily-matrix table');
        if (!table || table.dataset.detailGridEnhanced === 'true') return;
        table.dataset.detailGridEnhanced = 'true';

        const headers = [...table.querySelectorAll('thead th')];
        const fundraiserCount = Math.max(1, headers.length - 1);
        const labelWidth = 26;
        const dataWidth = (100 - labelWidth) / fundraiserCount;
        const colgroup = document.createElement('colgroup');
        const labelCol = document.createElement('col');
        labelCol.style.width = `${labelWidth}%`;
        colgroup.appendChild(labelCol);
        for (let index = 0; index < fundraiserCount; index += 1) {
          const col = document.createElement('col');
          col.style.width = `${dataWidth}%`;
          colgroup.appendChild(col);
        }
        table.prepend(colgroup);
        table.style.tableLayout = 'fixed';

        table.querySelectorAll('tbody tr').forEach((row) => {
          const cells = [...row.children];
          const heading = cells[0];
          if (!heading) return;
          const title = heading.querySelector('strong')?.textContent?.trim() || '';
          const detail = (heading.querySelector('small')?.textContent || '')
            .replace(/\s*·\s*pre-Saturday start/i, '')
            .trim();
          const labels = textNode('div', 'day-row-labels', '');
          ['$ / Hr (avg)', 'Pledge hours / rate base', 'Total income / No. pledges', 'Regional temp / rainfall']
            .forEach((label) => labels.appendChild(textNode('span', '', label)));
          heading.replaceChildren(
            textNode('strong', '', title),
            textNode('small', 'day-label-detail', detail),
            labels
          );

          cells.slice(1).forEach((cell) => {
            if (cell.classList.contains('muted-cell')) return;
            const rate = cell.querySelector('strong')?.textContent?.trim() || '—';
            const dateAndHours = cell.querySelector('span')?.textContent?.trim() || '';
            const parts = dateAndHours.split(' · ').map((value) => value.trim()).filter(Boolean);
            const date = parts.shift() || '—';
            const pledgeHours = parts.length ? parts.join(' / ') : '—';
            const smalls = [...cell.querySelectorAll('small')];
            const incomePledges = normalizeIncomePledges(smalls[0]?.textContent || '') || '— / —';
            const weather = normalizeWeather(smalls[1]?.textContent || '');
            const values = textNode('div', 'day-value-lines', '');
            [rate, pledgeHours, incomePledges, weather].forEach((value) => values.appendChild(textNode('span', '', value)));
            cell.replaceChildren(textNode('div', 'day-date-value', date), values);
          });
        });
      }

      function enhanceTopicMatrix(report) {
        const section = report.querySelector('.topic-matrix');
        if (!section) return;
        section.querySelectorAll('tbody td.muted-cell').forEach((cell) => {
          cell.classList.add('topic-empty-message');
          setText(cell, 'No programming within this topic occurred during this fundraiser.');
        });
      }

      function enhanceComparisonReport() {
        const report = document.querySelector('.comparison-sheet');
        if (!report) return;
        enhanceComparisonHeadings(report);
        enhanceDailyMatrix(report);
        enhanceTopicMatrix(report);
      }

      document.addEventListener('click', (event) => {
        document.querySelectorAll('.report-fundraiser-picker.open').forEach((picker) => {
          if (!picker.contains(event.target)) closePicker(picker);
        });
      });

      const observer = new MutationObserver(() => {
        enhanceFundraiserPicker();
        enhanceComparisonReport();
      });
      observer.observe(document.body, { childList: true, subtree: true });
      enhanceFundraiserPicker();
      enhanceComparisonReport();
    })();
  </script>
</body>
</html>
