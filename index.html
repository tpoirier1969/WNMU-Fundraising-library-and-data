<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WNMU Pledge Program Library v0.22.54</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#eef4f7;color:#223a47}
    .split-boot{min-height:100vh;display:grid;place-items:center;padding:24px}
    .split-boot-card{width:min(560px,100%);padding:24px;border:1px solid #cbd8de;border-radius:16px;background:#fff;box-shadow:0 14px 36px rgb(34 63 77 / 12%)}
    .split-boot-card h1{margin:0 0 8px;font-size:1.25rem}.split-boot-card p{margin:0;color:#586a74}
  </style>
</head>
<body>
  <main class="split-boot"><div class="split-boot-card"><h1>Loading Pledge Program Library…</h1><p id="split-boot-status">Building the split-screen workspace.</p></div></main>
  <script>
  (async()=>{
    'use strict';
    const VERSION='0.22.54', LABEL=`v${VERSION}`, status=document.getElementById('split-boot-status');
    const setStatus=(message)=>{if(status)status.textContent=message};
    const versioned=(value='')=>{
      if(!value)return value;
      try{
        const url=new URL(value,window.location.href);
        if(url.origin!==window.location.origin||url.pathname.endsWith('config.js'))return value;
        url.searchParams.set('v',VERSION);
        return `${url.pathname}${url.search}${url.hash}`;
      }catch(_error){return value}
    };
    const disclosure=(doc,key,label)=>{
      const node=doc.createElement('details');
      node.className='library-detail-section';
      node.dataset.libraryDetailSection=key;
      node.open=true;
      node.innerHTML=`<summary><span>${label}</span></summary><div class="library-detail-section-body"></div>`;
      return node;
    };
    function buildSplit(doc){
      const pane=doc.querySelector('[data-workspace-pane="library"]');
      const list=pane?.querySelector(':scope > .list-panel');
      const modal=doc.getElementById('detail-modal');
      const content=doc.getElementById('detail-content');
      if(!pane||!list||!modal||!content)throw new Error('Required Program Library elements were not found in app-shell.html.');
      doc.body.classList.add('library-split-default','library-detail-embedded');
      pane.dataset.librarySplitView='library';
      const mobile=doc.createElement('div');
      mobile.id='library-split-mobile-switcher';
      mobile.className='library-split-mobile-switcher';
      mobile.innerHTML='<button type="button" class="ghost active" id="library-split-library-button">Library</button><button type="button" class="ghost" id="library-split-detail-button">Details / Add</button>';
      const divider=doc.createElement('button');
      divider.id='library-split-divider';divider.type='button';divider.title='Drag to resize the Program Library and detail panes';divider.setAttribute('aria-label',divider.title);
      const host=doc.createElement('aside');
      host.id='library-split-detail-host';host.setAttribute('aria-label','Pledge program details and Add Program');
      list.after(mobile,divider,host);host.append(modal);
      const actions=modal.querySelector('.detail-header .toolbar-actions');
      if(actions&&!doc.getElementById('library-split-add-button')){
        const add=doc.createElement('button');add.type='button';add.id='library-split-add-button';add.className='ghost hidden';add.textContent='Add Program';actions.prepend(add);
      }
      const form=doc.getElementById('detail-edit-form');
      const lead=content.querySelector('.detail-lead-block');
      const sections=[...content.querySelectorAll(':scope > section')];
      const find=(heading)=>sections.find((section)=>section.querySelector('h3')?.textContent.trim().toLowerCase()===heading.toLowerCase());
      const overview=find('Overview'),timing=find('Timing & segment structure'),airings=find('Air dates & contributions'),premiums=find('Premiums'),graph=find('Income over time'),allFields=find('All known program fields');
      if(form){const node=disclosure(doc,'editor','Program editor');node.classList.add('library-editor-section');form.before(node);node.querySelector('.library-detail-section-body').append(form)}
      if(lead||overview){
        const node=disclosure(doc,'overview','Overview');(lead||overview).before(node);const body=node.querySelector('.library-detail-section-body');
        if(lead)body.append(lead);
        if(overview){body.append(overview);const extra=doc.createElement('div');extra.id='library-additional-program-details';extra.className='library-additional-program-details hidden';extra.innerHTML='<h4>Additional program details</h4><dl id="library-additional-program-grid" class="overview-grid"></dl>';overview.append(extra)}
      }
      if(timing||premiums){const node=disclosure(doc,'pledge','Pledge Details');(timing||premiums).before(node);const body=node.querySelector('.library-detail-section-body');if(timing)body.append(timing);if(premiums)body.append(premiums)}
      if(airings||graph){const node=disclosure(doc,'results','Air Details & Results');(airings||graph).before(node);const body=node.querySelector('.library-detail-section-body');if(airings)body.append(airings);if(graph)body.append(graph)}
      if(allFields){allFields.id='library-hidden-all-fields';allFields.setAttribute('aria-hidden','true')}
    }
    function injectAssets(doc){
      const css=doc.createElement('link');css.rel='stylesheet';css.href=`assets/library-split-default.css?v=${VERSION}`;doc.head.append(css);
      const popupCss=doc.createElement('link');popupCss.rel='stylesheet';popupCss.href=`assets/library-detail-popup-restore.css?v=${VERSION}`;doc.head.append(popupCss);
      const core=[...doc.querySelectorAll('script[src]')].find((script)=>/assets\/js\/core\.js/i.test(script.getAttribute('src')||''));
      if(core){const override=doc.createElement('script');override.textContent=`window.addEventListener('DOMContentLoaded',()=>{if(window.PledgeLib?.constants)window.PledgeLib.constants.APP_VERSION='${LABEL}'})`;core.after(override)}
      const appInit=[...doc.querySelectorAll('script[src]')].find((script)=>/assets\/js\/app-init\.js/i.test(script.getAttribute('src')||''));
      const controller=doc.createElement('script');controller.defer=true;controller.src=`assets/js/library-split-default.js?v=${VERSION}`;
      const workspaceFix=doc.createElement('script');workspaceFix.defer=true;workspaceFix.src=`assets/js/library-detail-workspace-fix.js?v=${VERSION}`;
      if(appInit){appInit.before(controller);appInit.before(workspaceFix)}else{doc.head.append(controller,workspaceFix)}
    }
    try{
      setStatus('Loading the application shell…');
      const response=await fetch(`app-shell.html?v=${VERSION}&_=${Date.now()}`,{cache:'no-store'});
      if(!response.ok)throw new Error(`Could not load app-shell.html (${response.status}).`);
      const doc=new DOMParser().parseFromString(await response.text(),'text/html');
      doc.title=`WNMU Pledge Program Library ${LABEL}`;
      doc.querySelectorAll('script[src]').forEach((script)=>script.setAttribute('src',versioned(script.getAttribute('src')||'')));
      doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach((link)=>link.setAttribute('href',versioned(link.getAttribute('href')||'')));
      const flag=doc.getElementById('version-flag'),footer=doc.getElementById('footer-version');if(flag)flag.textContent=LABEL;if(footer)footer.textContent=LABEL;
      buildSplit(doc);injectAssets(doc);
      document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close();
    }catch(error){console.error(error);setStatus(`The Pledge Program Library could not start: ${error.message||error}`)}
  })();
  </script>
</body>
</html>
