<!doctype html>

  <meta charset="utf-8">

  <title>Fundraiser Programming Strategy · WNMU-TV PBS</title>
  <style id="strategy-version-guard-style">html{visibility:hidden}</style>
  <script>
    (async()=>{
      const reveal=()=>document.getElementById('strategy-version-guard-style')?.remove();
      try{
        const response=await fetch(`version.json?_=${Date.now()}`,{cache:'no-store'});
        if(!response.ok)throw new Error(`version.json ${response.status}`);
        const versionText=(await response.text()).replace(/^\uFEFF/,'').trim();
        let payload;
        try{
          payload=JSON.parse(versionText);
        }catch(firstError){
          const repaired=versionText.replace(/\\n+\s*$/,'').trim();
          if(repaired===versionText)throw firstError;
          payload=JSON.parse(repaired);
        }
        const version=String(payload?.appVersion||payload?.version||'').trim().replace(/^v/i,'');
        if(version){
          const url=new URL(window.location.href);
          if(url.searchParams.get('v')!==version){
            url.searchParams.set('v',version);
            window.location.replace(url.toString());
            return;
          }
        }
      }catch(error){
        console.warn('Strategy version check failed.',error);
      }
      reveal();
    })();
  </script>
